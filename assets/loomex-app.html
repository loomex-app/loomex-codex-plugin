        const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` }, `Rating (${minimum} to ${maximum})`);
        label.append(element("input", {
          id: `question-${questionIndex}-value`, type: "number", min: String(minimum), max: String(maximum), step: "1",
          value: Number.isSafeInteger(answer.value) ? String(answer.value) : "", dataset: { value: "true" },
          "aria-labelledby": `${legendId} ${labelId}`, "aria-describedby": errorId,
        }));
        stack.append(label);
      }
    } else {
      for (const [optionIndex, option] of (Array.isArray(spec.options) ? spec.options : []).entries()) {
        const optionId = String(option && option.id !== undefined ? option.id : `option_${optionIndex + 1}`);
        const optionLabel = String(option && (option.label || option.text) || optionId);
        const id = `question-${questionIndex}-option-${optionIndex}`;
        const selected = inputType === "checkbox"
          ? Array.isArray(answer.values) && answer.values.includes(optionId)
          : answer.value === optionId;
        const label = element("label", { className: "choice", htmlFor: id });
        label.append(setChoiceName(element("input", {
          id, type: inputType, value: optionId, checked: selected, dataset: { option: optionId },
        }), questionIndex), element("span", {}, optionLabel));
        stack.append(label);
      }
      appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer);
    }
    const error = element("p", { id: errorId, className: "field-error", role: "alert", hidden: true, dataset: { fieldError: "true" } });
    fieldset.append(stack, error);
    form.append(fieldset);
  }

  function questionForm(spec, schema, initial, request) {
    form.replaceChildren();
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch ? spec.questions : [spec];
    appendRequestCopy(request || {}, spec);
    if (questions.length > 1) form.append(element("p", { className: "form-guide" }, `${questions.length} questions · * Required`));
    const acceptance = humanPresentation(request || {})?.kind === "review" && questions.length === 1 &&
      normalizeInputType(questions[0].inputType || spec.inputType) === "boolean";
    questions.forEach((question, index) => renderQuestion({
      ...question,
      inputType: question.inputType || spec.inputType,
      acceptanceLabels: acceptance,
    }, schema, initial || {}, index, batch));
    form.dataset.formKind = "questions";
    form.dataset.collectionMode = batch ? "batch" : "single";
    form.hidden = false;
  }

  function typedForm(schema, initial, spec, request = {}) {
    if (inputSpecSupported(spec)) {
      questionForm(spec, schema, initial, request);
      return true;
    }
    if (spec && typeof spec === "object" && Object.keys(spec).length) {
      form.replaceChildren();
      appendRequestCopy(request, spec);
      form.append(element("p", { className: "notice error", role: "alert" }, "This question cannot be displayed here. Continue in the conversation for help with this request."));
      form.dataset.formKind = "invalid-questions";
      form.hidden = false;
      setError(new Error("This question cannot be displayed here. Continue in the conversation for help with this request."));
      return false;
    }
    form.replaceChildren();
    appendRequestCopy(request, spec);
    const properties = schema && schema.properties && typeof schema.properties === "object" ? schema.properties : null;
    const supported = properties && Object.values(properties).every((field) =>
      field && typeof field === "object" &&
      (Array.isArray(field.enum) || ["string", "boolean", "integer", "number"].includes(field.type))
    );
    if (!properties || !supported) {
      form.append(element("p", { className: "notice", role: "status" }, "This form cannot be displayed here. Continue in the conversation to provide your answer."));
      form.dataset.formKind = "unsupported";
      form.hidden = false;
      return false;
    }
    form.dataset.formKind = "generic";
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    for (const [name, field] of Object.entries(properties)) {
      const label = document.createElement("label");
      label.className = "field-label";
      label.htmlFor = `schema-${name}`;
      label.textContent = mode === "monitor" && name === "reason"
        ? "Cancellation reason"
        : name.replaceAll("_", " ");
      let control;
      if (Array.isArray(field.enum)) {
        control = document.createElement("select");
        const empty = element("option", { value: "", disabled: true }, "Choose an option");
        control.append(empty);
        for (const optionValue of field.enum) {
          const option = document.createElement("option");
          option.value = String(optionValue);
          option.textContent = String(optionValue);
          control.append(option);
        }
      } else if (field.type === "boolean") {
        control = document.createElement("select");
        control.append(element("option", { value: "", disabled: true }, "Choose yes or no"));
        for (const [value, bool] of [["true", "Yes"], ["false", "No"]]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = bool;
          control.append(option);
        }
      } else {
        control = document.createElement("input");
        control.type = field.type === "integer" || field.type === "number" ? "number" : "text";
      }
      control.id = `schema-${name}`;
      control.dataset.field = name;
      control.dataset.type = field.type || "string";
      control.dataset.required = required.has(name) ? "true" : "false";
      if (initial && initial[name] !== undefined) control.value = String(initial[name]);
      label.append(control);
      form.append(label);
    }
    form.dataset.formKind = "schema";
    form.hidden = false;
    return true;
  }

  function clearQuestionErrors() {
    for (const fieldset of form.querySelectorAll("fieldset[data-question-id]")) {
      for (const control of fieldset.querySelectorAll("input, textarea, select")) control.removeAttribute("aria-invalid");
      const error = fieldset.querySelector("[data-field-error]");
      if (error) { error.hidden = true; error.textContent = ""; }
    }
  }

  function questionError(fieldset, message, target) {
    const error = fieldset.querySelector("[data-field-error]");
    if (error) { error.textContent = message; error.hidden = false; }
    const focusTarget = target || fieldset.querySelector("input, textarea, select");
    if (focusTarget) {
      focusTarget.setAttribute("aria-invalid", "true");
      focusTarget.focus();
    }
    throw new Error(message);
  }

  function validDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return false;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    if (year < 1 || month < 1 || month > 12 || day < 1) return false;
    const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
    const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return day <= days[month - 1];
  }

  function collectQuestion(fieldset) {
    const type = fieldset.dataset.inputType;
    const required = fieldset.dataset.required === "true";
    if (["text", "long_text", "date"].includes(type)) {
      const control = fieldset.querySelector("[data-value]");
      const value = control ? control.value : "";
      if (required && !value.trim()) questionError(fieldset, "Answer this question.", control);
      if (type === "date" && value && !validDate(value)) questionError(fieldset, "Enter a real date in YYYY-MM-DD format.", control);
      return value === "" && !required ? {} : { value };
    }
    if (type === "boolean") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose Yes or No.");
      return selected ? { value: selected.value === "true" } : {};
    }
    if (type === "rating") {
      const control = fieldset.querySelector('input[type="radio"]:checked, [data-value]');
      const raw = control ? control.value : "";
      if (!raw && required) questionError(fieldset, "Choose a rating.");
      if (!raw) return {};
      const value = Number(raw);
      const minimum = Number(fieldset.dataset.minimum);
      const maximum = Number(fieldset.dataset.maximum);
      if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
        questionError(fieldset, `Enter a whole number from ${minimum} to ${maximum}.`, control);
      }
      return { value };
    }
    if (type === "radio") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose one option.");
      if (!selected) return {};
      const answer = { value: selected.value };
      if (selected.value === "other") {
        const other = fieldset.querySelector("[data-other-text]");
        if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
        answer.otherText = other.value;
      }
      return answer;
    }
    const selected = [...fieldset.querySelectorAll('input[type="checkbox"]:checked')];
    if (!selected.length && required) questionError(fieldset, "Choose at least one option.");
    if (!selected.length) return {};
    const answer = { values: selected.map((control) => control.value) };
    if (answer.values.includes("other")) {
      const other = fieldset.querySelector("[data-other-text]");
      if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
      answer.otherText = other.value;
    }
    return answer;
  }

  function collectAnswer() {
    if (["unsupported", "invalid-questions"].includes(form.dataset.formKind)) {
      throw new Error("This form cannot be displayed here. Continue in the conversation to provide your answer.");
    }
    const questionFields = [...form.querySelectorAll("fieldset[data-question-id]")];
    if (questionFields.length) {
      clearQuestionErrors();
      const batch = form.dataset.collectionMode === "batch";
      const answers = questionFields.map((fieldset) => ({
        questionId: fieldset.dataset.questionId,
        ...collectQuestion(fieldset),
      }));
      if (batch) return { answers };
      const [{ questionId: _questionId, ...answer }] = answers;
      return answer;
    }
    const answer = {};
    for (const control of form.querySelectorAll("[data-field]")) {
      const field = control.dataset.field;
      const type = control.dataset.type;
      const required = control.dataset.required === "true";
      if (control.value === "" && !required) continue;
      if (control.value === "" && required) throw new Error(`Enter ${field}.`);
      if (type === "boolean") answer[field] = control.value === "true";
      else if (type === "integer") answer[field] = Number.parseInt(control.value, 10);
      else if (type === "number") answer[field] = Number(control.value);
      else answer[field] = control.value;
    }
    return answer;
  }

  // Browsing only reads metadata. Execution preparation stays in the conversation.
  let browserPage = null;
  let browserArgs = { limit: 20 };
  let browserHistory = [];
  let browserSelected = null;
  let browserDetailResponse = null;
  let browserBusy = false;
  let browserEpoch = 0;
  const workflowIdValid = (id) => typeof id === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

  function browserButton(label, action, disabled = false) {
    const button = element("button", { type: "button", className: "secondary", disabled: disabled || !connected || browserBusy }, label);
    button.addEventListener("click", () => { if (!browserBusy && connected) action(); });
    return button;
  }

  async function browserRead(name, args, commit) {
    if (browserBusy || !connected) return;
    const epoch = ++browserEpoch;
    browserBusy = true;
    renderBrowser();
    summary.textContent = "Loading workflows…";
    summary.classList.remove("error");
    try {
      const result = await callTool(name, args, false);
      if (epoch !== browserEpoch) return;
      if (result.isError || result.structuredContent?.ok === false) throw new Error("Workflows could not be loaded. Try Refresh again.");
      const data = dataOf(result);
      if (pagedResponse(data)) {
        if (name === "loomex_workflows_list") { browserDetailResponse = null; commit(data); }
        else browserDetailResponse = { data, workflowId: args.workflowId };
      }
      else {
      if (name === "loomex_workflows_list" && !Array.isArray(data.workflows)) throw new Error("The workflow list is unavailable. Continue in the conversation.");
      if (name === "loomex_workflow_get" && (!data.workflow || data.workflow.id !== args.workflowId)) throw new Error("The workflow details could not be verified. Refresh and try again.");
      browserDetailResponse = null; commit(data);
      }
      authoritativeStateStale = false;
      summary.textContent = browserSelected ? "Review this workflow before preparing a run." : "Choose a workflow to review or prepare.";
    } catch (error) { if (epoch === browserEpoch) { authoritativeStateStale = true; setError(error); } }
    finally { if (epoch === browserEpoch) { browserBusy = false; renderBrowser(); } }
  }

  function loadBrowserPage(args, history) {
    return browserRead("loomex_workflows_list", args, (data) => {
      browserPage = data; browserArgs = args; browserHistory = history; browserSelected = null;
    });
  }

  async function requestWorkflowPreparation(id, detailData = browserSelected) {
    if (mode === "browser") return beginRunSetup(id, detailData);
    if (!workflowIdValid(id) || browserBusy || authoritativeStateStale) return;
    browserBusy = true;
    renderWorkflowDetail(detailData, { onPrepare: () => requestWorkflowPreparation(id, detailData) });
    try {
      const version = workflowVersionNumber(detailData?.selectedVersion);
      const result = await callTool("loomex_run_setup", { workflowId: id, ...(Number.isInteger(version) && version > 0 ? { version: String(version) } : {}) }, false);
      if (result?.isError || result?.structuredContent?.ok === false) throw new Error("Run setup could not be loaded. Try again or continue in the conversation.");
      const data = dataOf(result);
      if (!selectedWorkflowVersion(data) || data.workflow.id !== id) throw new Error("The exact workflow version could not be verified for run setup.");
      initializeRunSetup(data, false);
    } catch (error) { setError(error); }
    finally { browserBusy = false; runFlow ? renderIntegratedRunFlow() : renderWorkflowDetail(detailData, { onPrepare: () => requestWorkflowPreparation(id, detailData) }); }
  }

  async function requestCompleteWorkflowResponse(paged, rerender) {
    if (browserBusy || !connected) return;
    browserBusy = true; rerender();
    try {
      const result = await send("ui/message", { role: "user", content: [{ type: "text", text: `Read and present the complete Loomex workflow response using loomex_response_read with responseRef ${paged.responseRef}. Start at offset 0 and follow all nextOffset pages. This is a read-only request.` }] });
      if (result?.isError) throw new Error("The host could not send this request. Continue in the conversation to retrieve the workflow response.");
      summary.textContent = "The conversation has been asked to retrieve the complete workflow response.";
    } catch (error) { setError(error); }
    finally { browserBusy = false; rerender(); }
  }

  function renderWorkflowPagedResponse(paged, options = {}) {
    context.hidden = false; context.className = "ui-stack";
    context.setAttribute("aria-label", "Workflow response");
    context.setAttribute("aria-busy", String(browserBusy));
    context.replaceChildren();
    form.hidden = true; primary.hidden = true; secondary.hidden = true;
    refresh.disabled = !connected || browserBusy;
    if (options.onBack) context.append(browserButton("Back to workflows", options.onBack));
    context.append(element("p", { className: "ui-caption" }, "This workflow response is too large for the inline view. Read the complete response in the conversation."));
    context.append(browserButton("View complete response", () => requestCompleteWorkflowResponse(paged, () => renderWorkflowPagedResponse(paged, options)), authoritativeStateStale));
  }

  function workflowVersionNumber(version) {
    return Number.isInteger(version?.versionNumber) ? version.versionNumber : Number.isInteger(version?.version) ? version.version : undefined;
  }

  function workflowRefreshArgs(data) {
    const workflowId = safeText(data?.workflow?.id, 64) || findId(data, "workflowId");
    const selectedVersion = workflowVersionNumber(data?.selectedVersion);
    return {
      workflowId,
      ...(Number.isInteger(selectedVersion) && selectedVersion > 0 ? { version: String(selectedVersion) } : {}),
    };
  }

  function workflowDefinition(data) {
    const version = data?.selectedVersion || data?.activeVersion || data?.version || {};
    return { version, definition: version && typeof version.definition === "object" && version.definition ? version.definition : {} };
  }

  function workflowInputSchema(data, definition) {
    const settings = definition.settings && typeof definition.settings === "object" ? definition.settings : {};
    if (settings.inputSchema && typeof settings.inputSchema === "object") return settings.inputSchema;
    const start = Array.isArray(definition.nodes) && definition.nodes.find((node) => node && node.type === "start" && node.inputSchema && typeof node.inputSchema === "object");
    if (start) return start.inputSchema;
    return data?.inputSchema && typeof data.inputSchema === "object" ? data.inputSchema : {};
  }

  function workflowNodes(data, definition) {
    return Array.isArray(definition.nodes) ? definition.nodes : Array.isArray(data?.nodes) ? data.nodes : [];
  }

  function schemaType(schema) {
    if (!schema || typeof schema !== "object") return undefined;
    if (Array.isArray(schema.type)) return schema.type.map((item) => safeText(item, 40)).filter(Boolean).join(" or ") || undefined;
    return safeText(schema.type, 40) || (Array.isArray(schema.enum) ? "choice" : undefined);
  }

  function authoredLabel(key, schema) {
    const title = safeText(schema?.title, 120);
    if (title) return title;
    const text = safeText(key, 120);
    return text ? text.replaceAll("_", " ").replace(/([a-z0-9])([A-Z])/g, "$1 $2") : undefined;
  }

  function workflowProviders(nodes) {
    const providers = [];
    const seen = new Set();
    for (const node of nodes) {
      if (!node || !["ai_agent", "ai_prompt", "person"].includes(node.type)) continue;
      const config = node.config && typeof node.config === "object" ? node.config : {};
      const resolution = config.modelResolution && typeof config.modelResolution === "object" ? config.modelResolution : {};
      const provider = safeText(resolution.provider || config.provider || config.providerFamily, 120);
      const model = safeText(resolution.runtimeModel || resolution.model || config.model || config.modelKey, 160);
      const effort = safeText(config.reasoningEffort || config.reasoning_effort || config.effort, 80);
      if (!provider && !model && !effort) continue;
      const key = [provider, model, effort].join("\u0000");
      if (seen.has(key)) continue;
      seen.add(key); providers.push({ provider, model, effort });
    }
    return { items: providers.slice(0, 20), total: providers.length };
  }

  function renderWorkflowDetail(data, options = {}) {
    const workflow = data?.workflow || {};
    const { version, definition } = workflowDefinition(data);
    const nodes = workflowNodes(data, definition);
    const root = element("div", { className: "workflow-detail" });
    const heading = element("div", { className: "workflow-detail-heading" });
    const hero = element("div", { className: "ui-hero" });
    hero.append(element("h2", {}, safeText(workflow.name) || "Workflow"));
    const description = safeText(workflow.description || workflow.metadata?.description);
    if (description) hero.append(element("p", { className: "ui-caption" }, description));
    const meta = [formatStatus(workflow.status), workflowVersionNumber(version) !== undefined ? `Version ${workflowVersionNumber(version)}` : undefined];
    if (nodes.length) meta.push(`${nodes.length} step${nodes.length === 1 ? "" : "s"}`);
    hero.append(element("p", { className: "ui-meta" }, meta.filter(Boolean).join(" · ")));
    heading.append(hero);
    if (options.onBack) heading.append(browserButton("Back to workflows", options.onBack));
    root.append(heading);

    const inputSchema = workflowInputSchema(data, definition);
    const properties = inputSchema.properties && typeof inputSchema.properties === "object" ? inputSchema.properties : {};
    const inputEntries = Object.entries(properties);
    const required = new Set(Array.isArray(inputSchema.required) ? inputSchema.required.filter((item) => typeof item === "string") : []);
    const inputs = element("section", { className: "workflow-detail-section", "aria-label": "Input requirements" });
    inputs.append(element("h3", { className: "ui-label" }, "Input requirements"));
    const inputList = element("dl", { className: "workflow-detail-list" });
    for (const [key, schema] of inputEntries.slice(0, 50)) {
      const label = authoredLabel(key, schema);
      if (!label) continue;
      const row = element("div", { className: "workflow-detail-item" });
      row.append(element("dt", { className: "ui-value" }, label));
      const value = element("dd", { className: "ui-meta" });
      const type = schemaType(schema);
      if (type) value.append(element("span", {}, type));
      if (required.has(key)) value.append(element("span", { className: "ui-badge" }, "Required"));
      row.append(value); inputList.append(row);
    }
    if (inputList.childElementCount) inputs.append(inputList);
    else inputs.append(element("p", { className: "ui-caption" }, "No startup inputs are declared."));
    if (inputEntries.length > 50) inputs.append(element("p", { className: "ui-caption" }, `Showing the first 50 of ${inputEntries.length} input requirements.`));
    root.append(inputs);

    const providers = workflowProviders(nodes);
    if (providers.total) {
      const providerSection = element("section", { className: "workflow-detail-section", "aria-label": "AI configuration" });
      providerSection.append(element("h3", { className: "ui-label" }, "AI configuration"));
      const providerList = element("dl", { className: "workflow-detail-list" });
      for (const provider of providers.items) {
        const row = element("div", { className: "workflow-detail-item" });
        row.append(element("dt", { className: "ui-value" }, provider.provider || provider.model || "AI step"));
        const labels = [provider.provider && provider.model ? provider.model : undefined, provider.effort ? `${provider.effort} effort` : undefined].filter(Boolean);
        row.append(element("dd", { className: "ui-meta" }, labels.join(" · ")));
        providerList.append(row);
      }
      providerSection.append(providerList);
      if (providers.total > providers.items.length) providerSection.append(element("p", { className: "ui-caption" }, `Showing ${providers.items.length} of ${providers.total} AI configurations.`));
      root.append(providerSection);
    }

    const policy = safeText(definition.executionPolicy, 120);
    const semantics = element("section", { className: "workflow-detail-section", "aria-label": "Execution and workspace" });
    semantics.append(element("h3", { className: "ui-label" }, "Execution and workspace"));
    if (policy) {
      const policyCopy = policy === "host_user/v1" ? "Runs with the signed-in macOS user's permissions." : undefined;
      semantics.append(element("p", { className: "ui-value" }, policy), ...(policyCopy ? [element("p", { className: "ui-caption" }, policyCopy)] : []));
    }
    semantics.append(element("p", { className: "ui-caption" }, "The workspace is selected and reviewed when preparing a run."));
    root.append(semantics);

    if (nodes.length) {
      const details = element("details", { className: "ui-disclosure" });
      details.append(element("summary", {}, `Workflow steps (${nodes.length})`));
      const list = element("ol", { className: "ui-list" });
      for (const node of nodes.slice(0, 100)) {
        const name = safeText(node?.name, 240);
        const type = safeText(node?.type, 120);
        list.append(element("li", {}, [name, type && type !== name ? formatStatus(type) : undefined].filter(Boolean).join(" · ") || "Unnamed step"));
      }
      details.append(list);
      if (nodes.length > 100) details.append(element("p", { className: "ui-caption" }, `Showing the first 100 of ${nodes.length} steps.`));
      root.append(details);
    }
    if (options.onPrepare) {
      const actions = element("div", { className: "actions" });
      actions.append(browserButton("Prepare run", options.onPrepare, authoritativeStateStale));
      root.append(actions);
    }
    context.className = "ui-stack"; context.hidden = false;
    context.setAttribute("aria-label", "Workflow detail");
    context.setAttribute("aria-busy", String(browserBusy));
    context.replaceChildren(root);
  }

  function renderAuthoringWorkflow(data) {
    const paged = pagedResponse(data);
    if (paged) {
      renderWorkflowPagedResponse(paged);
      return;
    }
    const workflow = data?.workflow || {};
    renderWorkflowDetail(data, { onPrepare: () => requestWorkflowPreparation(workflow.id, data) });
  }

  function renderBrowser() {
    if (runFlow) { renderIntegratedRunFlow(); return; }
    context.hidden = false; context.className = "ui-stack"; context.setAttribute("aria-label", "Workflow browser");
    context.setAttribute("aria-busy", String(browserBusy)); context.replaceChildren();
    form.hidden = true; primary.hidden = true; secondary.hidden = true;
    refresh.disabled = !connected || browserBusy;
    const hero = element("div", { className: "ui-hero" });
    hero.append(element("h2", {}, browserSelected ? safeText(browserSelected.workflow.name) || "Workflow" : "Workflows"));
    context.append(hero);
    const paged = pagedResponse(browserDetailResponse?.data || browserPage);
    if (paged && (!browserSelected || browserDetailResponse)) {
      renderWorkflowPagedResponse(paged, browserDetailResponse ? { onBack: () => { browserDetailResponse = null; browserSelected = null; renderBrowser(); summary.textContent = "Choose a workflow to review or prepare."; } } : {});
      return;
    }
    if (browserSelected) {
      const workflow = browserSelected.workflow;
      renderWorkflowDetail(browserSelected, {
        onBack: () => { browserSelected = null; renderBrowser(); summary.textContent = "Choose a workflow to review or prepare."; },
        onPrepare: () => requestWorkflowPreparation(workflow.id),
      });
      return;
    }
    const search = element("form", { className: "ui-stack", role: "search" });
    const label = element("label", { htmlFor: "workflow-search" }, "Search workflows");
    const input = element("input", { id: "workflow-search", type: "search", value: browserArgs.query || "", placeholder: "Search by name", disabled: browserBusy });
    const submit = element("button", { type: "submit", disabled: !connected || browserBusy }, "Search");
    const controls = element("div", { className: "workflow-search-actions" });
    controls.append(submit, browserButton("Clear search", () => { const args = { ...browserArgs }; delete args.query; delete args.cursor; loadBrowserPage(args, []); }, !browserArgs.query));
    search.append(label, input, controls);
    search.addEventListener("submit", (event) => {
      event.preventDefault(); const args = { ...browserArgs, query: input.value.trim() }; delete args.cursor; loadBrowserPage(args, []);
    });
    context.append(search);
    const workflows = Array.isArray(browserPage?.workflows) ? browserPage.workflows : [];
    context.append(element("p", { className: "ui-caption" }, `Page ${browserHistory.length + 1} · ${workflows.length} workflow${workflows.length === 1 ? "" : "s"}`));
    if (!workflows.length) context.append(element("p", { className: "ui-callout" }, browserArgs.query ? "No workflows match your search. Try a different name or clear the search." : "No workflows are available in the selected organization."));
    const rows = element("ul", { className: "workflow-rows", "aria-label": "Workflows" });
    for (const workflow of workflows) {
      const row = element("li", { className: "workflow-row" });
      const copy = element("div", { className: "workflow-row-copy" });
      copy.append(element("h3", { className: "ui-value" }, safeText(workflow.name) || "Untitled workflow"));
      const description = safeText(workflow.description);
      if (description) copy.append(element("p", { className: "ui-caption" }, description));
      const version = workflow.activeVersion || workflow.latestVersion;
      const meta = [formatStatus(workflow.definitionStatus), Number.isInteger(version) ? `Version ${version}` : "Version unavailable"];
      if (Number.isInteger(workflow.nodeCount) && workflow.nodeCount >= 0) meta.push(`${workflow.nodeCount} step${workflow.nodeCount === 1 ? "" : "s"}`);
      copy.append(element("p", { className: "ui-meta" }, meta.filter(Boolean).join(" · ")));
      const actions = element("div", { className: "workflow-row-actions" });
      const invalid = !workflowIdValid(workflow.id) || authoritativeStateStale;
      actions.append(browserButton("View", () => browserRead("loomex_workflow_get", { workflowId: workflow.id }, (data) => { browserSelected = data; }), invalid));
      actions.append(browserButton("Prepare run", () => requestWorkflowPreparation(workflow.id), invalid));
      Array.from(actions.children).forEach((button) => button.setAttribute("aria-label", `${button.textContent}: ${safeText(workflow.name) || "Untitled workflow"}`));
      row.append(copy, actions); rows.append(row);
    }
    context.append(rows);
    const nav = element("nav", { className: "actions", "aria-label": "Workflow pages" });
    nav.append(browserButton("Previous", () => loadBrowserPage(browserHistory.at(-1), browserHistory.slice(0, -1)), !browserHistory.length));
    nav.append(browserButton("Next", () => loadBrowserPage({ ...browserArgs, cursor: browserPage.nextCursor }, [...browserHistory, browserArgs]), !browserPage?.nextCursor || authoritativeStateStale));
    context.append(nav);
  }

  function render(result) {
    renderCount += 1;
    if (mode === "browser" && !runFlow) {
      browserEpoch += 1; browserBusy = false;
      const args = result?._meta?.["loomex/workflowListQuery"];
      if (args) { browserArgs = { ...args, limit: args.limit || 20 }; browserHistory = []; }
    }
    latestMethod = methodOf(result) || latestMethod;
    const failed = Boolean(result && (result.isError || result.structuredContent?.ok === false));
    const incoming = dataOf(result);
    if (!failed) {
      authoritativeStateStale = false;
      latest = incoming;
      const supplied = result && result._meta && result._meta["loomex/preparationReview"];
      if (supplied !== undefined) preparationPresentation = presentationMatches(supplied, incoming || {}) ? supplied : null;
      else if (!presentationMatches(preparationPresentation, incoming || {})) preparationPresentation = null;
    }
    const output = latest || {};
    summary.classList.toggle("error", failed);
    summary.setAttribute("role", failed ? "alert" : "status");
    errorDetails.replaceChildren();
    errorDetails.hidden = true;
    summary.textContent = failed
      ? "Loomex could not complete this action. Refresh to check its current status before trying again."
      : mode === "interaction"
        ? "Your response is needed to continue."
        : mode === "authoring"
          ? "Answer the questions to continue authoring."
          : "Current Loomex state loaded.";
    const envelope = result && result.structuredContent ? result.structuredContent : result;
    const reference = envelope && envelope.requestId;
    supportReference.hidden = !(failed && typeof reference === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(reference));
    supportReference.textContent = supportReference.hidden ? "" : `Support reference: ${reference}`;
    if (failed) renderFailure(result);
    refresh.disabled = !connected;
    if (failed && latest) {
      authoritativeStateStale = true;
      primary.disabled = true;
      secondary.disabled = true;
      if (mode === "browser") renderBrowser();
      return;
    }
    primary.hidden = true;
    primary.disabled = true;
    primary.className = "";
    secondary.hidden = true;
    secondary.disabled = true;
    form.hidden = true;
    form.replaceChildren();
    context.replaceChildren();
    context.hidden = true;

    if (mode === "browser") {
      if (!failed) { browserPage = output; browserSelected = null; browserDetailResponse = null; }
      summary.textContent = failed ? "Workflows could not be loaded. Try Refresh again." : "Choose a workflow to review or prepare.";
      renderBrowser();
    } else if (mode === "prepare") {
      if (!failed && selectedWorkflowVersion(output) && !output.preparationId) {
        initializeRunSetup(output, false);
        renderIntegratedRunFlow();
      } else if (!failed && output.execution && !output.preparationId) {
        runFlow = { stage: "monitor", result: output, operations: new Map(), busy: false, returnToBrowser: false };
        renderIntegratedRunFlow();
      } else {
        if (!failed) summary.textContent = "Review the details below before starting.";
        preparationView(output);
        if (!preparationReviewable(output)) summary.textContent = "The execution details could not be verified here. Continue in the conversation to review this preparation before starting.";
        primary.textContent = preparedCommitTool() === "loomex_run_commit" ? "Start run" : "Start authoring";
        refresh.hidden = false; refresh.textContent = "Check runner";
        primary.hidden = false;
        primary.disabled = !connected || !preparationReviewable(output) || !findId(output, "preparationId") || !findId(output, "bindingDigest") || !findId(output, "confirmationKey");
        if (!failed && preparedCommitTool() === "loomex_run_commit" && preparationReviewable(output)) {
          runFlow = { stage: "review", prepared: immutableCopy(output), operations: new Map(), busy: false, returnToBrowser: false };
        }
      }
    } else if (mode === "monitor") {
      const response = pagedResponse(output);
      if (response) {
        summary.textContent = "The complete result is available as an immutable paged response.";
        reviewFields([
          ["Result", "Ready to view in the conversation"],
          ["Size", formatBytes(response.sizeBytes)],
        ], "Full results available");
        primary.textContent = "View results";
        primary.hidden = false;
        primary.disabled = !connected;
        return;
      }
      const runId = executionId(output);
      const run = output.execution || {};
      renderRun(run);
      if (terminalRun(run)) {
        summary.textContent = `${formatStatus(run.status) || "Run"}. Review the result details below.`;
      } else {
        summary.textContent = safeText(run.requiredAction) || "This run is in progress.";
        secondary.textContent = "Wait for update";
        secondary.hidden = false;
        secondary.disabled = !connected || !runId;
        primary.textContent = "Cancel run";
        primary.className = "danger";
        primary.hidden = false;
        primary.disabled = !connected || !runId;
        typedForm({ properties: { reason: { type: "string" } } }, { reason: "Cancelled by user" });
      }
    } else if (mode === "interaction") {
      const request = humanRequest(output) || {};
      const requestId = interactionId(output);
      const requestType = request.type;
      const schema = request.responseSchema || request.outputSchema;
      renderHumanPresentation(request, request.inputSpec);
      if (humanRequestResolved(request)) {
        summary.textContent = "Response received. This request is complete.";
      } else if (requestType === "approval" || output.decisionRequired === true) {
        appendRequestCopy(request, request.inputSpec);
        form.hidden = false;
        secondary.textContent = "Reject";
        secondary.hidden = false;
        secondary.disabled = !connected || !requestId;
        primary.textContent = "Approve";
        primary.hidden = false;
        primary.disabled = !connected || !requestId;
      } else {
        const formReady = typedForm(schema, request.answer, request.inputSpec, request);
        primary.textContent = "Continue";
        primary.hidden = false;
        primary.disabled = !connected || !requestId || !formReady;
      }
    } else if (mode === "authoring") {
      const sessionId = builderSessionId(output);
      const request = humanRequest(output) || {};
      const schema = request.responseSchema || request.outputSchema;
      if (sessionId && (schema || request.inputSpec)) {
        renderHumanPresentation(request, request.inputSpec);
        const formReady = typedForm(schema, request.answer || {}, request.inputSpec, request);
        primary.textContent = "Continue";
        primary.hidden = false;
        primary.disabled = !connected || !formReady;
      } else if (!sessionId && (pagedResponse(output) || (output.workflow && typeof output.workflow === "object"))) {
        summary.textContent = pagedResponse(output)
          ? "The complete workflow response is available in the conversation."
          : "Review this workflow before preparing a run.";
        renderAuthoringWorkflow(output);
      }
    }
  }

  function immutableCopy(value) {
    const copy = structuredClone(value);
    const freeze = (item) => {
      if (!item || typeof item !== "object" || Object.isFrozen(item)) return item;
      for (const child of Object.values(item)) freeze(child);
      return Object.freeze(item);
    };
    return freeze(copy);
  }

  function exactJsonEqual(left, right) {
    if (Object.is(left, right)) return true;
    if (!left || !right || typeof left !== "object" || typeof right !== "object" || Array.isArray(left) !== Array.isArray(right)) return false;
    if (Array.isArray(left)) return left.length === right.length && left.every((item, index) => exactJsonEqual(item, right[index]));
    const leftKeys = Object.keys(left).sort();
    const rightKeys = Object.keys(right).sort();
    return leftKeys.length === rightKeys.length && leftKeys.every((key, index) => key === rightKeys[index] && exactJsonEqual(left[key], right[key]));
  }

  function currentMutationOperation() {
    return mutationOperations.values().next().value;
  }

  function clearMutationOperation(operation) {
    mutationOperations.delete(operation.slot);
    mutationKeys.delete(operation.slot);
  }

  function lockUncertainOperation(operation, reconciled = false) {
    for (const control of form.querySelectorAll("input, select, textarea")) control.disabled = true;
    form.dataset.uncertain = "true";
    summary.classList.add("error");
    summary.setAttribute("role", "alert");
    summary.textContent = reconciled
      ? "The server still reports this request as pending. Your original response remains locked; retry sends those exact answers and the same operation ID."
      : "The submission outcome is uncertain. Your original response is locked. Refresh to reconcile, or retry the exact same response and operation ID.";
    secondary.disabled = true;
    primary.textContent = "Retry exact response";
    primary.disabled = !connected;
    refresh.disabled = !connected;
    operation.uncertain = true;
    operation.reconciled = reconciled || operation.reconciled;
  }

  function unlockUncertainOperation(operation) {
    if (!operation.uncertain) return;
    for (const control of form.querySelectorAll("input, select, textarea")) control.disabled = false;
    delete form.dataset.uncertain;
    if (operation.name === "loomex_interaction_respond" || operation.name === "loomex_builder_respond") primary.textContent = "Continue";
    else if (operation.name === "loomex_run_cancel") primary.textContent = "Cancel run";
    else if (operation.name === "loomex_interaction_decide") {
      primary.textContent = "Approve";
      secondary.textContent = "Reject";
      secondary.disabled = !connected;
    }
  }

  function operationStillPending(operation, data) {
    if (operation.name === "loomex_interaction_respond" || operation.name === "loomex_interaction_decide") {
      const request = humanRequest(data);
      if (!request || request.id !== operation.arguments.requestId) return false;
      return !humanRequestResolved(request);
    }
    if (operation.name === "loomex_builder_respond") {
      return builderSessionId(data) === operation.arguments.sessionId && Boolean(humanRequest(data));
    }
    return true;
  }

  function reconcilePendingOperation(result, operation) {
    if (result && result.isError) {
      render(result);
      lockUncertainOperation(operation, true);
      return;
    }
    const incoming = dataOf(result) || {};
    if (!operationStillPending(operation, incoming)) {
      clearMutationOperation(operation);
      render(result);
      summary.textContent = mode === "interaction"
        ? "Response received. The uncertain submission was reconciled and no retry is needed."
        : "Server state reconciled. This request no longer needs the pending retry.";
      return;
    }
    latestMethod = methodOf(result) || latestMethod;
    latest = incoming;

    lockUncertainOperation(operation, true);
  }

  async function callTool(name, args, renderResult = true) {
    let result;
    try {
      result = await send("tools/call", { name, arguments: args });
    } catch (error) {
      authoritativeStateStale = true;
      primary.disabled = true;
      secondary.disabled = true;
      refresh.disabled = !connected;
      throw error;
    }
    if (renderResult) render(result);
    return result;
  }

  async function callMutation(name, slot, args) {
    let operation = mutationOperations.get(slot);
    if (!operation) {
      const idempotencyKey = uuid();
      mutationKeys.set(slot, idempotencyKey);
      operation = {
        name,
        slot,
        arguments: immutableCopy({ ...args, idempotencyKey }),
        uncertain: false,
        reconciled: false,
      };
      mutationOperations.set(slot, operation);
    } else if (operation.name !== name) {
      throw new Error("The retained operation does not match this action. Refresh before continuing.");
    }
    const result = await callTool(operation.name, immutableCopy(operation.arguments));
    const uncertain = ["NETWORK_AMBIGUOUS", "IDEMPOTENCY_REQUEST_IN_PROGRESS"].includes(errorCodeOf(result));
    if (uncertain) lockUncertainOperation(operation);
    else {
      unlockUncertainOperation(operation);
      clearMutationOperation(operation);
    }
    return result;
  }

  async function withPending(button, operation) {
    if (button.dataset.pending === "true") return;
    const actionButtons = [refresh, secondary, primary];
    const previousDisabled = actionButtons.map((candidate) => candidate.disabled);
    const previousRenderCount = renderCount;
    button.dataset.pending = "true";
    button.setAttribute("aria-busy", "true");
    for (const candidate of actionButtons) candidate.disabled = true;
    try {
      await operation();
    } finally {
      delete button.dataset.pending;
      button.removeAttribute("aria-busy");
      if (renderCount === previousRenderCount && !authoritativeStateStale) {
        actionButtons.forEach((candidate, index) => { candidate.disabled = previousDisabled[index]; });
      }
      const retainedOperation = currentMutationOperation();
      if (retainedOperation && retainedOperation.uncertain) {
        lockUncertainOperation(retainedOperation, retainedOperation.reconciled);
      }
    }
  }

  refresh.addEventListener("click", () => withPending(refresh, async () => {
    let authoringWorkflowRead = false;
    try {
      if (runFlow) {
        if (runFlow.stage === "review") {
          const readiness = await callTool("loomex_readiness", {}, false);
          if (readiness?.isError || readiness?.structuredContent?.ok === false) throw new Error("The runner could not be reached. The prepared run remains unchanged.");
          runFlow.errorMessage = "";
          summary.classList.remove("error"); summary.setAttribute("role", "status");
          summary.textContent = "Runner status checked. Your prepared operation is unchanged.";
        } else if (runFlow.stage === "monitor") {
          const runId = executionId(runFlow.result);
          const result = await callTool("loomex_run_get", { runId }, false);
          if (result?.isError || result?.structuredContent?.ok === false || executionId(dataOf(result)) !== runId) throw new Error("The current run status could not be verified.");
          runFlow.result = dataOf(result);
          runFlow.errorMessage = "";
          renderIntegratedRunFlow();
        }
        return;
      }
      const data = latest || {};
      if (mode === "browser") {
        if (browserDetailResponse) await browserRead("loomex_workflow_get", { workflowId: browserDetailResponse.workflowId }, (data) => { browserSelected = data; });
        else if (browserSelected) await browserRead("loomex_workflow_get", { workflowId: browserSelected.workflow.id }, (data) => { browserSelected = data; });
        else await loadBrowserPage(browserArgs, browserHistory);
        return;
      }
      if (mode === "prepare") {
        const readiness = await callTool("loomex_readiness", {}, false);
        if (readiness && readiness.isError) setError(new Error("The runner could not be reached. Check its status in the conversation."));
        else {
          summary.classList.remove("error");
          summary.setAttribute("role", "status");
          summary.textContent = "Runner status checked. Your prepared operation is unchanged.";
        }
        return;
      }
      authoringWorkflowRead = mode === "authoring" && !builderSessionId(data) && Boolean(data.workflow);
      if (authoringWorkflowRead) {
        browserBusy = true;
        renderAuthoringWorkflow(data);
      }
      let toolName;
      let args;
      if (mode === "monitor" && executionId(data)) {
        toolName = "loomex_run_get";
        args = { runId: executionId(data) };
      } else if (mode === "interaction" && interactionId(data)) {
        toolName = "loomex_interaction_get";
        args = { requestId: interactionId(data) };
      } else if (mode === "authoring" && builderSessionId(data)) {
        toolName = "loomex_builder_get";
        args = { sessionId: builderSessionId(data) };
      } else if (authoringWorkflowRead) {
        toolName = "loomex_workflow_get";
        args = workflowRefreshArgs(data);
      } else {
        toolName = "loomex_readiness";
        args = {};
      }
      const operation = currentMutationOperation();
      const result = await callTool(toolName, args, !operation);
      if (operation) reconcilePendingOperation(result, operation);
    } catch (error) {
      if (runFlow) { authoritativeStateStale = false; renderIntegratedRunFlow(); }
      setError(error);
    }
    finally {
      if (authoringWorkflowRead) {
        browserBusy = false;
        renderAuthoringWorkflow(latest || {});
      }
    }
  }));

  secondary.addEventListener("click", () => withPending(secondary, async () => {
    try {
      if (runFlow?.stage === "review" && runFlow.operations.size === 0) {
        runFlow.stage = "setup";
        runFlow.prepared = null;
        runFlow.errorMessage = "";
        preparationPresentation = null;
        renderIntegratedRunFlow();
        return;
      }
      if (runFlow?.returnToBrowser && runFlow.stage !== "monitor") {
        runFlow = null;
        browserSelected = null;
        browserDetailResponse = null;
        renderCount += 1;
        summary.classList.remove("error"); summary.setAttribute("role", "status");
        summary.textContent = "Choose a workflow to review or prepare.";
        refresh.hidden = false; refresh.textContent = "Refresh";
        renderBrowser();
        return;
      }
      if (runFlow?.stage === "monitor") {
        const runId = executionId(runFlow.result);
        if (!runId || terminalRun(runFlow.result.execution || {})) return;
        const result = await callTool("loomex_run_wait", { runId, timeoutSeconds: 30 }, false);
        if (result?.isError || result?.structuredContent?.ok === false || executionId(dataOf(result)) !== runId) throw new Error("The next run update could not be verified.");
        runFlow.result = dataOf(result);
        runFlow.errorMessage = "";
        renderIntegratedRunFlow();
        return;
      }
      const retainedOperation = currentMutationOperation();
      if (retainedOperation) {
        lockUncertainOperation(retainedOperation);
        return;
      }
      const data = latest || {};
      if (mode === "monitor") {
        if (terminalRun(data.execution || {})) return;
        await callTool("loomex_run_wait", { runId: executionId(data), timeoutSeconds: 30 });
      } else if (mode === "interaction") {
        const requestId = interactionId(data);
        await callMutation("loomex_interaction_decide", `interaction:reject:${requestId}`, {
          requestId, decision: "reject"
        });
      }
    } catch (error) { setError(error); }
  }));

  primary.addEventListener("click", () => withPending(primary, async () => {
    try {
      if (runFlow) { await handleRunFlowPrimary(); return; }
      const data = latest || {};
      const retainedOperation = currentMutationOperation();
      if (retainedOperation) {
        await callMutation(retainedOperation.name, retainedOperation.slot, {});
        return;
      }
      if (mode === "prepare") {
        if (!preparationReviewable(data)) throw new Error("Review the complete execution details in the conversation before starting.");
        const preparationId = findId(data, "preparationId");
        const commitTool = preparedCommitTool();
        await callMutation(commitTool, `${commitTool}:${preparationId}`, {
          preparationId,
          bindingDigest: findId(data, "bindingDigest"),
          confirmationKey: findId(data, "confirmationKey")
        });
      } else if (mode === "monitor" && pagedResponse(data)) {
        const response = pagedResponse(data);
        const messageResult = await send("ui/message", {
          role: "user",
          content: [{
            type: "text",
            text: `Read and present the complete Loomex result using loomex_response_read with responseRef ${response.responseRef}. Begin at offset 0, continue through every nextOffset, and verify checksumSha256 before presenting it.`,
          }],
        });
        if (messageResult && messageResult.isError === true) {
          throw new Error("The host could not send this result request. Continue in the conversation to retrieve it.");
        }
        summary.textContent = "The conversation has been asked to retrieve and present the complete result.";
      } else if (mode === "monitor") {
        if (terminalRun(data.execution || {})) throw new Error("This run is already complete.");
        const answer = collectAnswer();
        if (!answer.reason) throw new Error("Enter a cancellation reason.");
        const runId = executionId(data);
        await callMutation("loomex_run_cancel", `run:cancel:${runId}`, {
          runId, reason: answer.reason
        });
      } else if (mode === "interaction") {
        const approval = primary.textContent === "Approve";
        if (approval) {
          const requestId = interactionId(data);
          await callMutation("loomex_interaction_decide", `interaction:approve:${requestId}`, {
            requestId, decision: "approve"
          });
        } else {
          const requestId = interactionId(data);
          await callMutation("loomex_interaction_respond", `interaction:respond:${requestId}`, {
            requestId, answer: collectAnswer()
          });
        }
      } else if (mode === "authoring") {
        const sessionId = builderSessionId(data);
        await callMutation("loomex_builder_respond", `builder:respond:${sessionId}`, {
          sessionId, response: collectAnswer()
        });
      }
    } catch (error) { setError(error); }
  }));

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const waiter = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) waiter.reject(new Error("The host could not complete this action. Continue in the conversation for help."));
      else waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-input") {
      const toolName = message.params && (message.params.name || message.params.toolName);
      if (typeof toolName === "string") latestToolName = toolName;
      if (mode === "browser" && message.params?.arguments) {
        const args = message.params.arguments;
        browserArgs = { limit: Number.isInteger(args.limit) ? args.limit : 20, ...(typeof args.query === "string" ? { query: args.query } : {}), ...(typeof args.cursor === "string" ? { cursor: args.cursor } : {}), ...(typeof args.systemKey === "string" ? { systemKey: args.systemKey } : {}) };
        browserHistory = [];
      }
    }
    if (message.method === "ui/notifications/tool-result") render(message.params);
  }, { passive: true });

  const handshake = send("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "loomex", version: "0.2.9" },
    appCapabilities: { availableDisplayModes: ["inline"] }
  });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Portable MCP Apps bridge unavailable.")), 3000));
  Promise.race([handshake, timeout]).then(() => {
    connected = true;
    connection.textContent = "Connected";
    refresh.disabled = false;
    send("ui/notifications/initialized", {}, false);
    if (latest) render(latest);
    if (typeof ResizeObserver === "function") {
      let lastSize = "";
      const reportSize = () => {
        const box = document.querySelector("main").getBoundingClientRect();
        const size = { width: Math.ceil(document.documentElement.clientWidth), height: Math.ceil(box.height) };
        const key = `${size.width}:${size.height}`;
        if (key !== lastSize) {
          lastSize = key;
          send("ui/notifications/size-changed", size, false);
        }
      };
      new ResizeObserver(reportSize).observe(document.querySelector("main"));
      reportSize();
    }
  }).catch((error) => {
    connected = false;
    connection.textContent = "Headless tools remain available";
    setError(error);
  });
})();
</script>
</body>
</html>
