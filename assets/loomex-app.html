  }

  function element(tag, attributes = {}, text = "") {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (name === "className") node.className = value;
      else if (name === "dataset") Object.assign(node.dataset, value);
      else if (name in node && name !== "list") node[name] = value;
      else node.setAttribute(name, String(value));
    }
    if (text) node.textContent = text;
    if (tag === "button") {
      applyButtonStyle(node);
      if (text) setAction(node, text);
      else node.classList.add("ui-button-md");
    } else if (["input", "select", "textarea"].includes(tag) && !["checkbox", "radio"].includes(String(attributes.type || ""))) {
      node.classList.add("input-field");
    }
    if (tag === "fieldset" || ["ui-card", "workflow-row", "answer-review-item", "ui-callout", "notice"].some((name) => node.classList.contains(name))) {
      node.classList.add("glass-panel");
    }
    if (node.classList.contains("ui-badge")) applyBadgeStyle(node);
    return node;
  }

  function normalizeInputType(value) {
    const normalized = String(value || "text").trim().toLowerCase().replaceAll("-", "_");
    if (["long_answer", "textarea"].includes(normalized)) return "long_text";
    return normalized;
  }

  function inputSpecSupported(spec) {
    if (!spec || typeof spec !== "object") return false;
    const supportedTypes = new Set(["text", "date", "rating", "boolean", "radio", "checkbox"]);
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch
      ? spec.questions
      : [spec];
    if (!Array.isArray(questions) || !questions.length) return false;
    const ids = new Set();
    return questions.every((question) => {
      if (!question || typeof question !== "object" || typeof question.question !== "string" || !question.question.trim()) return false;
      const inputType = normalizeInputType(question.inputType || spec.inputType);
      if (!supportedTypes.has(inputType)) return false;
      if (batch) {
        if (typeof question.id !== "string" || !question.id.trim() || ids.has(question.id)) return false;
        ids.add(question.id);
      }
      if (inputType === "rating") {
        const minimumValid = question.minimum === undefined || Number.isSafeInteger(question.minimum);
        const maximumValid = question.maximum === undefined || Number.isSafeInteger(question.maximum);
        const minimum = question.minimum === undefined ? 1 : question.minimum;
        const maximum = question.maximum === undefined ? 5 : question.maximum;
        if (!minimumValid || !maximumValid || minimum > maximum) return false;
      }
      if (inputType === "radio" || inputType === "checkbox") {
        if (!Array.isArray(question.options) || typeof question.allowOther !== "boolean") return false;
        const optionIds = new Set();
        for (const option of question.options) {
          if (!option || typeof option !== "object" || typeof option.id !== "string" || !option.id || option.id === "other" || optionIds.has(option.id)) return false;
          if (typeof (option.label || option.text) !== "string" || !(option.label || option.text).trim()) return false;
          optionIds.add(option.id);
        }
        if (!optionIds.size && !question.allowOther) return false;
      }
      return true;
    });
  }

  function longTextQuestionContract(spec, request = {}) {
    if (!spec || typeof spec !== "object") return null;
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch ? spec.questions : [spec];
    if (!Array.isArray(questions)) return null;
    const longQuestions = questions.filter((question) => normalizeInputType(question?.inputType || spec.inputType) === "long_text");
    if (!longQuestions.length) return null;
    return {
      valid: !batch && questions.length === 1 && longQuestions.length === 1,
      question: longQuestions[0],
      answerChannel: safeText(spec.answerChannel || request.answerChannel, 40) || latestAnswerChannel,
    };
  }

  function renderLongTextHandoff(request, contract) {
    form.replaceChildren();
    appendRequestCopy(request, request?.inputSpec);
    const callout = element("section", { className: "ui-callout", role: "status" });
    callout.append(element("h2", {}, safeText(contract.question?.question) || "Continue in chat"));
    callout.append(element("p", {}, "Answer this long-form question in the conversation. Your response will stay in chat until you choose to send it."));
    form.append(callout);
    form.dataset.formKind = "chat-answer";
    form.dataset.answerPhase = "answer";
    form.hidden = false;
  }

  function normalizedCopy(value) {
    return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
  }

  function questionCopyValues(spec) {
    if (!spec || typeof spec !== "object") return [];
    const questions = Array.isArray(spec.questions) ? spec.questions : [spec];
    return questions.map((question) => safeText(question && question.question)).filter(Boolean);
  }

  function appendRequestCopy(request, spec) {
    const presentation = humanPresentation(request);
    const questionCopies = new Set(questionCopyValues(spec).map(normalizedCopy));
    const candidateHeading = typeof request.title === "string" ? request.title.trim() : "";
    const askingQuestion = inputSpecSupported(spec);
    const heading = presentation || (askingQuestion && presentation?.kind !== "review") || questionCopies.has(normalizedCopy(candidateHeading))
      ? ""
      : candidateHeading;
    const descriptions = [];
    const seen = new Set([normalizedCopy(heading), ...questionCopies]);
    if (presentation) {
      seen.add(normalizedCopy(safeText(request.title)));
      seen.add(normalizedCopy(presentation.question));
      seen.add(normalizedCopy(presentation.summary));
    }
    for (const value of [request.description, request.prompt]) {
      if (typeof value !== "string" || !value.trim()) continue;
      const copy = value.trim();
      const normalized = normalizedCopy(copy);
      if (seen.has(normalized)) continue;
      seen.add(normalized);
      descriptions.push(copy);
    }
    if (!heading && !descriptions.length) return;
    const copy = element("div", { className: "request-copy" });
    if (heading) copy.append(element("h2", {}, heading));
    for (const description of descriptions) copy.append(element("p", {}, description));
    form.append(copy);
  }

  function initialQuestionAnswer(initial, questionId, batch) {
    if (!initial || typeof initial !== "object") return {};
    if (!batch) return initial;
    const answers = Array.isArray(initial.answers) ? initial.answers : [];
    return answers.find((answer) => answer && String(answer.questionId) === questionId) || {};
  }

  function requiredAnswer(schema, inputType, batch) {
    if (batch) return true;
    if (!schema || typeof schema !== "object") return true;
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    return required.has(inputType === "checkbox" ? "values" : "value");
  }

  function setChoiceName(control, questionIndex) {
    control.name = `question-${questionIndex}`;
    return control;
  }

  function appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer) {
    if (spec.allowOther === false) return;
    const choiceId = `question-${questionIndex}-other-choice`;
    const entryId = `question-${questionIndex}-other-entry`;
    const selected = inputType === "checkbox"
      ? Array.isArray(answer.values) && answer.values.includes("other")
      : answer.value === "other";
    const label = element("label", { className: "choice", htmlFor: choiceId });
    const choice = setChoiceName(element("input", {
      id: choiceId,
      type: inputType,
      value: "other",
      checked: selected,
      dataset: { option: "other" },
    }), questionIndex);
    label.append(choice, element("span", {}, spec.otherLabel || "Other"));
    const entry = element("div", { className: "other-entry", id: entryId, hidden: !selected });
    const otherLabel = element("label", { htmlFor: `question-${questionIndex}-other-text` }, "Describe your answer");
    const otherInput = element("input", {
      id: `question-${questionIndex}-other-text`,
      type: "text",
      value: typeof answer.otherText === "string" ? answer.otherText : "",
      autocomplete: "off",
      dataset: { otherText: "true" },
    });
    entry.append(otherLabel, otherInput);
    choice.addEventListener("change", () => {
      const active = inputType === "checkbox" ? choice.checked : true;
      entry.hidden = !active;
      if (active) otherInput.focus();
    });
    fieldset.addEventListener("change", () => {
      const otherSelected = Boolean(fieldset.querySelector('[data-option="other"]:checked'));
      entry.hidden = !otherSelected;
      if (!otherSelected) otherInput.removeAttribute("aria-invalid");
    });
    stack.append(label, entry);
  }

  function renderQuestion(spec, schema, initial, questionIndex, batch, helperText) {
    const questionId = String(spec.id || `question_${questionIndex + 1}`);
    const inputType = normalizeInputType(spec.inputType);
    const answer = initialQuestionAnswer(initial, questionId, batch);
    const required = requiredAnswer(schema, inputType, batch);
    const errorId = `question-${questionIndex}-error`;
    const legendId = `question-${questionIndex}-legend`;
    const fieldset = element("fieldset", {
      className: batch ? "" : "single-question",
      dataset: { questionId, inputType, required: String(required), errorId },
      "aria-describedby": errorId,
    });
    // Browser fieldset legends have inconsistent width and wrapping behaviour.
    // Keep the accessible group name in a legend, and render the visible heading
    // as a normal block so long questions wrap predictably in every host.
    const legend = element("legend", { id: legendId, className: "sr-only" }, spec.question);
    const heading = element("div", {
      className: "question-heading",
      role: "heading", "aria-level": "2",
    }, spec.question);
    if (required) heading.append(" ", element("span", { className: "required-mark", "aria-hidden": "true" }, "*"));
    fieldset.append(legend, heading);
    const stack = element("div", { className: "control-stack" });

    if (inputType === "text" || inputType === "long_text" || inputType === "date") {
      const labelId = `question-${questionIndex}-control-label`;
      const hintId = inputType === "date" ? `question-${questionIndex}-hint` : undefined;
      const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` });
      label.append(element("span", { className: "sr-only" }, inputType === "date" ? "Date" : "Your answer"));
      const control = element(inputType === "long_text" ? "textarea" : "input", {
        id: `question-${questionIndex}-value`,
        "aria-labelledby": `${legendId} ${labelId}`,
        "aria-describedby": [hintId, errorId].filter(Boolean).join(" "),
        type: inputType === "long_text" ? undefined : inputType === "date" ? "date" : "text",
        value: typeof answer.value === "string" ? answer.value : "",
        placeholder: inputType === "date" ? "YYYY-MM-DD" : "",
        inputMode: inputType === "date" ? "numeric" : undefined,
        pattern: inputType === "date" ? "[0-9]{4}-[0-9]{2}-[0-9]{2}" : undefined,
        autocomplete: "off",
        dataset: { value: "true" },
      });
      label.append(control);
      stack.append(label);
      if (inputType === "date") stack.append(element("p", { id: hintId, className: "hint" }, "Choose a calendar date."));
    } else if (inputType === "boolean") {
      const booleanLabels = spec.acceptanceLabels === true
        ? [{ value: "true", label: "Accept" }, { value: "false", label: "Request changes" }]
        : [{ value: "true", label: "Yes" }, { value: "false", label: "No" }];
      for (const option of booleanLabels) {
        const id = `question-${questionIndex}-${option.value}`;
        const label = element("label", { className: "choice", htmlFor: id });
        const selected = typeof answer.value === "boolean" && String(answer.value) === option.value;
        label.append(setChoiceName(element("input", { id, type: "radio", value: option.value, checked: selected }), questionIndex), element("span", {}, option.label));
        stack.append(label);
      }
    } else if (inputType === "rating") {
      const minimum = Number.isSafeInteger(spec.minimum) ? spec.minimum : 1;
      const maximum = Number.isSafeInteger(spec.maximum) && spec.maximum >= minimum ? spec.maximum : 5;
      fieldset.dataset.minimum = String(minimum);
      fieldset.dataset.maximum = String(maximum);
      const span = maximum - minimum + 1;
      if (span <= 20) {
        const choices = element("div", { className: "rating-options", role: "radiogroup", "aria-labelledby": legendId, "aria-describedby": errorId });
        for (let value = minimum; value <= maximum; value += 1) {
          const id = `question-${questionIndex}-rating-${value}`;
          const label = element("label", { className: "rating-choice", htmlFor: id });
          label.append(setChoiceName(element("input", {
            id, type: "radio", value: String(value), checked: answer.value === value,
          }), questionIndex), element("span", {}, String(value)));
          choices.append(label);
        }
        stack.append(choices);
      } else {
        const labelId = `question-${questionIndex}-control-label`;
        const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` }, `Rating (${minimum} to ${maximum})`);
        label.append(element("input", {
          id: `question-${questionIndex}-value`, type: "number", min: String(minimum), max: String(maximum), step: "1",
          value: Number.isSafeInteger(answer.value) ? String(answer.value) : "", dataset: { value: "true" },
          "aria-labelledby": `${legendId} ${labelId}`, "aria-describedby": errorId,
        }));
        stack.append(label);
      }
    } else {
      for (const [optionIndex, option] of (Array.isArray(spec.options) ? spec.options : []).entries()) {
        const optionId = String(option && option.id !== undefined ? option.id : `option_${optionIndex + 1}`);
        const optionLabel = String(option && (option.label || option.text) || optionId);
        const id = `question-${questionIndex}-option-${optionIndex}`;
        const selected = inputType === "checkbox"
          ? Array.isArray(answer.values) && answer.values.includes(optionId)
          : answer.value === optionId;
        const label = element("label", { className: "choice", htmlFor: id });
        label.append(setChoiceName(element("input", {
          id, type: inputType, value: optionId, checked: selected, dataset: { option: optionId },
        }), questionIndex), element("span", {}, optionLabel));
        stack.append(label);
      }
      appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer);
    }
    const helper = safeText(helperText)
      ? element("p", { id: `question-${questionIndex}-helper`, className: "hint" }, safeText(helperText))
      : null;
    if (helper) {
      for (const control of stack.querySelectorAll("input, textarea, select")) {
        const descriptions = new Set(String(control.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
        descriptions.add(helper.id);
        control.setAttribute("aria-describedby", [...descriptions].join(" "));
      }
    }
    const error = element("p", { id: errorId, className: "field-error", role: "alert", hidden: true, dataset: { fieldError: "true" } });
    fieldset.append(stack, ...(helper ? [helper] : []), error);
    form.append(fieldset);
  }

  function questionForm(spec, schema, initial, request) {
    form.replaceChildren();
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch ? spec.questions : [spec];
    appendRequestCopy(request || {}, spec);
    const acceptance = humanPresentation(request || {})?.kind === "review" && questions.length === 1 &&
      normalizeInputType(questions[0].inputType || spec.inputType) === "boolean";
    const clarificationHelper = questions.length === 1 && humanPresentation(request || {})?.kind === "clarification"
      ? safeText(humanPresentation(request || {})?.summary)
      : undefined;
    const normalizedQuestions = questions.map((question) => ({
      ...question,
      // Single-question draft identity is defined by the backend node contract.
      id: batch ? question.id : (safeText(request?.node?.id, 128) || "answer"),
      inputType: question.inputType || spec.inputType,
      acceptanceLabels: acceptance,
    }));
    normalizedQuestions.forEach((question, index) => renderQuestion(question, schema, initial || {}, index, batch, clarificationHelper));
    if (questions.length > 1) {
      const stepper = element("nav", { className: "question-stepper", "aria-label": "Question navigation" });
      const previous = element("button", { type: "button", className: "secondary" }, "Previous question");
      const position = element("output", { "aria-live": "polite" });
      const next = element("button", { type: "button", className: "secondary" }, "Next question");
      previous.addEventListener("click", async () => {
        showQuestionStep(Number(form.dataset.questionIndex || 0) - 1, true);
        saveReviewNavigation();
      });
      next.addEventListener("click", async () => {
        const index = Number(form.dataset.questionIndex || 0);
        if (next.dataset.answerIntent === "review") {
          try {
            if (!await openAnswerReview()) return;
          } catch (error) { setError(error); }
          return;
        }
        const fieldset = form.querySelectorAll("fieldset[data-question-id]")[index];
        try {
          clearQuestionErrors(fieldset);
          collectQuestion(fieldset);
          summary.classList.remove("error");
          summary.setAttribute("role", "status");
          summary.textContent = "";
          showQuestionStep(index + 1, true);
          saveReviewNavigation();
        } catch (error) { setError(error); }
      });
      stepper.append(previous, position, next);
      form.append(stepper);
    }
    form.questionMeta = { questions: normalizedQuestions, batch };
    form.dataset.formKind = "questions";
    form.dataset.collectionMode = batch ? "batch" : "single";
    form.dataset.answerPhase = "answer";
    form.hidden = false;
    showQuestionStep(0, false);
  }

  function typedForm(schema, initial, spec, request = {}) {
    form.replaceChildren();
    if (!schema || typeof schema !== "object" || Array.isArray(schema)) {
      form.append(element("p", { className: "notice error", role: "alert" }, "This form is missing its response schema. Continue in the conversation to provide your answer."));
      form.dataset.formKind = "unsupported";
      form.hidden = false;
      setError(new Error("This form is missing its response schema. Continue in the conversation to provide your answer."));
      return false;
    }
    const longText = longTextQuestionContract(spec, request);
    if (longText) {
      if (longText.valid && longText.answerChannel === "chat") {
        renderLongTextHandoff(request, longText);
        return false;
      }
      form.replaceChildren();
      appendRequestCopy(request, spec);
      const message = longText.valid
        ? "This long-form answer must be collected in the conversation. Continue in chat to answer it."
        : "Long-form questions cannot be mixed into an inline batch. Continue in the conversation to answer this request.";
      form.append(element("p", { className: "notice error", role: "alert" }, message));
      form.dataset.formKind = "invalid-questions";
      form.hidden = false;
      setError(new Error(message));
      return false;
    }
    if (inputSpecSupported(spec)) {
      questionForm(spec, schema, initial, request);
      return true;
    }
    if (spec && typeof spec === "object" && Object.keys(spec).length) {
      form.replaceChildren();
      appendRequestCopy(request, spec);
      form.append(element("p", { className: "notice error", role: "alert" }, "This question cannot be displayed here. Continue in the conversation for help with this request."));
      form.dataset.formKind = "invalid-questions";
      form.hidden = false;
      setError(new Error("This question cannot be displayed here. Continue in the conversation for help with this request."));
      return false;
    }
    form.replaceChildren();
    appendRequestCopy(request, spec);
    const properties = schema && schema.properties && typeof schema.properties === "object" ? schema.properties : null;
    const supported = properties && Object.values(properties).every((field) =>
      field && typeof field === "object" &&
      (Array.isArray(field.enum) || ["string", "boolean", "integer", "number"].includes(field.type))
    );
    if (!properties || !supported) {
      form.append(element("p", { className: "notice", role: "status" }, "This form cannot be displayed here. Continue in the conversation to provide your answer."));
      form.dataset.formKind = "unsupported";
      form.hidden = false;
      return false;
    }
    form.dataset.formKind = "generic";
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    for (const [name, field] of Object.entries(properties)) {
      const label = document.createElement("label");
      label.className = "field-label";
      label.htmlFor = `schema-${name}`;
      label.textContent = mode === "monitor" && name === "reason"
        ? "Cancellation reason"
        : name.replaceAll("_", " ");
      let control;
      if (Array.isArray(field.enum)) {
        control = document.createElement("select");
        const empty = element("option", { value: "", disabled: true }, "Choose an option");
        control.append(empty);
        for (const optionValue of field.enum) {
          const option = document.createElement("option");
          option.value = String(optionValue);
          option.textContent = String(optionValue);
          control.append(option);
        }
      } else if (field.type === "boolean") {
        control = document.createElement("select");
        control.append(element("option", { value: "", disabled: true }, "Choose yes or no"));
        for (const [value, bool] of [["true", "Yes"], ["false", "No"]]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = bool;
          control.append(option);
        }
      } else {
        control = document.createElement("input");
        control.type = field.type === "integer" || field.type === "number" ? "number" : "text";
      }
      control.id = `schema-${name}`;
      control.classList.add("input-field");
      control.dataset.field = name;
      control.dataset.type = field.type || "string";
      control.dataset.required = required.has(name) ? "true" : "false";
      if (initial && initial[name] !== undefined) control.value = String(initial[name]);
      label.append(control);
      form.append(label);
    }
    form.dataset.formKind = "schema";
    form.dataset.answerPhase = "answer";
    form.hidden = false;
    return true;
  }

  function clearQuestionErrors(target) {
    for (const fieldset of target ? [target] : form.querySelectorAll("fieldset[data-question-id]")) {
      for (const control of fieldset.querySelectorAll("input, textarea, select")) control.removeAttribute("aria-invalid");
      const error = fieldset.querySelector("[data-field-error]");
      if (error) { error.hidden = true; error.textContent = ""; }
    }
  }

  function showQuestionStep(index, focus) {
    const fields = [...form.querySelectorAll("fieldset[data-question-id]")];
    if (!fields.length) return;
    const current = Math.max(0, Math.min(index, fields.length - 1));
    form.dataset.questionIndex = String(current);
    fields.forEach((fieldset, fieldIndex) => { fieldset.hidden = fieldIndex !== current; });
    const stepper = form.querySelector(".question-stepper");
    if (stepper) {
      stepper.hidden = false;
      const [previous, position, next] = stepper.children;
      previous.disabled = current === 0;
      const reviewing = current === fields.length - 1;
      setAnswerAction(next, reviewing ? "review" : "next", reviewing ? answerActionLabel("Review") : "Next question");
      next.disabled = reviewing && (!connected || authoritativeStateStale);
      position.textContent = `Question ${current + 1} of ${fields.length}`;
      primary.hidden = true;
      primary.disabled = true;
    }
    if (focus) fields[current].querySelector("input, textarea, select")?.focus();
  }

  async function autoAdvanceChoice(control) {
    if (form.dataset.formKind !== "questions" || form.dataset.collectionMode !== "batch" || form.dataset.answerPhase !== "answer") return;
    const fieldset = control.closest("fieldset[data-question-id]");
    if (!fieldset || control.type !== "radio" || control.dataset.option === "other") return;
    const inputType = fieldset.dataset.inputType;
    if (!["boolean", "radio", "rating"].includes(inputType)) return;
    if (form.dataset.autoAdvancing === "true") return;
    form.dataset.autoAdvancing = "true";
    try {
      const fields = [...form.querySelectorAll("fieldset[data-question-id]")];
      const index = fields.indexOf(fieldset);
      if (index < 0) return;
      if (index === fields.length - 1) {
        if (!await openAnswerReview()) return;
      } else {
        showQuestionStep(index + 1, true);
        saveReviewNavigation();
      }
    } catch (error) { setError(error); }
    finally { delete form.dataset.autoAdvancing; }
  }

  function answerActionLabel(action) {
    const count = form.querySelectorAll("fieldset[data-question-id]").length || form.querySelectorAll("[data-field]").length;
    return `${action} ${count === 1 ? "answer" : "answers"}`;
  }

  function hidePersistentBatchReview() {
    if (form.dataset.formKind !== "questions" || form.dataset.collectionMode !== "batch" || form.dataset.answerPhase === "review") return;
    primary.hidden = true;
    primary.disabled = true;
  }

  function answerText(question, answer) {
    const inputType = normalizeInputType(question?.inputType);
    if (inputType === "boolean" && typeof answer.value === "boolean") {
      if (question.acceptanceLabels) return answer.value ? "Accept" : "Request changes";
      return answer.value ? "Yes" : "No";
    }
    if (inputType === "radio") {
      if (answer.value === "other") return answer.otherText ? `${question.otherLabel || "Other"}: ${answer.otherText}` : question.otherLabel || "Other";
      const option = question.options?.find((candidate) => candidate?.id === answer.value);
      return safeText(option?.label || option?.text) || safeText(answer.value) || "No answer";
    }
    if (inputType === "checkbox") {
      const labels = (answer.values || []).map((value) => {
        if (value === "other") return answer.otherText ? `${question.otherLabel || "Other"}: ${answer.otherText}` : question.otherLabel || "Other";
        const option = question.options?.find((candidate) => candidate?.id === value);
        return safeText(option?.label || option?.text) || safeText(value);
      }).filter(Boolean);
      return labels.length ? labels.join(", ") : "No answer";
    }
    return answer.value === undefined || answer.value === "" ? "No answer" : String(answer.value);
  }

  function submittedAnswerReview(request, answer = request?.answer) {
    const spec = request?.inputSpec && typeof request.inputSpec === "object" ? request.inputSpec : {};
    const questions = Array.isArray(spec.questions) ? spec.questions : [spec];
    const acceptanceReview = humanPresentation(request)?.kind === "review" && questions.length === 1 &&
      normalizeInputType(questions[0]?.inputType || spec.inputType) === "boolean";
    const answers = Array.isArray(answer?.answers) ? answer.answers : null;
    const review = element("section", { className: "answer-review accepted-answer-review", "aria-label": "Submitted answers" });
    const heading = element("div", { className: "answer-review-heading" });
    heading.append(element("h2", {}, "Submitted answers"));
    const submittedAt = formatDateTime(request?.answeredAt);
    if (submittedAt) heading.append(element("p", { className: "ui-caption" }, `Submitted ${submittedAt}`));
    review.append(heading);
    const list = element("dl", { className: "review-list" });
    for (const [index, question] of questions.entries()) {
      if (!question || typeof question !== "object") continue;
      const questionId = String(question.id || `question_${index + 1}`);
      const value = answers ? answers.find((item) => item && String(item.questionId) === questionId) : answer;
      const displayQuestion = acceptanceReview ? { ...question, acceptanceLabels: true } : question;
      const item = element("div", { className: "answer-review-item glass-panel" });
      const copy = element("div", { className: "answer-review-copy" });
      copy.append(element("dt", {}, safeText(displayQuestion.question) || "Answer"));
      copy.append(element("dd", {}, answerText(displayQuestion, value || {})));
      item.append(copy);
      list.append(item);
    }
    if (!list.childElementCount && answer !== undefined) {
      const item = element("div", { className: "answer-review-item glass-panel" });
      const copy = element("div", { className: "answer-review-copy" });
      copy.append(element("dt", {}, "Response"), element("dd", {}, reviewValue(answer)));
      item.append(copy); list.append(item);
    }
    review.append(list);
    return review;
  }

  function resolvedInteractionOutput(authoritativeData, operation, receipt) {
    // This is a display-only projection that must be amended with the receipt;
    // do not use immutableCopy here because it recursively freezes its result.
    const output = structuredClone(dataOf(authoritativeData) || {});
    const source = humanRequest(output);
    if (!source) return output;
    const status = safeText(dataOf(receipt)?.requestStatus, 32).toLowerCase() || "resolved";
    const answer = operation.arguments.answer !== undefined
      ? immutableCopy(operation.arguments.answer)
      : source.answer;
    output.humanRequest = { ...source, status, ...(answer !== undefined ? { answer } : {}) };
    return output;
  }

  function exitAnswerReview(index = Number(form.dataset.questionIndex || 0)) {
    renderCount += 1;
    form.querySelector(".answer-review")?.remove();
    form.dataset.answerPhase = "answer";
    if (form.dataset.formKind === "questions") showQuestionStep(index, true);
    else for (const control of form.querySelectorAll("[data-field]")) control.closest("label")?.removeAttribute("hidden");
    secondary.hidden = true;
    secondary.disabled = true;
    if (form.dataset.formKind === "questions" && form.dataset.collectionMode === "batch") {
      primary.hidden = true;
      primary.disabled = true;
    } else {
      setAnswerAction(primary, "review", answerActionLabel("Review"));
      primary.hidden = false;
      primary.disabled = !connected || authoritativeStateStale;
    }
    summary.classList.remove("error");
    summary.setAttribute("role", "status");
    summary.textContent = "";
  }

  function beginAnswerReview() {
    if (!["questions", "schema"].includes(form.dataset.formKind) || form.dataset.answerPhase === "review") return false;
    const answer = collectAnswer();
    renderCount += 1;
    const review = element("section", { className: "answer-review", "aria-label": "Answer preview" });
    const heading = element("div", { className: "answer-review-heading" });
    const previewHeading = element("h2", { tabIndex: -1 }, "Answer preview");
    heading.append(previewHeading, element("p", { className: "ui-caption" }, "Check each answer before sending it."));
    const list = element("dl", { className: "answer-review-list" });
    if (form.dataset.formKind === "questions") {
      const fields = [...form.querySelectorAll("fieldset[data-question-id]")];
      const questions = form.questionMeta?.questions || [];
      const answers = form.dataset.collectionMode === "batch" ? answer.answers : [answer];
      fields.forEach((fieldset) => { fieldset.hidden = true; });
      form.querySelector(".question-stepper")?.setAttribute("hidden", "");
      questions.forEach((question, index) => {
        const item = element("div", { className: "answer-review-item", dataset: { questionId: fieldsetQuestionId(fields[index]) } });
        const copy = element("div", { className: "answer-review-copy" });
        copy.append(element("dt", {}, question.question), element("dd", {}, answerText(question, answers[index] || {})));
        const edit = element("button", { type: "button", className: "secondary" }, `Edit answer ${index + 1}`);
        edit.addEventListener("click", () => exitAnswerReview(index));
        item.append(copy, edit); list.append(item);
      });
    } else {
      const controls = [...form.querySelectorAll("[data-field]")];
      controls.forEach((control) => control.closest("label")?.setAttribute("hidden", ""));
      for (const control of controls) {
        const field = control.dataset.field;
        const item = element("div", { className: "answer-review-item" });
        const copy = element("div", { className: "answer-review-copy" });
        copy.append(element("dt", {}, field.replaceAll("_", " ")), element("dd", {}, answer[field] === undefined ? "No answer" : String(answer[field])));
        item.append(copy); list.append(item);
      }
    }
    review.append(heading, list);
    form.append(review);
    form.dataset.answerPhase = "review";
    setAnswerAction(secondary, "back", "Back to answers");
    secondary.hidden = false;
    secondary.disabled = false;
    setAnswerAction(primary, "submit", answerActionLabel("Submit"), true);
    primary.hidden = false;
    primary.disabled = !connected || authoritativeStateStale;
    summary.classList.remove("error");
    summary.setAttribute("role", "status");
    summary.textContent = "";
    previewHeading.focus({ preventScroll: true });
    return true;
  }

  function fieldsetQuestionId(fieldset) {
    return fieldset?.dataset.questionId || "";
  }

  function questionError(fieldset, message, target) {
    const error = fieldset.querySelector("[data-field-error]");
    if (error) { error.textContent = message; error.hidden = false; }
    const focusTarget = target || fieldset.querySelector("input, textarea, select");
    if (focusTarget) {
      focusTarget.setAttribute("aria-invalid", "true");
      focusTarget.focus();
    }
    throw new Error(message);
  }

  function validDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return false;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    if (year < 1 || month < 1 || month > 12 || day < 1) return false;
    const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
    const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return day <= days[month - 1];
  }

  function collectQuestion(fieldset) {
    const type = fieldset.dataset.inputType;
    const required = fieldset.dataset.required === "true";
    if (["text", "long_text", "date"].includes(type)) {
      const control = fieldset.querySelector("[data-value]");
      const value = control ? control.value : "";
      if (required && !value.trim()) questionError(fieldset, "Answer this question.", control);
      if (type === "date" && value && !validDate(value)) questionError(fieldset, "Enter a real date in YYYY-MM-DD format.", control);
      return value === "" && !required ? {} : { value };
    }
    if (type === "boolean") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose Yes or No.");
      return selected ? { value: selected.value === "true" } : {};
    }
    if (type === "rating") {
      const control = fieldset.querySelector('input[type="radio"]:checked, [data-value]');
      const raw = control ? control.value : "";
      if (!raw && required) questionError(fieldset, "Choose a rating.");
      if (!raw) return {};
      const value = Number(raw);
      const minimum = Number(fieldset.dataset.minimum);
      const maximum = Number(fieldset.dataset.maximum);
      if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
        questionError(fieldset, `Enter a whole number from ${minimum} to ${maximum}.`, control);
      }
      return { value };
    }
    if (type === "radio") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose one option.");
      if (!selected) return {};
      const answer = { value: selected.value };
      if (selected.value === "other") {
        const other = fieldset.querySelector("[data-other-text]");
        if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
        answer.otherText = other.value;
      }
      return answer;
    }
    const selected = [...fieldset.querySelectorAll('input[type="checkbox"]:checked')];
    if (!selected.length && required) questionError(fieldset, "Choose at least one option.");
    if (!selected.length) return {};
    const answer = { values: selected.map((control) => control.value) };
    if (answer.values.includes("other")) {
      const other = fieldset.querySelector("[data-other-text]");
      if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
      answer.otherText = other.value;
    }
    return answer;
  }

  function collectAnswer() {
    if (["unsupported", "invalid-questions"].includes(form.dataset.formKind)) {
      throw new Error("This form cannot be displayed here. Continue in the conversation to provide your answer.");
    }
    const questionFields = [...form.querySelectorAll("fieldset[data-question-id]")];
    if (questionFields.length) {
      clearQuestionErrors();
      const batch = form.dataset.collectionMode === "batch";
      const answers = [];
      for (const [index, fieldset] of questionFields.entries()) {
        try {
          answers.push({ questionId: fieldset.dataset.questionId, ...collectQuestion(fieldset) });
        } catch (error) {
          showQuestionStep(index, false);
          throw error;
        }
      }
      if (batch) return { answers };
      const [{ questionId: _questionId, ...answer }] = answers;
      return answer;
    }
    const answer = {};
    for (const control of form.querySelectorAll("[data-field]")) {
      const field = control.dataset.field;
      const type = control.dataset.type;
      const required = control.dataset.required === "true";
      if (control.value === "" && !required) continue;
      if (control.value === "" && required) throw new Error(`Enter ${field}.`);
      if (type === "boolean") answer[field] = control.value === "true";
      else if (type === "integer") answer[field] = Number.parseInt(control.value, 10);
      else if (type === "number") answer[field] = Number(control.value);
      else answer[field] = control.value;
    }
    return answer;
  }

  function draftRequest() {
    if (runFlow?.stage === "monitor") return runHumanRequest();
    if (mode === "interaction") {
      const request = humanRequest(latest || {});
      return request && !humanRequestResolved(request) ? request : null;
    }
    if (mode === "authoring") {
      const request = humanRequest(latest || {});
      return request?.id && !humanRequestResolved(request) ? request : null;
    }
    return null;
  }

  function requestSchemaDigest(request) {
    return typeof request?.schemaDigest === "string" && /^[a-f0-9]{64}$/.test(request.schemaDigest)
      ? request.schemaDigest
      : undefined;
  }

  function interactionDraftIdentity(request, sessionId = viewPersistence.session?.viewSessionId) {
    const requestId = safeText(request?.id, 64);
    const schemaDigest = requestSchemaDigest(request);
    if (!workflowIdValid(sessionId) || !workflowIdValid(requestId) || !schemaDigest) return null;
    return { sessionId, requestId, schemaDigest, key: `${sessionId}:${requestId}:${schemaDigest}` };
  }

  function currentInteractionDraftIdentity() {
    return interactionDraftIdentity(draftRequest());
  }

  function sameInteractionDraftIdentity(left, right) {
    return Boolean(left && right && left.key === right.key);
  }

  function detachInteractionDraft() {
    clearTimeout(backendDraftTimer);
    backendDraftTimer = null;
    // Do not cancel the RPC itself: the persistence layer still owns its
    // idempotency receipt. Detaching makes every late handler a no-op here.
    backendDraftScope = null;
    backendDraft = null;
    backendDraftBusy = false;
    backendDraftDirty = false;
    backendDraftAttempt = null;
    backendDraftPromise = null;
    backendDraftChangeVersion = 0;
  }

  function ensureInteractionDraftScope(identity = currentInteractionDraftIdentity()) {
    if (!identity) {
      detachInteractionDraft();
      return null;
    }
    if (!backendDraftScope || !sameInteractionDraftIdentity(backendDraftScope.identity, identity)) {
      detachInteractionDraft();
      backendDraftScope = { identity };
    }
    return backendDraftScope;
  }

  function draftScopeCurrent(scope) {
    return backendDraftScope === scope &&
      sameInteractionDraftIdentity(scope?.identity, currentInteractionDraftIdentity());
  }

  function synchronizeInteractionDraftScope() {
    const identity = currentInteractionDraftIdentity();
    if (!identity) detachInteractionDraft();
    else ensureInteractionDraftScope(identity);
  }

  function questionAnswersById() {
    const answers = {};
    for (const fieldset of form.querySelectorAll("fieldset[data-question-id]")) {
      const questionId = fieldsetQuestionId(fieldset);
      if (!questionId) continue;
      const type = fieldset.dataset.inputType;
      let answer = {};
      if (["text", "long_text", "date"].includes(type)) {
        const control = fieldset.querySelector("[data-value]");
        if (control && control.value !== "") answer = { value: control.value };
      } else if (type === "boolean") {
        const selected = fieldset.querySelector('input[type="radio"]:checked');
        if (selected) answer = { value: selected.value === "true" };
      } else if (type === "rating") {
        const selected = fieldset.querySelector('input[type="radio"]:checked, [data-value]');
        if (selected && selected.value !== "") {
          const value = Number(selected.value);
          answer = Number.isSafeInteger(value) ? { value } : { value: selected.value };
        }
      } else if (type === "radio") {
        const selected = fieldset.querySelector('input[type="radio"]:checked');
        if (selected) {
          answer = { value: selected.value };
          if (selected.value === "other") answer.otherText = fieldset.querySelector("[data-other-text]")?.value || "";
        }
      } else if (type === "checkbox") {
        const selected = [...fieldset.querySelectorAll('input[type="checkbox"]:checked')];
        if (selected.length) {
          answer = { values: selected.map((control) => control.value) };
          if (answer.values.includes("other")) answer.otherText = fieldset.querySelector("[data-other-text]")?.value || "";
        }
      }
      answers[questionId] = answer;
    }
    return answers;
  }

  function restoreQuestionAnswers(answers) {
    if (!answers || typeof answers !== "object" || Array.isArray(answers)) return;
    for (const fieldset of form.querySelectorAll("fieldset[data-question-id]")) {
      const answer = answers[fieldsetQuestionId(fieldset)];
      if (!answer || typeof answer !== "object" || Array.isArray(answer)) continue;
      const type = fieldset.dataset.inputType;
      if (["text", "long_text", "date"].includes(type)) {
        const control = fieldset.querySelector("[data-value]");
        if (control && typeof answer.value === "string") control.value = answer.value;
      } else if (type === "boolean") {
        const value = typeof answer.value === "boolean" ? String(answer.value) : "";
        const control = [...fieldset.querySelectorAll('input[type="radio"]')].find((candidate) => candidate.value === value);
        if (control) control.checked = true;
      } else if (type === "rating") {
        const control = [...fieldset.querySelectorAll('input[type="radio"], [data-value]')].find((candidate) => candidate.value === String(answer.value));
        if (control) { if (control.type === "radio") control.checked = true; else control.value = String(answer.value); }
      } else if (type === "radio") {
        const control = [...fieldset.querySelectorAll('input[type="radio"]')].find((candidate) => candidate.value === answer.value);
        if (control) control.checked = true;
      } else if (type === "checkbox" && Array.isArray(answer.values)) {
        for (const control of fieldset.querySelectorAll('input[type="checkbox"]')) control.checked = answer.values.includes(control.value);
      }
      if (typeof answer.otherText === "string") {
        const other = fieldset.querySelector("[data-other-text]");
        if (other) other.value = answer.otherText;
      }
      fieldset.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  async function loadInteractionDraft(request, epoch = viewHydrationEpoch) {
    if (!request?.id || !inputSpecSupported(request.inputSpec)) return true;
    const authoritativeDigest = requestSchemaDigest(request);
    if (!authoritativeDigest) {
      persistenceStatus("load_failed");
      return false;
    }
    const identity = interactionDraftIdentity(request);
    if (!identity || !sameInteractionDraftIdentity(identity, currentInteractionDraftIdentity())) return false;
    const scope = ensureInteractionDraftScope(identity);
    if (!scope || backendDraftBusy) return true;
    backendDraftBusy = true;
    try {
      const data = await persistenceTool("loomex_interaction_draft_get", { requestId: request.id });
      if (!draftScopeCurrent(scope) || epoch !== viewHydrationEpoch) return false;
      if (data?.draft && data.draft.schemaDigest !== authoritativeDigest) {
        persistenceStatus("load_failed");
        return false;
      }
      if (backendDraftAttempt && data?.draft && data.draft.revision > backendDraftAttempt.payload.expectedRevision &&
        exactJsonEqual(data.draft.answers, backendDraftAttempt.payload.answers) &&
        data.draft.currentQuestionId === backendDraftAttempt.payload.currentQuestionId && data.draft.phase === backendDraftAttempt.payload.phase) {
        backendDraft = data.draft;
        if (backendDraftChangeVersion === backendDraftAttempt.version) backendDraftDirty = false;
        backendDraftAttempt = null;
      }
      if (backendDraftDirty) {
        const conflict = new Error("This answer draft changed while local edits were pending.");
        conflict.code = "INTERACTION_DRAFT_CONFLICT";
        persistenceStatus("save_failed", conflict);
        return false;
      }
      backendDraft = data?.draft || null;
      if (backendDraft) {
        restoreQuestionAnswers(backendDraft.answers);
        const fields = [...form.querySelectorAll("fieldset[data-question-id]")];
        const index = fields.findIndex((fieldset) => fieldsetQuestionId(fieldset) === backendDraft.currentQuestionId);
        if (index >= 0) showQuestionStep(index, false);
        if (backendDraft.phase === "review") {
          try { beginAnswerReview(); } catch { /* Keep the incomplete draft in answer mode. */ }
        }
      }
      backendDraftDirty = false;
      persistenceStatus("saved");
      return true;
    } catch (error) {
      if (draftScopeCurrent(scope) && epoch === viewHydrationEpoch) persistenceStatus("load_failed", error);
      return false;
    } finally {
      if (backendDraftScope === scope) backendDraftBusy = false;
    }
  }

  async function refreshReopenedInteraction(reopen, viewSessionId, epoch) {
    if (!reopen || reopen.viewSessionId !== viewSessionId || !workflowIdValid(reopen.requestId)) {
      throw new Error("The reopened request is not bound to this saved interaction view.");
    }
    const requestId = reopen.requestId;
    const refreshKey = `${viewSessionId}:${requestId}`;
    if (refreshedInteractionViews.has(refreshKey)) return true;
    const result = await callTool("loomex_interaction_get", { requestId }, false, false);
    const data = dataOf(result);
    const request = humanRequest(data);
    if (result?.isError || result?.structuredContent?.ok === false || !request || request.id !== requestId) {
      throw new Error("The reopened request could not be verified.");
    }
    if (epoch !== viewHydrationEpoch || viewPersistence.session?.viewSessionId !== viewSessionId) return false;
    refreshedInteractionViews.add(refreshKey);
    latest = data;
    // Preserve the existing presentation session while replacing the stale
    // notification payload with the request's authoritative current state.
    render({ structuredContent: { ok: true, data } });
    return true;
  }

  function scheduleInteractionDraft() {
    const request = draftRequest();
    if (!mutationHydrationReady() || !request || !inputSpecSupported(request.inputSpec) || !requestSchemaDigest(request)) return;
    const scope = ensureInteractionDraftScope(interactionDraftIdentity(request));
    if (!scope) return;
    backendDraftDirty = true;
    backendDraftChangeVersion += 1;
    persistenceStatus("dirty");
    clearTimeout(backendDraftTimer);
    backendDraftTimer = setTimeout(() => {
      if (draftScopeCurrent(scope)) void flushInteractionDraft();
    }, 350);
  }

  async function flushInteractionDraft() {
    const request = draftRequest();
    if (!viewPersistence.session || !request || !inputSpecSupported(request.inputSpec) || !backendDraftDirty) return true;
    if (!mutationHydrationReady()) return false;
    const authoritativeDigest = requestSchemaDigest(request);
    if (!authoritativeDigest) {
      persistenceStatus("save_failed");
      return false;
    }
    const identity = interactionDraftIdentity(request);
    const scope = ensureInteractionDraftScope(identity);
    if (!scope || !draftScopeCurrent(scope)) return false;
    if (backendDraftPromise) {
      try { await backendDraftPromise; }
      catch (error) {
        if (draftScopeCurrent(scope)) persistenceStatus("save_failed", error);
        return false;
      }
      if (!draftScopeCurrent(scope)) return false;
      if (!backendDraftDirty) return true;
    }
    if (backendDraftBusy) {
      // Navigation can queue a second save while the first delayed write is
      // still in flight. Treat that as one serialized save sequence so a
      // follower does not turn the temporary overlap into a visible failure.
      const inFlight = backendDraftPromise;
      if (!inFlight) {
        await Promise.resolve();
        if (!draftScopeCurrent(scope)) return false;
        if (backendDraftBusy) return false;
      } else {
        try { await inFlight; }
        catch (error) {
          if (draftScopeCurrent(scope)) persistenceStatus("save_failed", error);
          return false;
        }
        if (!draftScopeCurrent(scope)) return false;
        if (!backendDraftDirty) return true;
        return flushInteractionDraft();
      }
    }
    clearTimeout(backendDraftTimer);
    backendDraftTimer = null;
    backendDraftBusy = true;
    const requestId = request.id;
    if (!backendDraftAttempt) backendDraftAttempt = { version: backendDraftChangeVersion, payload: {
        requestId,
        expectedRevision: backendDraft?.requestId === requestId ? backendDraft.revision : 0,
        expectedSchemaDigest: authoritativeDigest,
        idempotencyKey: uuid(),
        answers: questionAnswersById(),
        currentQuestionId: visibleQuestionId(),
        phase: form.dataset.answerPhase === "review" ? "review" : "answer",
      } };
    const attempt = backendDraftAttempt;
    let saved = false;
    try {
      backendDraftPromise = persistenceTool("loomex_interaction_draft_update", immutableCopy(attempt.payload));
      const data = await backendDraftPromise;
      if (!draftScopeCurrent(scope) || backendDraftAttempt !== attempt) return false;
      backendDraft = data?.draft || data;
      if (backendDraftChangeVersion === attempt.version) backendDraftDirty = false;
      backendDraftAttempt = null;
      persistenceStatus("saved");
      saved = true;
    } catch (error) {
      if (draftScopeCurrent(scope) && backendDraftAttempt === attempt) {
        backendDraftDirty = true;
        persistenceStatus("save_failed", error);
      }
    } finally {
      if (backendDraftScope === scope) {
        backendDraftPromise = null;
        backendDraftBusy = false;
      }
    }
    if (!saved) return false;
    if (draftScopeCurrent(scope) && backendDraftDirty) return flushInteractionDraft();
    return true;
  }

  function scheduleCurrentPersistence() {
    if (!mutationHydrationReady()) return;
    markViewDirty();
    scheduleInteractionDraft();
  }

  async function flushCurrentPersistence() {
    if (persistenceBlocked()) {
      setError(new Error("This action needs saved view storage, but it is currently unavailable. Try again after the view reconnects."));
      return false;
    }
    if (viewPersistence.session && !mutationHydrationReady()) {
      setError(new Error("The saved view is still restoring. Wait for it to finish, then try this action again."));
      return false;
    }
    const scope = backendDraftScope;
    const draftSaved = await flushInteractionDraft();
    if (scope && !draftScopeCurrent(scope)) return false;
    const viewSaved = await viewPersistence.flush(captureViewState());
    if (!draftSaved || !viewSaved) {
      persistenceStatus("save_failed");
      setError(new Error("Your changes could not be saved, so this action was not sent. Try again after saving succeeds."));
    }
    return draftSaved && viewSaved;
  }

  function openAnswerReview() {
    // Review changes presentation only. Save the reviewed state in the same
    // serialized autosave path as navigation; Submit awaits durable storage.
    if (!beginAnswerReview()) throw new Error("The answer preview could not be opened.");
    saveReviewNavigation();
    return true;
  }

  function saveReviewNavigation() {
    // Moving between answer and review is local navigation. Keep that local
    // state usable if its follow-up save is unavailable; submitting still
    // performs the mandatory durable flush below.
    scheduleCurrentPersistence();
    const scope = backendDraftScope;
    void (async () => {
      const draftSaved = await flushInteractionDraft();
      if (scope && !draftScopeCurrent(scope)) return;
      const viewSaved = await viewPersistence.flush(captureViewState());
      if ((!draftSaved || !viewSaved) && (!scope || draftScopeCurrent(scope))) persistenceStatus("save_failed");
    })().catch((error) => {
      if (!scope || draftScopeCurrent(scope)) persistenceStatus("save_failed", error);
    });
  }

  function restoreReviewNavigationControls(button) {
    button.dataset.reviewNavigation = "true";
  }

  async function restoreViewState(state) {
    if (!state || state.schemaVersion !== 1) return;
    if (await followForwardSession(state)) return true;
    if (mode === "browser" && !runFlow) {
      const browser = state.browser;
      if (!browser || typeof browser !== "object") return;
      if (workflowIdValid(browser.forwardViewSessionId) && workflowIdValid(browser.forwardWorkflowId)) {
        const returnViewSessionId = viewPersistence.session?.viewSessionId || "";
        const result = await callTool("loomex_run_setup", {
          workflowId: browser.forwardWorkflowId,
          ...(Number.isInteger(browser.forwardVersion) ? { version: String(browser.forwardVersion) } : {}),
          ...taskWorkspaceArguments(),
          viewSessionId: browser.forwardViewSessionId,
        }, false, false);
        const setup = dataOf(result);
        if (result?.isError || result?.structuredContent?.ok === false || !selectedWorkflowVersion(setup) || setup.workflow.id !== browser.forwardWorkflowId ||
            viewSessionProjection(result)?.viewSessionId !== browser.forwardViewSessionId) {
          throw new Error("The saved run setup could not be verified.");
        }
        initializeRunSetup(setup, true, setupRequestIdentity(result));
        runFlow.returnViewSessionId = returnViewSessionId;
        observeViewPersistence(result);
        renderIntegratedRunFlow();
        return true;
      }
      const args = browser.arguments && typeof browser.arguments === "object" ? browser.arguments : null;
      const history = Array.isArray(browser.history) ? browser.history : [];
      // A fresh browser card starts with default arguments but no trusted page.
      // Fetch the saved page even when its arguments happen to equal those defaults.
      if (args && (!exactJsonEqual(args, browserArgs) || !workflowPageData(browserPage))) {
        await loadBrowserPage(args, history);
      } else browserHistory = history;
      if (workflowIdValid(browser.selectedWorkflowId) && browserSelected?.workflow?.id !== browser.selectedWorkflowId) {
        await browserRead("loomex_workflow_get", {
          workflowId: browser.selectedWorkflowId,
          ...(Number.isInteger(browser.selectedVersion) ? { version: String(browser.selectedVersion) } : {}),
        }, (data) => { browserSelected = data; });
      }
      const search = document.getElementById("workflow-search");
      if (search && typeof browser.searchDraft === "string") search.value = browser.searchDraft;
      restoreDisclosures(state.disclosures);
      return;
    }
    if (runFlow?.stage === "setup" && state.workflowId === runFlow.selected?.workflowId && state.versionId === runFlow.selected?.versionId) {
      runFlow.workspaceEditing = runFlow.workspaceEditing || state.workspaceEditing === true;
      if (workflowIdValid(state.returnBrowserViewSessionId)) runFlow.returnViewSessionId = state.returnBrowserViewSessionId;
      renderIntegratedRunFlow();
      restoreControls(state.controls);
    } else if (runFlow?.stage === "review" && state.preparationId === runFlow.prepared?.preparationId) {
      if (workflowIdValid(state.returnBrowserViewSessionId)) runFlow.returnViewSessionId = state.returnBrowserViewSessionId;
      if (workflowIdValid(state.setupViewSessionId)) runFlow.setupViewSessionId = state.setupViewSessionId;
      if (Number.isSafeInteger(state.workflowVersion) && state.workflowVersion > 0) runFlow.editWorkflowVersion = state.workflowVersion;
    } else if (runFlow?.stage === "monitor" && state.executionId === executionId(runFlow.result)) {
      const acceptedRequestId = safeText(state.acceptedRequestId, 64);
      if (workflowIdValid(acceptedRequestId)) {
        const result = await callTool("loomex_interaction_get", { requestId: acceptedRequestId }, false);
        const restored = humanRequest(dataOf(result));
        if (result?.isError || !restored || restored.id !== acceptedRequestId ||
            restored.execution?.id !== state.executionId || !humanRequestResolved(restored)) {
          throw new Error("The saved response review could not be verified for this run.");
        }
        runFlow.acceptedRequest = restored;
      }
      renderIntegratedRunFlow();
    } else if (mode === "authoring" && state.builderSessionId === builderSessionId(latest || {})) {
      restoreControls(state.controls);
      const fields = [...form.querySelectorAll("fieldset[data-question-id]")];
      const index = fields.findIndex((fieldset) => fieldsetQuestionId(fieldset) === state.currentQuestionId);
      if (index >= 0) showQuestionStep(index, false);
      if (state.phase === "review") {
        try { beginAnswerReview(); } catch { /* Preserve the draft for correction. */ }
      }
    } else if (mode === "interaction" && state.requestId === interactionId(latest || {})) {
      const fields = [...form.querySelectorAll("fieldset[data-question-id]")];
      const index = fields.findIndex((fieldset) => fieldsetQuestionId(fieldset) === state.currentQuestionId);
      if (index >= 0) showQuestionStep(index, false);
    }
    restoreDisclosures(state.disclosures);
  }

  async function followForwardSession(state) {
    let forward = state?.forwardSession;
    if (!forward) return false;
    const traversed = new Set();
    let target;
    let returnBrowserViewSessionId = state.returnBrowserViewSessionId || viewPersistence.session?.viewSessionId || "";
    try {
      // A durable transition can span setup → preparation → monitor. Resolve the
      // complete verified chain before consulting a preparation, since committed
      // preparations are intentionally stale and must lead to their monitor.
      while (forward) {
        if (!workflowIdValid(forward.viewSessionId) || !workflowIdValid(forward.entityId) ||
            traversed.has(forward.viewSessionId) || followedViewSessions.has(forward.viewSessionId)) {
          throw new Error("The saved navigation path is cyclic or incomplete.");
        }
        traversed.add(forward.viewSessionId);
        followedViewSessions.add(forward.viewSessionId);
        target = await persistenceTool(VIEW_SESSION_TOOLS.get, { viewSessionId: forward.viewSessionId });
        if (target.kind !== forward.kind || target.entityType !== forward.entityType || target.entityId !== forward.entityId) {
          throw new Error("The saved next view no longer matches this navigation path.");
        }
        const next = target.state?.forwardSession;
        if (!next) break;
        returnBrowserViewSessionId = target.state?.returnBrowserViewSessionId || returnBrowserViewSessionId;
        forward = next;
      }
      if (!target) return false;
    if (forward.kind === "prepare" && forward.entityType === "workflow") {
      const result = await callTool("loomex_run_setup", {
        workflowId: forward.entityId,
        ...taskWorkspaceArguments(),
        viewSessionId: forward.viewSessionId,
      }, false, false);
      const setup = dataOf(result);
      if (result?.isError || result?.structuredContent?.ok === false || !selectedWorkflowVersion(setup) || setup.workflow.id !== forward.entityId ||
          viewSessionProjection(result)?.viewSessionId !== forward.viewSessionId) {
        throw new Error("The saved run setup could not be verified.");
      }
      initializeRunSetup(setup, true, setupRequestIdentity(result));
      runFlow.returnViewSessionId = returnBrowserViewSessionId;
      observeViewPersistence({ _meta: { "loomex/viewSession": target } });
      renderIntegratedRunFlow();
      return true;
    }
    if (forward.kind === "prepare" && forward.entityType === "preparation") {
      const result = await callTool("loomex_preparation_get", { preparationId: forward.entityId }, false);
      const restored = dataOf(result);
      // The commit sealed this preparation. A durable commit result gives us a
      // verified execution identity, so follow that identity rather than
      // presenting a sealed review as an expired local draft.
      const committedRunId = safeText(restored?.executionId, 64);
      if (restored?.status === "stale" && restored?.reason === "commit_started" && workflowIdValid(committedRunId)) {
        const snapshot = await callTool("loomex_run_get", { runId: committedRunId }, false);
        const run = dataOf(snapshot);
        if (snapshot?.isError || snapshot?.structuredContent?.ok === false || executionId(run) !== committedRunId) {
          throw new Error("The committed run could not be verified while restoring this view.");
        }
        initializeRunMonitor(run, null);
        runFlow.returnToBrowser = Boolean(returnBrowserViewSessionId);
        runFlow.returnViewSessionId = returnBrowserViewSessionId;
        observeViewPersistence({ _meta: { "loomex/viewSession": target } });
        renderIntegratedRunFlow();
        return true;
      }
      if (result?.isError || result?.structuredContent?.ok === false || restored?.status !== "valid" || restored?.operation !== "runs.prepare" ||
          restored?.preparation?.preparationId !== forward.entityId) {
        throw new Error("The saved preparation is no longer available. Return to setup and prepare it again.");
      }
      latest = restored.preparation;
      observePreparationReview(result, restored.preparation);
      initializePreparedRunReview(restored.preparation);
      runFlow.returnToBrowser = Boolean(returnBrowserViewSessionId);
      runFlow.returnViewSessionId = returnBrowserViewSessionId;
      observeViewPersistence({ _meta: { "loomex/viewSession": target } });
      renderIntegratedRunFlow();
      return true;
    }
    if (forward.kind === "monitor" && forward.entityType === "execution") {
      const result = await callTool("loomex_run_get", { runId: forward.entityId }, false);
      const run = dataOf(result);
      if (result?.isError || result?.structuredContent?.ok === false || executionId(run) !== forward.entityId) {
        throw new Error("The saved run could not be verified.");
      }
      initializeRunMonitor(run, null);
      runFlow.returnToBrowser = Boolean(returnBrowserViewSessionId);
      runFlow.returnViewSessionId = returnBrowserViewSessionId;
      observeViewPersistence({ _meta: { "loomex/viewSession": target } });
      renderIntegratedRunFlow();
      return true;
    }
    if (forward.kind === "authoring" && forward.entityType === "builderSession") {
      const result = await callTool("loomex_builder_get", { sessionId: forward.entityId, viewSessionId: forward.viewSessionId }, false);
      const authoring = dataOf(result);
      const supplied = viewSessionProjection(result);
      if (result?.isError || result?.structuredContent?.ok === false || builderSessionId(authoring) !== forward.entityId || supplied?.viewSessionId !== forward.viewSessionId) {
        throw new Error("The saved authoring session could not be verified.");
      }
      mode = "authoring";
      document.body.dataset.mode = mode;
      latest = authoring;
      render(result);
      return true;
    }
    throw new Error("This saved navigation target cannot be restored safely in this view.");
    } catch (error) {
      for (const viewSessionId of traversed) followedViewSessions.delete(viewSessionId);
      throw error;
    }
  }

  function restoredOperationSlot(operation) {
    const args = operation?.params || {};
    const tool = JOURNAL_TOOLS[operation.method];
    if (tool === "loomex_interaction_respond") return `interaction:respond:${args.requestId}`;
    if (tool === "loomex_interaction_decide") return `interaction:${args.decision}:${args.requestId}`;
    if (tool === "loomex_builder_respond") return `builder:respond:${args.sessionId}`;
    if (tool === "loomex_run_cancel") return `run:cancel:${args.runId}`;
    if (tool === "loomex_run_commit") return `loomex_run_commit:${args.preparationId}`;
    if (tool === "loomex_builder_commit") return `loomex_builder_commit:${args.preparationId}`;
    if (tool === "loomex_workspace_grant") return `workspace:${args.workspacePath}`;
    if (tool === "loomex_run_prepare") return `prepare:${args.versionId}:${args.workspacePath}`;
    return `restored:${operation.operationId}`;
  }

  async function restoreJournalOperation(projection, epoch) {
    const reference = projection?.operation;
    if (!reference?.operationId || reference.operationId === restoredOperationId) return true;
    try {
      const operation = await persistenceTool(VIEW_SESSION_TOOLS.operationGet, {
        viewSessionId: projection.viewSessionId, operationId: reference.operationId,
      });
      if (epoch !== viewHydrationEpoch || viewPersistence.session?.viewSessionId !== projection.viewSessionId) return false;
      const slot = restoredOperationSlot(operation);
      const restored = {
        name: JOURNAL_TOOLS[operation.method],
        slot,
        arguments: immutableCopy(operation.params),
        uncertain: true,
        reconciled: false,
        operationId: operation.operationId,
        journalStatus: operation.status,
        viewSessionId: projection.viewSessionId,
        sessionRevision: projection.revision,
        sessionState: immutableCopy(projection.state || {}),
      };
      if (!restored.name) throw new Error("The saved operation method is not supported by this view.");
      if (operation.status === "completed" && ["loomex_run_prepare", "loomex_run_commit", "loomex_builder_commit", "loomex_editor_commit"].includes(restored.name)) {
        const ref = operation.resultReference || {};
        if (!workflowIdValid(ref.nextViewSessionId)) throw new Error("The completed action is missing its durable next-view reference.");
        const knownTarget = await persistenceTool(VIEW_SESSION_TOOLS.get, { viewSessionId: ref.nextViewSessionId });
        if (restored.name === "loomex_run_prepare") {
          const preparationId = safeText(ref.preparationId, 64);
          const result = await callTool("loomex_preparation_get", { preparationId }, false);
          const data = dataOf(result);
          if (result?.isError || data?.status !== "valid" || data?.preparation?.preparationId !== preparationId) throw new Error("The completed preparation could not be restored safely.");
          latest = data.preparation;
          initializePreparedRunReview(data.preparation);
          runFlow.returnViewSessionId = safeText(projection.state?.returnBrowserViewSessionId, 64) || "";
          runFlow.returnToBrowser = Boolean(runFlow.returnViewSessionId);
          restored.targetSession = knownTarget;
          if (restored.targetSession.kind !== "prepare" || restored.targetSession.entityType !== "preparation" || restored.targetSession.entityId !== preparationId) {
            throw new Error("The saved preparation view binding did not match.");
          }
        } else if (restored.name === "loomex_run_commit") {
          const runId = safeText(ref.executionId, 64);
          const result = await callTool("loomex_run_get", { runId }, false);
          const data = dataOf(result);
          if (result?.isError || executionId(data) !== runId) throw new Error("The completed run start could not be restored safely.");
          initializeRunMonitor(data, null);
          runFlow.returnViewSessionId = safeText(projection.state?.returnBrowserViewSessionId, 64) || "";
          runFlow.returnToBrowser = Boolean(runFlow.returnViewSessionId);
          restored.targetSession = knownTarget;
          if (restored.targetSession?.kind !== "monitor" || restored.targetSession?.entityType !== "execution" || restored.targetSession?.entityId !== runId) {
            throw new Error("The saved run view binding did not match.");
          }
        } else {
          const sessionId = safeText(ref.builderSessionId, 64);
          const result = await callTool("loomex_builder_get", { sessionId, viewSessionId: knownTarget.viewSessionId }, false);
          if (result?.isError || builderSessionId(dataOf(result)) !== sessionId || viewSessionProjection(result)?.viewSessionId !== knownTarget.viewSessionId) throw new Error("The completed authoring start could not be restored safely.");
          mode = "authoring";
          document.body.dataset.mode = mode;
          latest = dataOf(result);
          restored.targetSession = knownTarget;
          if (restored.targetSession.kind !== "authoring" || restored.targetSession.entityType !== "builderSession" || restored.targetSession.entityId !== sessionId) {
            throw new Error("The saved authoring view binding did not match.");
          }
        }
        if (!restored.targetSession) throw new Error("The completed action's next view could not be verified.");
        await transitionSessionAfterSuccess(restored);
        restoredOperationId = operation.operationId;
        if (runFlow) renderIntegratedRunFlow(); else render({ structuredContent: { ok: true, data: latest } });
        return true;
      }
      if (operation.status === "completed") return true;
      if (runFlow) {
        restored.label = restored.name === "loomex_run_commit" ? "start"
          : restored.name === "loomex_run_prepare" ? "review"
            : restored.name === "loomex_workspace_grant" ? "workspace check"
              : restored.name === "loomex_run_cancel" ? "cancellation"
                : restored.name === "loomex_interaction_decide" ? operation.params.decision === "reject" ? "rejection" : "approval"

      } else {

  function observeViewPersistence(result) {

      syncRestorationVisibility();
      hydratedReadySessionId = "";
      persistenceStatus("save_failed");
      return;
    }
    const supplied = viewSessionProjection(result);
    if (!supplied) {
      if (!viewPersistence.session) { viewRestoring = false; syncRestorationVisibility(); }
      return;
    }
    viewRestoring = true;
    syncRestorationVisibility();
    viewPersistenceUnavailable = false;
    const changedSession = viewPersistence.configure(supplied);
    if (changedSession) {

      detachInteractionDraft();
    }
    hydratedReadySessionId = "";
    if (["inactive", "resolved"].includes(supplied.status)) completedViewStatuses.add(`${supplied.viewSessionId}:${supplied.status}`);
    const epoch = ++viewHydrationEpoch;
    const localChangeVersion = viewPersistence.changeVersion;
    return new Promise((resolve) => queueMicrotask(async () => {
      let ready = false;
      try {
        const projection = await viewPersistence.hydrate();
        if (!projection || epoch !== viewHydrationEpoch) return;
        const reopen = mode === "interaction" ? (reopenedInteraction || {

          requestId: interactionId(latest || {}),
        }) : null;
        if (reopen && (reopen.viewSessionId !== projection.viewSessionId || !workflowIdValid(reopen.requestId) ||
            projection.kind !== "interaction" || projection.entityType !== "request" || projection.entityId !== reopen.requestId)) {

        if (reopen && (projection.status === "resolved" || projection.revision > 0 || reopenedInteraction) && hydratedSessionId !== projection.viewSessionId && viewPersistence.changeVersion === localChangeVersion) {

        }
        if (!viewEntityMatches(projection)) return;
        // A resolved monitor session is only a restoration hint. Re-read the
        // exact execution once before restoring a completed card so an old
        // notification cannot make an active run look finished (or vice versa).
        if (mode === "monitor" && projection.status === "resolved" && hydratedSessionId !== projection.viewSessionId &&

          refresh.disabled = !connected;

          hydratedReadySessionId = projection.viewSessionId;
          delete refresh.dataset.retryViewHydration;
          // The first preparation render can occur before the host connection
          // and durable session finish initializing. Re-render setup and
          // review cards so Start derives from the authoritative lifecycle
          // rather than a previously-disabled DOM node. Monitor cards retain
          // their restored cancellation controls without another DOM reset.

          restoreReadingPosition(projection.state, epoch);

          // lifecycle status after authoritative hydration so a remount can
          // request the current domain state before restoring that card.
          const completedStatus = desiredViewStatus();
          if (completedStatus) void markCurrentViewStatus(completedStatus);
          ready = true;
        }
      } catch (error) {
        if (epoch !== viewHydrationEpoch) return;
        hydratedReadySessionId = "";
        persistenceStatus("load_failed", error);
        setError(error);
        refresh.dataset.retryViewHydration = "true";
        refresh.hidden = false;
        setAction(refresh, "Retry restore");
        refresh.disabled = !connected;

        // reveal content while the destination is still restoring.

          syncRestorationVisibility();
        }
        resolve(ready);
      }

  }

  // Browsing only reads metadata. Execution preparation stays in the conversation.
  const WORKFLOW_PAGE_SIZE = 5;

  let browserSelected = null;
  let browserDetailResponse = null;
  let browserBusy = false;
  let browserEpoch = 0;
  let browserFocusReturn = null;
  const workflowIdValid = (id) => typeof id === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

  function browserButton(label, action, disabled = false, className = "secondary", visibleLabel = false, allowWithoutPersistence = false) {

  function showBrowserSkeleton(label) {
    const active = document.activeElement;

      ? { id: active.id, label: active.getAttribute("aria-label") }

    if (focusReturn) browserFocusReturn = focusReturn;

    if (showLine) skeleton.append(element("div", { className: "skeleton-line" }));
    const availableRowsHeight = Math.max(0, height - controlHeight - 8 - (showLine ? controlHeight + 8 : 0));
    const rowCount = availableRowsHeight >= 16 ? Math.max(1, Math.min(6, Math.floor((availableRowsHeight + 8) / 64))) : 0;
    const rowHeight = rowCount ? Math.min(68, Math.floor((availableRowsHeight - ((rowCount - 1) * 8)) / rowCount)) : 0;

  function clearBrowserSkeleton() {
    context.querySelector(".workflow-skeleton")?.remove();
    context.querySelector(".workflow-loading-status")?.remove();
    context.classList.remove("workflow-loading-host");
    context.style.minHeight = "";
    updateActivity();
  }

  function restoreBrowserFocus(preferHeading = false) {
    let target = browserFocusReturn?.id ? document.getElementById(browserFocusReturn.id) : null;

  async function browserRead(name, args, commit) {
    if (browserBusy || !connected) return;
    const epoch = ++browserEpoch;
    browserBusy = true;
    showBrowserSkeleton(name === "loomex_workflow_get" ? "Loading workflow details" : "Loading workflows");
    summary.classList.remove("error");
    try {
      const result = await callTool(name, args, false, false);
      if (epoch !== browserEpoch) return;
      if (result.isError || result.structuredContent?.ok === false) throw new Error("Workflows could not be loaded. Try Refresh again.");
      if (viewSessionProjection(result) && !await observeViewPersistence(result)) {
        throw new Error("The saved workflow view could not be restored before applying this result.");
      }
      if (epoch !== browserEpoch) return;
      const data = dataOf(result);
      if (pagedResponse(data)) {
        if (name === "loomex_workflows_list") { browserDetailResponse = null; commit(data); }
        else browserDetailResponse = { data, workflowId: args.workflowId };
      }
      else {
      if (name === "loomex_workflows_list" && !workflowPageData(data)) throw new Error("The workflow list could not be verified. Continue in the conversation.");
      if (name === "loomex_workflow_get" && (!data.workflow || data.workflow.id !== args.workflowId)) throw new Error("The workflow details could not be verified. Refresh and try again.");
      browserDetailResponse = null; commit(data);
      }
