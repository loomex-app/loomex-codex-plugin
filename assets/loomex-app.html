<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Loomex</title>
  <style>__LOOMEX_DESIGN_SYSTEM__</style>
  <style>
    /* Iframe-only geometry and interaction rules. Shared visual primitives are injected above. */
    :root {
      color-scheme: dark;
      --loomex-space-1: 4px;
      --loomex-space-2: 8px;
      --loomex-space-3: 12px;
      --loomex-space-4: 16px;
      --loomex-space-5: 20px;
      --loomex-shell-width: 720px;
      --loomex-control-height: 36px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-bg-dark); color: var(--color-gray-300); font-family: var(--font-sans); font-size: 0.875rem; line-height: 1.5; }
    main { display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; max-width: var(--loomex-shell-width); margin: 0 auto; padding: 0 var(--loomex-space-3); }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: var(--loomex-space-2); min-height: 48px; }
    .header-identity { min-width: 0; flex: 1 1 auto; display: flex; align-items: center; flex-wrap: wrap; gap: var(--loomex-space-2); }
    h1 { min-width: 0; flex: 1 1 auto; margin: 0; font-size: 13px; font-weight: 650; line-height: 1.3; color: var(--color-gray-400); overflow-wrap: anywhere; }
    .header-stage, .header-status { min-width: 0; max-width: min(18rem, 45vw); overflow: hidden; text-overflow: ellipsis; flex: none; font-size: 11px; line-height: 1.2; white-space: nowrap; }
    .header-tools { display: flex; align-items: center; gap: var(--loomex-space-1); }
    .app-body { display: grid; gap: var(--loomex-space-3); padding: 0 0 var(--loomex-space-2); }
    .app-footer { padding: var(--loomex-space-1) 0 var(--loomex-space-2); }
    .app-footer:not(:has(button:not([hidden]))) { display: none; }
    .run-clock { display: inline-flex; align-items: center; gap: var(--loomex-space-1); font-size: 12px; color: var(--color-gray-400); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .run-clock svg { width: 14px; height: 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    #summary { margin: 0; font-size: 13px; color: var(--color-gray-400); white-space: pre-wrap; overflow-wrap: anywhere; }
    #summary.error, .notice.error { color: var(--color-brand-pink); border: 1px solid color-mix(in srgb, var(--color-brand-pink) 20%, transparent); background: color-mix(in srgb, var(--color-brand-pink) 5%, transparent); }
    .ui-stack, .field { display: grid; gap: var(--loomex-space-3); }
    .ui-hero, .request-copy { display: grid; gap: var(--loomex-space-2); }
    .ui-hero h2, .request-copy h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .request-copy p, .ui-caption, .hint, .form-guide { margin: 0; color: var(--color-gray-400); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    .ui-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--loomex-space-2); color: var(--color-gray-400); font-size: 12px; }
    .ui-badge { max-width: 100%; overflow-wrap: anywhere; }
    .ui-badge.text-gray-500 { color: var(--color-gray-400); }
    .ui-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--loomex-space-3); margin: 0; }
    .ui-card { min-width: 0; display: grid; align-content: start; gap: var(--loomex-space-2); padding: var(--loomex-space-3); }
    fieldset { min-width: 0; margin: 0; padding: var(--loomex-space-3); }
    .question-heading { display: block; margin: 0 0 var(--loomex-space-3); color: var(--color-white); font-size: 16px; line-height: 1.35; font-weight: 650; letter-spacing: -.015em; overflow-wrap: anywhere; text-wrap: pretty; }
    fieldset.single-question .question-heading { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.035em; }
    .question-heading .required-mark { margin-inline-start: 2px; }
    .ui-label { margin: 0; color: var(--color-gray-400); font-size: 12px; font-weight: 550; }
    .ui-value { margin: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    .workspace-path { margin: 0; font: 11px/1.6 var(--font-mono); color: var(--color-gray-400); overflow-wrap: anywhere; }
    .provider-row { display: grid; gap: 2px; }
    .ui-section, .workflow-detail-section { display: grid; gap: var(--loomex-space-3); border-top: 1px solid var(--color-line); padding-top: var(--loomex-space-3); }
    .ui-section h3 { margin: 0; }
    .workflow-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--loomex-space-2); }
    .workflow-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--loomex-space-3); padding: var(--loomex-space-3); }
    .workflow-row:hover { background: color-mix(in srgb, var(--color-white) 5%, transparent); }
    .workflow-row-copy { min-width: 0; display: grid; gap: var(--loomex-space-1); }
    .workflow-row-actions, .workflow-search-actions { display: flex; flex-wrap: wrap; gap: var(--loomex-space-2); align-items: center; }
    .workflow-detail { display: grid; gap: var(--loomex-space-3); }
    .workflow-detail-heading { display: flex; align-items: start; justify-content: space-between; gap: var(--loomex-space-3); }
    .workflow-detail-heading .ui-hero { min-width: 0; }
    .workflow-detail-heading-actions { display: flex; flex: none; gap: var(--loomex-space-2); }
    .workflow-detail-list { margin: 0; display: grid; gap: 0; }
    .workflow-detail-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--loomex-space-3); align-items: baseline; padding: var(--loomex-space-2) 0; border-bottom: 1px solid var(--color-line); }
    .workflow-detail-item:last-child { border-bottom: 0; }
    .workflow-detail-item dd { margin: 0; text-align: right; }
    .ui-list { margin: 0; padding-left: var(--loomex-space-5); display: grid; gap: var(--loomex-space-1); font-size: 13px; }
    .ui-list li { overflow-wrap: anywhere; white-space: pre-wrap; }
    .review-list { margin: 0; display: grid; gap: var(--loomex-space-1); font-size: 13px; }
    .review-list dt { font-weight: 550; }
    .review-list dd { margin: 0 0 var(--loomex-space-2); white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-list .review-list { margin-left: var(--loomex-space-3); border-left: 2px solid var(--color-line); padding-left: var(--loomex-space-3); }
    .question-stepper { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--loomex-space-2); }
    .question-stepper output { text-align: center; color: var(--color-gray-400); font-size: 12px; font-variant-numeric: tabular-nums; }
    .answer-review { display: grid; gap: var(--loomex-space-3); }
    .answer-review-heading { display: grid; gap: var(--loomex-space-1); }
    .answer-review-heading h2 { margin: 0; font-size: 17px; line-height: 1.3; }
    .answer-review-list { display: grid; gap: var(--loomex-space-2); margin: 0; }
    .answer-review-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--loomex-space-2); align-items: start; padding: var(--loomex-space-3); }
    .answer-review-copy { min-width: 0; display: grid; gap: 2px; }
    .answer-review-copy dt { color: var(--color-gray-400); font-size: 12px; font-weight: 550; overflow-wrap: anywhere; }
    .answer-review-copy dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 650; }
    .ui-callout, .notice { margin: 0; display: grid; gap: var(--loomex-space-1); padding: var(--loomex-space-3) var(--loomex-space-4); }
    .ui-callout h3 { margin: 0; font-size: 12px; font-weight: 650; }
    .ui-callout p { margin: 0; font-size: 12px; color: var(--color-gray-400); }
    .ui-disclosure { color: var(--color-gray-400); font-size: 11px; border-top: 1px solid var(--color-line); padding-top: var(--loomex-space-3); }
    .ui-disclosure summary { cursor: pointer; width: fit-content; padding: var(--loomex-space-1) 0; }
    .ui-disclosure dl { padding-top: var(--loomex-space-3); font-size: 11px; }
    .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--loomex-space-2); align-items: center; }
    .actions > .ui-caption:first-child { margin-right: auto; }
    .app-footer .actions #secondary { margin-right: auto; }
    .app-body > .actions, .app-body .workflow-detail > .actions, .app-body nav.actions, .app-body section.actions { border-top: 1px solid var(--color-line); padding-top: var(--loomex-space-2); }
    .loomex-danger { border-color: color-mix(in srgb, var(--color-brand-pink) 35%, transparent); color: var(--color-brand-pink); }
    .loomex-danger:hover:not(:disabled) { border-color: var(--color-brand-pink); background: color-mix(in srgb, var(--color-brand-pink) 10%, transparent); }
    .input-field { min-height: var(--loomex-control-height); }
    input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; margin: 0; padding: 0; accent-color: var(--color-brand-teal); flex: none; }
    textarea { min-height: 80px; resize: vertical; }
    :focus-visible { outline: 2px solid var(--color-brand-teal); outline-offset: 3px; }
    [aria-invalid="true"] { border-color: var(--color-brand-pink) !important; }
    [hidden] { display: none !important; }
    .choice { display: flex; align-items: flex-start; gap: var(--loomex-space-2); min-height: var(--loomex-control-height); border: 1px solid var(--color-line); border-radius: 0.5rem; padding: var(--loomex-space-2); background: color-mix(in srgb, var(--color-white) 2%, transparent); cursor: pointer; font-weight: 550; }
    .choice:has(input:checked) { border-color: color-mix(in srgb, var(--color-brand-teal) 35%, transparent); background: color-mix(in srgb, var(--color-brand-teal) 10%, transparent); }
    .choice:has(input:focus-visible) { outline: 2px solid var(--color-brand-teal); outline-offset: 3px; }
    .choice:has(input:disabled), .rating-choice:has(input:disabled) { cursor: not-allowed; opacity: .65; }
    .choice input:focus-visible { outline: none; }
    .other-entry { display: grid; gap: var(--loomex-space-2); margin-left: 26px; }
    .field-label { display: grid; gap: var(--loomex-space-2); font-weight: 550; }
    .setup-fields { display: grid; gap: var(--loomex-space-4); }
    .setup-field { display: grid; gap: var(--loomex-space-2); }
    .setup-field > label { font-weight: 650; }
    .setup-field .workspace-path { padding: var(--loomex-space-2) 0; }
    .workspace-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--loomex-space-2); align-items: center; }
    .field-error { margin: 2px 0 0; color: var(--color-brand-pink); font-size: 12px; font-weight: 650; }
    .required-mark { color: var(--color-brand-pink); }
    .control-stack { display: grid; gap: var(--loomex-space-3); }
    .rating-options { display: flex; flex-wrap: wrap; gap: var(--loomex-space-2); }
    .rating-choice { position: relative; }
    .rating-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .rating-choice span { display: grid; place-items: center; min-width: var(--loomex-control-height); min-height: var(--loomex-control-height); border: 1px solid var(--color-line); border-radius: 0.5rem; background: color-mix(in srgb, var(--color-white) 2%, transparent); cursor: pointer; font-weight: 650; }
    .rating-choice input:checked + span { color: var(--color-bg-dark); border-color: var(--color-brand-teal); background: var(--color-brand-teal); }
    .rating-choice input:focus-visible + span { outline: 2px solid var(--color-brand-teal); outline-offset: 3px; }
    button.ui-button { min-height: var(--loomex-control-height); }
    button.ui-button-icon { width: var(--loomex-control-height); height: var(--loomex-control-height); }
    button.action-with-label { width: auto; gap: var(--loomex-space-2); padding-inline: var(--loomex-space-3); }
    button.action-with-label svg { width: 1rem; height: 1rem; pointer-events: none; }
    button.icon-button { flex: none; }
    .icon-button svg { width: 1rem; height: 1rem; pointer-events: none; }
    button.info-button { color: var(--color-gray-400); border-color: transparent; }
    .tooltip { position: fixed; z-index: 10; max-width: min(300px, calc(100vw - 16px)); padding: 8px 10px; border: 1px solid var(--color-line); border-radius: 0.5rem; background: var(--color-sidebar-bg); color: var(--color-white); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; box-shadow: 0 3px 12px color-mix(in srgb, var(--color-black) 45%, transparent); }
    .inline-info { display: inline-flex; align-items: center; gap: var(--loomex-space-1); }
    .run-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--loomex-space-2); color: var(--color-gray-400); font-size: 13px; }
    .run-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; color: var(--color-white); }
    .run-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--color-gray-400); }
    .run-status[data-state="completed"]::before, .run-status[data-state="succeeded"]::before { background: var(--color-brand-teal); }
    .run-status[data-state="waiting"]::before, .run-status[data-state^="waiting_"]::before, .run-status[data-state="pending"]::before { background: var(--color-orange-400); }
    .run-status[data-state="failed"]::before { background: var(--color-brand-pink); }
    .run-status[data-state="running"]::before { background: var(--color-brand-violet); animation: breathe 1.8s ease-in-out infinite; }
    #summary:empty, #summary[data-suppressed="true"]:not(.error) { display: none; }
    .activity { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; color: var(--color-gray-400); }
    .activity::before, button[aria-busy="true"]::before { content: ''; flex: none; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    button[aria-busy="true"] svg { display: none; }
    .workflow-search { display: flex; align-items: center; gap: var(--loomex-space-2); }
    .workflow-search input { flex: 1; }
    .workflow-search-actions { flex-wrap: nowrap; }
    .ui-data-table-pagination { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--loomex-space-2); overflow-x: auto; }
    .ui-data-table-pagination-summary { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ui-data-table-pagination-actions { min-width: max-content; flex-wrap: nowrap; }
    .workflow-page-size { width: auto; max-width: 100%; min-width: 8.25rem; min-height: var(--loomex-control-height); }
    .workflow-loading-host { position: relative; isolation: isolate; }
    .workflow-loading-host > :not(.workflow-skeleton, .workflow-loading-status) { visibility: hidden; }
    .workflow-loading-status { position: absolute; inset: 0 auto auto 0; z-index: 2; min-height: var(--loomex-control-height); background: var(--color-bg-dark); }
    .workflow-loading-status:focus { outline: 2px solid var(--color-brand-teal); outline-offset: 3px; }
    .workflow-skeleton { position: absolute; inset: 0; z-index: 1; display: grid; align-content: start; gap: var(--loomex-space-2); min-height: 100%; padding: calc(var(--loomex-control-height) + var(--loomex-space-2)) 0 0; background: var(--color-bg-dark); pointer-events: none; }
    .skeleton-line, .skeleton-row { border-radius: 0.5rem; background: color-mix(in srgb, var(--color-white) 5%, transparent); }
    .skeleton-line { width: min(62%, 320px); height: var(--loomex-control-height); }
    .skeleton-row { min-height: 68px; border: 1px solid var(--color-line); }
    @media (prefers-reduced-motion: no-preference) { .skeleton-line, .skeleton-row { animation: skeleton-pulse 1.4s ease-in-out infinite; } }
    .workflow-row-copy > .ui-caption { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { opacity: .35; } }
    @keyframes skeleton-pulse { 50% { opacity: .55; } }
    @media (max-width: 520px) {
      .ui-grid { grid-template-columns: 1fr; }
      .workflow-detail-item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .workflow-row { align-items: start; }
      .workflow-detail-heading { flex-wrap: wrap; }
      .workflow-detail-heading .ui-hero { width: 100%; }
      .workflow-detail-heading-actions { width: 100%; justify-content: flex-end; }
      .header-stage, .header-status { max-width: 100%; }
    }
    @media (pointer: coarse) { :root { --loomex-control-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    main { position: relative; }
    #restore-loading { display: none; }
    main[data-restoring="true"] { min-height: 240px; }
    main[data-restoring="true"] #restore-loading { display: grid; gap: var(--loomex-space-3); position: absolute; inset: 58px 16px auto; }
    main[data-restoring="true"] .app-body, main[data-restoring="true"] .app-footer { visibility: hidden; pointer-events: none; }
    main[data-restoring="true"] .header-tools { visibility: hidden; }
  </style>
</head>
<body data-mode="__LOOMEX_MODE__" data-theme-app="workspace" data-theme-mode="dark" data-theme-name="neutral">
<main data-restoring="true" aria-busy="true">
  <section id="restore-loading" role="status" aria-live="polite" aria-label="Restoring saved view">
    <span class="sr-only">Restoring saved view…</span>
    <div class="skeleton-line" aria-hidden="true"></div>
    <div class="skeleton-row" aria-hidden="true"></div>
    <div class="skeleton-row" aria-hidden="true"></div>
  </section>
  <header class="app-header">
    <div class="header-identity">
      <h1 id="title">Workflow</h1>
      <span id="header-stage" class="ui-badge header-stage" aria-label="Current stage" hidden></span>
      <span id="header-status" class="ui-badge header-status" aria-label="Current status" hidden></span>
    </div>
    <div class="header-tools">
      <span id="run-clock" class="run-clock" hidden></span>
      <span id="connection" class="sr-only">Connecting…</span>
      <button id="refresh" class="ui-button ui-button-sm btn-secondary" type="button" disabled>Refresh</button>
    </div>
  </header>
  <section class="app-body" aria-label="Loomex workspace">
    <p id="activity" class="activity" role="status" hidden></p>
    <p id="summary" class="notice glass-panel" role="status" aria-live="polite">Loading this view…</p>
    <p id="support-reference" class="hint" hidden></p>
    <p id="save-status" class="hint" role="status" aria-live="polite" hidden></p>
    <button id="use-saved-version" class="secondary" type="button" hidden>Use saved version</button>
    <section id="error-details" class="ui-stack" aria-label="Action details" hidden></section>
    <section id="context" aria-label="Review details" hidden></section>
    <section id="form" class="field" hidden></section>
  </section>
  <footer class="app-footer">
    <div class="actions">
      <button id="secondary" class="ui-button ui-button-icon btn-secondary" type="button" hidden disabled></button>
      <button id="primary" type="button" hidden disabled></button>
    </div>
  </footer>
</main>
<script>
__LOOMEX_PERSISTENCE__
</script>
<script>
(() => {
  "use strict";
  const formatFollowContinuationMarkdown = __LOOMEX_FOLLOW_FORMATTER__;
  const formatFollowContinuationContext = __LOOMEX_FOLLOW_CONTEXT_FORMATTER__;
  let mode = document.body.dataset.mode;
  let viewRestoring = true;
  const connection = document.getElementById("connection");
  const summary = document.getElementById("summary");
  const context = document.getElementById("context");
  const errorDetails = document.getElementById("error-details");
  const supportReference = document.getElementById("support-reference");
  const saveStatus = document.getElementById("save-status");
  const useSavedVersion = document.getElementById("use-saved-version");
  const form = document.getElementById("form");
  const refresh = document.getElementById("refresh");
  const primary = document.getElementById("primary");
  const secondary = document.getElementById("secondary");
  const title = document.getElementById("title");
  const headerStage = document.getElementById("header-stage");
  const headerStatus = document.getElementById("header-status");

  const pending = new Map();
  const mutationKeys = new Map();
  const mutationOperations = new Map();
  let nextId = 1;
  let connected = false;
  let latest = null;
  let latestMethod = "";
  let latestToolName = "";
  let latestAnswerChannel = "";
  let renderCount = 0;
  let authoritativeStateStale = false;
  let preparationPresentation = null;
  let runFlow = null;
  let hostCapabilities = {};
  let chatHandoff = null;
  let taskWorkspace = null;
  let viewPersistenceUnavailable = false;
  let viewHydrationEpoch = 0;
  let hydratedSessionId = "";
  let restoredOperationId = "";
  let hydratedReadySessionId = "";
  let backendDraft = null;
  let backendDraftTimer = null;
  let backendDraftBusy = false;
  let backendDraftDirty = false;
  let backendDraftAttempt = null;
  let backendDraftPromise = null;
  let backendDraftChangeVersion = 0;
  // Draft RPCs can outlive a notification that replaces this card. Keep their
  // local state bound to the exact saved presentation, request, and schema so
  // a late completion cannot become state for the next card.
  let backendDraftScope = null;
  let lastRadioNavigationKey = null;
  let persistenceConflict = false;
  let reopenedInteraction = null;
  // Connection is intentionally an ephemeral projection. It has no durable
  // presentation session because an organization must never be inferred or
  // scoped before the runner has authenticated the owner.
  const isConnectionView = ["connection", "organizations"].includes(mode);
  const connectionState = { page: mode === "organizations" ? "organizations" : "connection", candidate: "", query: "", pageIndex: 0, busy: false, pending: null, projection: null, list: [], listState: "idle", listGeneration: 0, viewSession: null, hydrated: false, saveChain: Promise.resolve(), action: null, secondaryAction: null, fallbackUrl: "", structure: "" };
  let connectionGeneration = 0;
  let connectionPollTimer = null;
  let connectionPollFlowId = "";
  // Organization names are a separately refreshable remote read.  The
  // connection projection stays local so that an unavailable organization
  // endpoint never changes the authentication state shown to the user.
  const refreshedInteractionViews = new Set();
  const followedViewSessions = new Set();
  const completedViewStatuses = new Set();
  const VIEW_SESSION_TOOLS = {
    create: "loomex_view_session_create",
    get: "loomex_view_session_get",

      flow.autoPreparation === "idle" && viewPersistence.session &&
      hydratedReadySessionId === viewPersistence.session.viewSessionId);
  }

  function scheduleAutomaticPreparation(flow = runFlow) {
    if (!connected || !autoPreparationEligible(flow)) return false;
    flow.autoPreparation = "scheduled";
    Promise.resolve().then(async () => {
      if (runFlow !== flow || flow.autoPreparation !== "scheduled" || flow.stage !== "setup") return;
      flow.autoPreparation = "started";
      try {
        await beginSetupReview({});
      } catch (error) {
        runFlowError(error?.message || "The review could not be prepared. Choose Review run to try again.", error);
        renderIntegratedRunFlow();
      }
    });
    return true;
  }

  function runFlowError(message, error = runFlow?.error) {
    if (runFlow) { runFlow.errorMessage = message; runFlow.error = error; }
    renderFailure({ error });
    summary.classList.add("error");
    summary.setAttribute("role", "alert");
    summary.textContent = message;
  }

  function setupFieldError(control, message) {
    control.setAttribute("aria-invalid", "true");
    const error = element("p", { className: "field-error", id: `${control.id}-error`, role: "alert" }, message);
    control.setAttribute("aria-describedby", error.id);
    control.parentElement.append(error);
  }

  function clearSetupErrors() {
    for (const error of form.querySelectorAll(".field-error")) error.remove();
    for (const control of form.querySelectorAll("[aria-invalid]")) {
      control.removeAttribute("aria-invalid");
      control.removeAttribute("aria-describedby");
    }
  }

  function collectRunSetupInputs() {
    clearSetupErrors();
    const inputs = {};
    let firstInvalid;
    for (const entry of runFlow.analysis.entries) {
      if (entry.workspace) continue;
      const control = form.querySelector(`[data-run-input="${CSS.escape(entry.key)}"]`);
      if (!control) continue;
      const empty = control.value === "";
      if (empty && entry.required) {
        setupFieldError(control, `Enter ${authoredLabel(entry.key, entry.field)}.`);
        firstInvalid ||= control;
        continue;
      }
      if (empty) continue;
      let value;
      if (entry.values) {
        const index = Number(control.value);
        value = entry.values[index];
      } else if (entry.type === "boolean") {
        value = control.value === "true";
      } else if (entry.type === "integer") {
        if (!/^-?\d+$/.test(control.value)) {
          setupFieldError(control, "Enter a whole number."); firstInvalid ||= control; continue;
        }
        value = Number(control.value);
        if (!Number.isSafeInteger(value)) {
          setupFieldError(control, "Enter a whole number within the supported range."); firstInvalid ||= control; continue;
        }
      } else if (entry.type === "number") {
        if (!/^-?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(control.value)) {
          setupFieldError(control, "Enter a valid number."); firstInvalid ||= control; continue;
        }
        value = Number(control.value);
        if (!Number.isFinite(value)) {
          setupFieldError(control, "Enter a finite number."); firstInvalid ||= control; continue;
        }
      } else value = control.value;
      if (typeof value === "string" && Number.isInteger(entry.field.minLength) && value.length < entry.field.minLength) {
        setupFieldError(control, `Enter at least ${entry.field.minLength} characters.`); firstInvalid ||= control; continue;
      }
      if (typeof value === "string" && Number.isInteger(entry.field.maxLength) && value.length > entry.field.maxLength) {
        setupFieldError(control, `Enter no more than ${entry.field.maxLength} characters.`); firstInvalid ||= control; continue;
      }
      if (typeof value === "number" && typeof entry.field.minimum === "number" && value < entry.field.minimum) {
        setupFieldError(control, `Enter a value of at least ${entry.field.minimum}.`); firstInvalid ||= control; continue;
      }
      if (typeof value === "number" && typeof entry.field.maximum === "number" && value > entry.field.maximum) {
        setupFieldError(control, `Enter a value no greater than ${entry.field.maximum}.`); firstInvalid ||= control; continue;
      }
      inputs[entry.key] = value;
    }
    const workspace = form.querySelector("#run-workspace");
    if (!workspace || !workspace.value.trim()) {
      if (workspace) setupFieldError(workspace, "Choose an absolute workspace directory.");
      firstInvalid ||= workspace;
    } else if (!workspace.value.trim().startsWith("/")) {
      setupFieldError(workspace, "Enter an absolute workspace path."); firstInvalid ||= workspace;
    }
    if (firstInvalid) {
      firstInvalid.focus();
      throw new Error("Complete the required inputs before continuing.");
    }
    runFlow.inputDraft = inputs;
    runFlow.workspaceDraft = workspace.value.trim();
    return inputs;
  }

  function createSetupControl(entry) {
    const id = `run-input-${entry.key.replace(/[^a-z0-9_-]/gi, "-")}`;
    const labelText = authoredLabel(entry.key, entry.field);
    const wrapper = element("div", { className: "setup-field" });
    const label = element("label", { htmlFor: id }, labelText);
    if (entry.required) label.append(element("span", { className: "required-mark", "aria-hidden": "true" }, " *"));
    let control;
    if (entry.values) {
      control = element("select", { id, dataset: { runInput: entry.key }, disabled: runFlow.busy || runFlow.operations.size > 0 });
      control.append(element("option", { value: "" }, `Choose ${labelText}`));
      entry.values.forEach((value, index) => control.append(element("option", { value: String(index) }, String(value))));
      const selected = entry.values.findIndex((value) => Object.is(value, runFlow.inputDraft[entry.key]));
      control.value = selected >= 0 ? String(selected) : "";
    } else if (entry.type === "boolean") {
      control = element("select", { id, dataset: { runInput: entry.key }, disabled: runFlow.busy || runFlow.operations.size > 0 });
      control.append(element("option", { value: "" }, `Choose ${labelText}`), element("option", { value: "true" }, "Yes"), element("option", { value: "false" }, "No"));
      control.value = typeof runFlow.inputDraft[entry.key] === "boolean" ? String(runFlow.inputDraft[entry.key]) : "";
    } else {
      control = element("input", { id, type: entry.type === "string" ? "text" : "text", inputMode: entry.type === "integer" ? "numeric" : entry.type === "number" ? "decimal" : undefined,
        value: runFlow.inputDraft[entry.key] ?? "", dataset: { runInput: entry.key }, autocomplete: "off", disabled: runFlow.busy || runFlow.operations.size > 0 });
    }
    control.addEventListener("input", () => { runFlow.inputDraft[entry.key] = control.value; });
    wrapper.append(label, control);
    const description = safeText(entry.field.description, 500);
    if (description) wrapper.append(element("p", { className: "hint" }, description));
    return wrapper;
  }

  function renderRunSetup() {
    const data = runFlow.setup;
    const selected = runFlow.selected;
    context.hidden = false; context.className = "ui-stack"; context.replaceChildren();
    const autoPending = runFlow.autoPreparation === "scheduled" ||
      (runFlow.autoPreparation === "started" && (runFlow.busy ||
        (Object.hasOwn(runFlow, "pendingSetupInputs") && runFlow.operations.size === 0)));
    context.setAttribute("aria-label", "Run setup"); context.setAttribute("aria-busy", String(runFlow.busy || autoPending));
    form.hidden = false; form.className = "setup-fields"; form.replaceChildren();
    errorDetails.hidden = true; errorDetails.replaceChildren();
    refresh.hidden = true; secondary.hidden = !runFlow.returnToBrowser;
    if (runFlow.returnToBrowser) { setAction(secondary, "Back to workflows"); secondary.disabled = runFlow.busy; }
    const hero = element("div", { className: "ui-hero" });
    hero.append(element("h2", {}, safeText(data?.workflow?.name) || "Set up run"));
    const version = workflowVersionNumber(selected?.version);
    hero.append(element("p", { className: "ui-meta" }, Number.isInteger(version) ? `Version ${version}` : "Pinned version"));
    context.append(hero);
    if (!runFlow.analysis.supported) {
      context.append(element("div", { className: "ui-callout" }, runFlow.analysis.reason));
      form.hidden = true;
      primary.hidden = false; setAction(primary, "Continue in conversation"); primary.disabled = !connected || runFlow.busy;
      summary.textContent = "This workflow’s inputs need to be collected in the conversation.";
      return;
    }
    if (autoPreparationEligible() || autoPending) {
      form.hidden = true;
      primary.hidden = true;
      context.append(element("p", { className: "activity", role: "status", "aria-live": "polite" }, "Preparing your review…"));
      summary.classList.remove("error"); summary.setAttribute("role", "status");
      if (!runFlow.errorMessage) summary.textContent = "";
      scheduleAutomaticPreparation();
      if (runFlow.errorMessage) runFlowError(runFlow.errorMessage);
      return;
    }
    for (const entry of runFlow.analysis.entries) if (!entry.workspace) form.append(createSetupControl(entry));
    const workspaceField = element("div", { className: "setup-field" });
    const mappedWorkspaceSchema = runFlow.analysis.workspaceInputField && runFlow.analysis.schema.properties[runFlow.analysis.workspaceInputField];
    const workspaceLabel = mappedWorkspaceSchema ? authoredLabel(runFlow.analysis.workspaceInputField, mappedWorkspaceSchema) : "Workspace directory";
    workspaceField.append(element("label", { htmlFor: "run-workspace" }, `${workspaceLabel} *`));
    const workspaceControls = element("div", { className: "workspace-control" });
    const workspace = element("input", { id: "run-workspace", type: "text", value: runFlow.canonicalWorkspace || runFlow.workspaceDraft, autocomplete: "off",
      readOnly: !runFlow.workspaceEditing, disabled: runFlow.busy || runFlow.operations.size > 0 });
    workspace.addEventListener("input", () => {
      runFlow.workspaceDraft = workspace.value;
      runFlow.workspaceSource = "manual";
      taskWorkspace = taskWorkspaceFrom({
        ...(taskWorkspace?.taskContext ? { taskContext: taskWorkspace.taskContext } : {}),
        workspacePath: workspace.value,
      });
      if (runFlow.canonicalWorkspace && workspace.value !== runFlow.canonicalWorkspace) runFlow.canonicalWorkspace = "";
    });
    workspaceControls.append(workspace);
    if (!runFlow.workspaceEditing) {
      const change = element("button", { type: "button", className: "secondary", disabled: runFlow.busy || runFlow.operations.size > 0 }, "Change workspace");
      change.addEventListener("click", () => {
        runFlow.workspaceEditing = true;
        renderIntegratedRunFlow();
        form.querySelector("#run-workspace")?.focus();
      });
      workspaceControls.append(change);
    }
    workspaceField.append(workspaceControls);
    if (runFlow.canonicalWorkspace) workspaceField.append(element("p", { className: "workspace-path" }, `Selected directory: ${runFlow.canonicalWorkspace}`));
    else if (runFlow.workspaceSource === "task") workspaceField.append(element("p", { className: "hint" }, "Suggested from this local Codex task. Change it if this run belongs elsewhere."));
    else if (runFlow.workspaceSource === "override") workspaceField.append(element("p", { className: "hint" }, "Selected for this run. Change it if needed."));
    else workspaceField.append(element("p", { className: "hint" }, safeText(mappedWorkspaceSchema?.description, 500) || "Choose the directory where this workflow may run."));
    form.append(workspaceField);
    primary.hidden = false;
    const operation = runFlow.operations.values().next().value;
    setMutationAction(primary, operation ? `Retry exact ${operation.label}` : "Review run");
    primary.disabled = !connected || runFlow.busy;
    summary.classList.remove("error"); summary.setAttribute("role", "status");
    if (!operation && !runFlow.errorMessage) summary.textContent = "";
    if (runFlow.errorMessage) runFlowError(runFlow.errorMessage);
  }

  function renderRunReview() {
    form.hidden = true; form.replaceChildren(); refresh.hidden = false; setAction(refresh, "Check runner");
    secondary.hidden = !runFlow.setup; setAction(secondary, "Edit setup"); secondary.disabled = runFlow.busy || runFlow.operations.size > 0;
    preparationView(runFlow.prepared);
    const review = context.firstElementChild;
    context.setAttribute("aria-busy", String(runFlow.busy));
    primary.hidden = false;
    const operation = runFlow.operations.values().next().value;
    setMutationAction(primary, runFlow.preparationStale
      ? operation ? "Retry exact preparation" : "Review again"
      : operation ? "Retry exact start" : "Start run");
    primary.disabled = !connected || runFlow.busy || (runFlow.preparationStale ? !reprepareArguments() : !preparationReviewable(runFlow.prepared));
    if (!operation && !runFlow.errorMessage) {
      summary.classList.remove("error"); summary.setAttribute("role", "status");
      summary.textContent = runFlow.preparationStale
        ? "This preparation is no longer current. Review a fresh preparation before starting."
        : "";
    }
    if (runFlow.errorMessage) runFlowError(runFlow.errorMessage);
  }

  function initializePreparedRunReview(data) {
    const binding = data?.binding && typeof data.binding === "object" ? data.binding : {};
    runFlow = {
      stage: "review",
      prepared: immutableCopy(data),
      selected: {
        workflowId: safeText(binding.workflowId, 64),
        versionId: safeText(binding.versionId, 64),
        organizationId: safeText(binding.organizationId, 64),
      },
      canonicalWorkspace: safeText(binding.workspacePath, 4096),
      installationId: safeText(binding.installationId, 64),
      operations: new Map(),
      busy: false,
      returnToBrowser: false,
    };
  }

  function reprepareArguments() {
    const binding = runFlow?.prepared?.binding;
    const selected = runFlow?.selected;
    if (!binding || !selected?.workflowId || !selected?.versionId || !selected?.organizationId ||
      binding.workflowId !== selected.workflowId || binding.versionId !== selected.versionId ||
      binding.organizationId !== selected.organizationId || binding.installationId !== runFlow.installationId ||
      binding.workspacePath !== runFlow.canonicalWorkspace || binding.executionPolicy !== "host_user/v1" ||
      !binding.inputs || typeof binding.inputs !== "object" || Array.isArray(binding.inputs) ||
      !runFlow.canonicalWorkspace?.startsWith("/")) return undefined;
    return {
      workflowId: selected.workflowId,
      versionId: selected.versionId,
      ...(Object.keys(binding.inputs).length ? { inputs: immutableCopy(binding.inputs) } : {}),
      workspacePath: runFlow.canonicalWorkspace,
    };
  }

  function stalePreparationError(code) {
    return ["EXECUTION_BINDING_CONFLICT", "PRECONDITION_FAILED", "PREPARATION_NOT_FOUND"].includes(code);
  }

  function runHumanRequest(data = runFlow?.result) {
    if (runFlow?.baselineRequired) return undefined;
    const request = humanRequest(data);
    const runId = executionId(data);
    const organizationIds = [runFlow?.organizationId, data?.execution?.organizationId, request?.organizationId, request?.execution?.organizationId]
      .filter((value) => typeof value === "string" && value.length > 0);
    const organizationVerified = organizationIds.length > 0 && organizationIds.every(workflowIdValid) && new Set(organizationIds).size === 1;
    if (!request || !runId || request?.execution?.id !== runId || !organizationVerified || humanRequestResolved(request) || runFlow?.resolvedRequestIds?.has(request.id)) return undefined;
    return String(request.status || "").toLowerCase() === "pending" ? request : undefined;
  }

  function initializeRunMonitor(data, previous = runFlow, { acceptedCommit = false } = {}) {
    const runId = executionId(data);
    if (!runId) throw new Error("The runner did not return a verifiable run identity.");
    const organizationId = safeText(previous?.selected?.organizationId, 64) || safeText(previous?.organizationId, 64) || safeText(data?.execution?.organizationId, 64);
    const candidate = {
      ...(previous || {}),
      stage: "monitor",
      result: data,
      organizationId,
      operations: previous?.operations || new Map(),
      humanDrafts: previous?.humanDrafts || new Map(),
      resolvedRequestIds: previous?.resolvedRequestIds || new Set(),
      acceptedRequest: previous?.acceptedRequest,
      currentRequestId: previous?.currentRequestId,
      humanMode: undefined,
      busy: false,
      readEpoch: previous?.readEpoch || 0,
      baselineRequired: Boolean(acceptedCommit),
      returnToBrowser: Boolean(previous?.returnToBrowser),
    };
    runFlow = candidate;
    try {
      acceptRunSnapshot(data, runId, { initial: true });
    } catch (error) {
      if (!acceptedCommit) {
        runFlow = previous || { ...candidate, result: { execution: data.execution }, currentRequestId: undefined };
        throw error;
      }
      const safeResult = { ...data };
      delete safeResult.humanRequest;
      runFlow = {
        ...candidate,
        result: safeResult,
        currentRequestId: undefined,
        errorMessage: "The run started, but its human request could not be verified. Refresh run to load the current authoritative state.",
      };
      latest = safeResult;
    }
  }

  function runSequence(data) {
    return Number.isSafeInteger(data?.latestSequence) && data.latestSequence >= 0 ? data.latestSequence : undefined;
  }

  function retainedInteractionOperation() {
    return [...(runFlow?.operations?.values() || [])].find((operation) =>
      ["loomex_interaction_respond", "loomex_interaction_decide"].includes(operation.name));
  }

  function consumeResolvedRunRequest(requestId) {
    if (!requestId) return;
    runFlow.resolvedRequestIds.add(requestId);
    runFlow.humanDrafts.delete(requestId);
    const operation = retainedInteractionOperation();
    if (operation?.arguments?.requestId === requestId) {
      runFlow.operations.delete(operation.slot);
      void settleMutationOperation(operation, "completed", { structuredContent: { ok: true, data: { requestId } } })
        .then(() => transitionSessionAfterSuccess(operation)).catch(() => {});
    }
    if (runFlow.currentRequestId === requestId) runFlow.humanMode = undefined;
    if (backendDraft?.requestId === requestId) {
      const draft = backendDraft;
      detachInteractionDraft();
      void persistenceTool("loomex_interaction_draft_delete", {
        requestId,
        expectedRevision: draft.revision,
        ...(typeof draft.schemaDigest === "string" ? { expectedSchemaDigest: draft.schemaDigest } : {}),
        idempotencyKey: uuid(),
      }).catch(() => {});
    }
  }

  function acceptRunSnapshot(data, expectedRunId, { initial = false } = {}) {
    if (!data || executionId(data) !== expectedRunId) throw new Error("The runner returned status for a different run.");
    const previousData = runFlow.result;
    const execution = data.execution || {};
    const previousSequence = runSequence(previousData);
    const incomingSequence = runSequence(data);
    if (!initial && previousSequence !== undefined && incomingSequence !== undefined && incomingSequence < previousSequence) {
      throw new Error("The runner returned an older run snapshot.");
    }
    if (!initial && terminalRun(previousData?.execution || {}) && !terminalRun(execution)) {
      throw new Error("The runner returned a non-terminal state for a completed run.");
    }
    const incomingOrganization = safeText(execution.organizationId, 64);
    let candidateOrganization = runFlow.organizationId;
    let candidateCurrentRequestId = runFlow.currentRequestId;
    const consumedRequestIds = new Set();
    if (candidateOrganization && incomingOrganization && incomingOrganization !== candidateOrganization) {
      throw new Error("The runner returned status for a different organization.");
    }
    if (!candidateOrganization && incomingOrganization) candidateOrganization = incomingOrganization;
    const request = humanRequest(data);
    if (request) {
      const requestId = safeText(request.id, 64);
      if (!requestId || request?.execution?.id !== expectedRunId) {
        throw new Error("The runner returned a human request that is not bound to this run.");
      }
      const requestOrganization = safeText(request?.organizationId, 64);
      const requestExecutionOrganization = safeText(request?.execution?.organizationId, 64);
      if (requestOrganization && requestExecutionOrganization && requestOrganization !== requestExecutionOrganization) {
        throw new Error("The runner returned conflicting organization identities for the human request.");
      }
      const suppliedRequestOrganization = requestOrganization || requestExecutionOrganization;
      if (candidateOrganization && suppliedRequestOrganization && suppliedRequestOrganization !== candidateOrganization) {
        throw new Error("The runner returned a human request for a different organization.");
      }
      if (!candidateOrganization && suppliedRequestOrganization) candidateOrganization = suppliedRequestOrganization;
      const pendingOrganizationIds = [candidateOrganization, incomingOrganization, requestOrganization, requestExecutionOrganization]
        .filter((value) => typeof value === "string" && value.length > 0);
      if (!humanRequestResolved(request) && (pendingOrganizationIds.length === 0 ||
          pendingOrganizationIds.some((value) => !workflowIdValid(value)) || new Set(pendingOrganizationIds).size !== 1)) {
        throw new Error("The runner returned a pending human request without a verifiable organization identity.");
      }
      const current = humanRequest(runFlow.result);
      const currentPending = current && current.id === runFlow.currentRequestId &&
        !humanRequestResolved(current) && !runFlow.resolvedRequestIds.has(current.id);
      if (!initial && currentPending && requestId !== current.id) {
        const advanced = incomingSequence !== undefined && previousSequence !== undefined && incomingSequence > previousSequence;
        if (!advanced) throw new Error("The runner returned a different request before the current response was resolved.");
        consumedRequestIds.add(current.id);
      }
      if (runFlow.resolvedRequestIds.has(requestId) && !humanRequestResolved(request)) {
        throw new Error("The runner returned an already resolved request as pending.");
      }
      if (!humanRequestResolved(request)) candidateCurrentRequestId = requestId;
      if (!humanRequestResolved(request) && runFlow.acceptedRequest?.id !== requestId) runFlow.acceptedRequest = undefined;
    }
    const current = humanRequest(previousData);
    const currentPending = !initial && current && current.id === runFlow.currentRequestId &&
      !humanRequestResolved(current) && !runFlow.resolvedRequestIds.has(current.id);
    if (currentPending) {
      const sameResolved = request && request.id === current.id && humanRequestResolved(request);
      const advanced = incomingSequence !== undefined && previousSequence !== undefined && incomingSequence > previousSequence;
      const terminal = terminalRun(execution);
      if (!request && !advanced && !terminal) {
        throw new Error("The runner returned an older snapshot that cannot resolve the current request.");
      }
      if (sameResolved || !request || request.id !== current.id) consumedRequestIds.add(current.id);
    }
    if (terminalRun(execution) && request && !humanRequestResolved(request)) {
      throw new Error("The runner returned a pending request for a terminal run.");
    }
    runFlow.organizationId = candidateOrganization;
    for (const requestId of consumedRequestIds) consumeResolvedRunRequest(requestId);
    runFlow.currentRequestId = candidateCurrentRequestId;
    latest = data;
    runFlow.result = data;
    return data;
  }

  function captureRunHumanDraft() {
    const request = runHumanRequest();
    if (!request || form.hidden || runFlow?.humanMode === "cancel") return;
    const controls = {};
    for (const control of form.querySelectorAll("input, textarea, select")) {
      if (!control.id) continue;
      controls[control.id] = { value: control.value, checked: Boolean(control.checked) };
    }
    if (Object.keys(controls).length) runFlow.humanDrafts.set(request.id, controls);
  }

  function restoreRunHumanDraft(request) {
    const draft = runFlow?.humanDrafts?.get(request.id);
    if (!draft) return;
    for (const control of form.querySelectorAll("input, textarea, select")) {
      const saved = draft[control.id];
      if (!saved) continue;
      control.value = saved.value;
      if ("checked" in control) control.checked = saved.checked;
      control.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  function appendRunCancelAction(request) {
    const actions = element("div", { className: "actions" });
    const cancel = element("button", { type: "button", className: "secondary", disabled: !connected || runFlow.busy || runFlow.operations.size > 0 }, "Cancel run");
    cancel.addEventListener("click", () => {
      if (runFlow.busy || runFlow.operations.size > 0) return;
      captureRunHumanDraft();
      runFlow.humanMode = "cancel";
      renderIntegratedRunFlow();
    });
    actions.append(cancel);
    context.append(actions);
  }

  function chatContinuation(runId, event = {}) {
    const accepted = event.acceptedInteraction;
    if (event.trigger === "interaction_accepted" && (!workflowIdValid(accepted?.requestId) ||
      !["resolved", "completed", "answered", "approved", "rejected"].includes(accepted?.status))) {
      throw new Error("The accepted interaction could not be verified for chat continuation.");
    }
    const issued = event.followContinuation;
    const issuedRunId = safeText(issued?.runId, 128);
    const issuedReceipt = safeText(issued?.receipt, 2048);
    if (issued && (issuedRunId !== runId || !issuedReceipt || !/^[A-Za-z0-9_-]{16,2048}$/.test(issuedReceipt))) {
      throw new Error("The runner returned an invalid follow continuation receipt.");
    }
    return immutableCopy({
      schema: "loomex/chat-continuation/v2", intent: "monitor_existing_run", runId,
      trigger: event.trigger === "interaction_accepted" ? "interaction_accepted" : event.trigger === "run_started" ? "run_started" : "follow_requested",
      ...(event.trigger === "interaction_accepted" ? { acceptedInteraction: { requestId: accepted.requestId, status: accepted.status } } : {}),
      ...(issuedReceipt ? { followContinuation: { schemaVersion: "loomex.follow-session.continuation/v1", source: "generated_markdown", runId, receipt: issuedReceipt } } : {}),
      state: "requires_fresh_read",
    });
  }

  // Keep the manual copy and acknowledged host message byte-for-byte aligned.
  // The first line is intentionally a bare command so the host can route it;
  // the remainder is compact Markdown and contains only the facts needed to
  // resume this exact run.
  function formatChatContinuationMarkdown(runId, continuation = {}) {
    const receipt = continuation.followContinuation?.receipt;
    if (!receipt) return `To continue monitoring this exact Loomex run, submit \`$loomex-follow ${runId}\`.`;
    return formatFollowContinuationMarkdown(runId, receipt);
  }

  function chatCapability(name) {
    return Boolean(hostCapabilities && hostCapabilities[name] && hostCapabilities[name].text);
  }

  function renderSubmittedInteraction(request) {
    form.hidden = true;
    form.replaceChildren();
    primary.hidden = true;
    secondary.hidden = true;
    context.className = "ui-stack";
    context.replaceChildren();
    if (humanRequestResolved(request)) context.append(submittedAnswerReview(request));
    context.hidden = false;
    summary.classList.remove("error");
    summary.setAttribute("role", "status");
    summary.textContent = "Response received. This request is complete.";
    refresh.hidden = false;
    refresh.disabled = !connected;
  }

  function renderChatHandoffState() {
    if (!chatHandoff) return;
    form.hidden = true;
    form.replaceChildren();
    primary.hidden = true;
    secondary.hidden = true;
    // Once the handoff was delivered, the accepted response is the complete
    // card state. Do not leave a second successful-handoff card beside it.
    if (!runFlow && ["sending", "sent"].includes(chatHandoff.status)) {
      renderSubmittedInteraction(humanRequest(latest || {}));
      return;
    }
    context.querySelectorAll('[aria-label="Chat handoff"]').forEach((item) => item.remove());
    const callout = element("section", { className: "ui-callout", "aria-label": "Chat handoff", role: chatHandoff.status === "failed" ? "alert" : "status" });
    const statusCopy = chatHandoff.status === "sent"
      ? "Continue there for updates."
      : chatHandoff.status === "sending"
        ? "Sending this run to chat…"
        : chatHandoff.status === "manual"
          ? "This host cannot send the run to chat automatically. Use the read-only command below in chat."
          : "The run was accepted, but the chat handoff did not complete. The run or response will not be submitted again.";
    callout.append(element("h3", {}, chatHandoff.status === "sent" ? "Sent to chat" : "Continue in chat"));
    callout.append(element("p", {}, statusCopy));
    if (["manual", "failed"].includes(chatHandoff.status)) {
      const instructions = element("details", { className: "ui-disclosure", open: true });
      instructions.append(element("summary", {}, "Manual monitoring instructions"));
      const command = element("p", { className: "workspace-path" }, formatChatContinuationMarkdown(chatHandoff.runId, chatHandoff.continuation));
      command.setAttribute("aria-label", "Read-only resume command");
      instructions.append(command);
      callout.append(instructions);
    }
    if (!runFlow) {
      context.className = "ui-stack";
      // Keep a resolved response review visible after handoff. The handoff is
      // supplemental status, never a replacement for the accepted answer.
      if (context.hidden || !context.childElementCount) context.replaceChildren(callout);
      else context.append(callout);
      context.hidden = false;
    } else context.append(callout);
    summary.classList.remove("error");
    summary.setAttribute("role", "status");
    summary.textContent = "";
    refresh.hidden = !runFlow;
    refresh.disabled = !connected || ["sending", "failed"].includes(chatHandoff.status);
    if (chatHandoff.status === "failed") {
      primary.hidden = false;
      setAction(primary, "Retry chat handoff");
      primary.disabled = !connected;
    }
  }

  async function handoffRunToChat(runId, event = {}) {
    const safeRunId = workflowIdValid(runId) ? runId : undefined;
    if (!safeRunId) return;
    const continuation = chatContinuation(safeRunId, event);
    chatHandoff = { runId: safeRunId, status: "sending", continuation };
    if (runFlow) renderIntegratedRunFlow();
    else renderChatHandoffState();
    // Generated Markdown is accepted by the lifecycle hook only when the
    // runner issued an opaque receipt. Without one, keep the copyable manual
    // instruction in the card and do not send an activatable follow message.
    if (!continuation.followContinuation?.receipt) {
      chatHandoff.status = "manual";
      if (runFlow) renderIntegratedRunFlow(); else renderChatHandoffState();
      return;
    }
    if (!chatCapability("updateModelContext") || !chatCapability("message")) {
      chatHandoff.status = "manual";
      if (runFlow) renderIntegratedRunFlow(); else renderChatHandoffState();
      return;
    }
    const text = formatChatContinuationMarkdown(safeRunId, continuation);
    try {
      const contextResult = await send("ui/update-model-context", { content: [{ type: "text", text: formatFollowContinuationContext(continuation) }] });
      if (contextResult?.isError === true) throw new Error("The host rejected the model context update.");
      const messageResult = await send("ui/message", { role: "user", content: [{ type: "text", text }] });
      if (messageResult?.isError === true) throw new Error("The host rejected the chat message.");
      chatHandoff.status = "sent";
    } catch {
      chatHandoff.status = "failed";
    }
    if (runFlow) renderIntegratedRunFlow(); else renderChatHandoffState();
  }

  async function handoffAcceptedInteraction(authoritativeData, result) {
    if (result?.isError || result?.structuredContent?.ok === false) return;
    const requestRunId = safeText(humanRequest(authoritativeData)?.execution?.id, 128);
    const resultData = dataOf(result);
    const returnedRunId = safeText(resultData?.executionId, 128) || safeText(executionId(resultData), 128);
    if (requestRunId && returnedRunId && requestRunId !== returnedRunId) {
      setError(new Error("The response was accepted, but the returned run identity conflicts with the original request. Continue in chat from the original request before reading run state."));
      return;
    }
    const runId = returnedRunId || requestRunId;
    if (runId) await handoffRunToChat(runId, { trigger: "interaction_accepted", acceptedInteraction: {
      requestId: resultData.requestId, status: String(resultData.requestStatus).toLowerCase(),
    }, followContinuation: resultData.details?.followContinuation });
  }

  async function handoffLongQuestionToChat() {
    const request = draftRequest() || humanRequest(latest || {});
    const requestId = safeText(request?.id, 64);
    if (!workflowIdValid(requestId)) throw new Error("This question cannot be bound to a verified request.");
    const messageResult = await send("ui/message", {
      role: "user",
      content: [{
        type: "text",
        text: `$loomex-answer ${requestId}\nOpen this exact pending Loomex question in chat and collect my long-form answer there. Read the current request before presenting it. Do not answer it for me or reuse an earlier draft.`,
      }],
    });
    if (messageResult?.isError) throw new Error("The host could not send this question to the conversation.");
    summary.classList.remove("error");
    summary.setAttribute("role", "status");
    summary.textContent = "The question was sent to the conversation for your answer.";
  }

  function renderRunHumanRequest(request) {
    const requestId = interactionId({ humanRequest: request });
    const requestType = request.type;
    const schema = request.responseSchema || request.outputSchema;
    const operation = runFlow.operations.values().next().value;
    const responding = operation && ["loomex_interaction_respond", "loomex_interaction_decide"].includes(operation.name);
    if (runFlow.humanMode === "cancel") {
      renderRun(runFlow.result.execution || {});
      const cancelling = operation?.name === "loomex_run_cancel";
      typedForm({ properties: { reason: { type: "string" } } }, cancelling ? { reason: operation.arguments.reason } : {});
      if (cancelling) for (const control of form.querySelectorAll("input, textarea, select")) control.disabled = true;
      secondary.hidden = false; setAction(secondary, "Back to question"); secondary.disabled = runFlow.busy || runFlow.operations.size > 0;
      primary.hidden = false; primary.className = "danger"; setMutationAction(primary, operation ? "Retry exact cancellation" : "Cancel run");
      primary.disabled = !connected || runFlow.busy;
      summary.textContent = "Cancel this run separately from the workflow response.";
      return;
    }
    renderHumanPresentation(request, request.inputSpec);
    if (!humanPresentation(request)) renderRun(runFlow.result.execution || {});
    appendRunCancelAction(request);
    if (requestType === "approval" || runFlow.result.decisionRequired === true) {
      appendRequestCopy(request, request.inputSpec);
      form.hidden = false;
      primary.hidden = false;
      secondary.hidden = false;
      if (responding) {
        setMutationAction(primary, operation.arguments.decision === "reject" ? "Retry exact rejection" : "Retry exact approval");
        secondary.hidden = true;
      } else {
        setInteractionAction(primary, "approve", "Approve");
        setInteractionAction(secondary, "reject", "Reject");
      }
      primary.disabled = !connected || runFlow.busy || !requestId;
      secondary.disabled = !connected || runFlow.busy || !requestId;
    } else {
      const initial = responding ? operation.arguments.answer : request.answer;
      const formReady = typedForm(schema, initial, request.inputSpec, request);
      if (!responding) restoreRunHumanDraft(request);
      primary.hidden = false;
      const responseAction = responding ? "Retry exact response" : form.dataset.formKind === "chat-answer" ? "Continue in conversation" : answerActionLabel("Review");
      if (responding) setMutationAction(primary, responseAction); else setAction(primary, responseAction);
      primary.disabled = !connected || runFlow.busy || !requestId || (!formReady && form.dataset.formKind !== "chat-answer");
      secondary.hidden = true;
      if (!responding) hidePersistentBatchReview();
    }
    if (responding) {
      for (const control of form.querySelectorAll("input, textarea, select")) control.disabled = true;
    }
    if (requestType !== "approval" && runFlow.result.decisionRequired !== true && form.dataset.formKind !== "chat-answer" && !requestSchemaDigest(request)) {
      primary.disabled = true;
      summary.classList.add("error");
      summary.setAttribute("role", "alert");
      summary.textContent = "The current question schema could not be verified. Refresh this run before answering.";
    } else summary.textContent = "";
  }

  function renderRunStarted() {
    form.hidden = true; form.replaceChildren(); secondary.hidden = true; primary.hidden = true; primary.className = "";
    refresh.hidden = false; setAction(refresh, "Refresh run"); refresh.disabled = !connected || runFlow.busy;
    if (runFlow.baselineRequired) {
      renderRun(runFlow.result.execution || {});
      context.setAttribute("aria-busy", String(runFlow.busy));
      summary.classList.remove("error"); summary.setAttribute("role", "status");
      summary.textContent = "Run started. Send it to chat to continue monitoring.";
      if (runFlow.errorMessage) runFlowError(runFlow.errorMessage);
      return;
    }
    // Chat monitoring is dispatched separately. This card remains a stable,
    // read-only view of the selected run instead of becoming a second chat
    // control surface after the run starts, even if a later snapshot includes
    // a pending interaction.
    renderRun(runFlow.result.execution || {});
    if (runFlow.acceptedRequest) context.append(submittedAnswerReview(runFlow.acceptedRequest));
    context.setAttribute("aria-busy", String(runFlow.busy));
    summary.classList.remove("error"); summary.setAttribute("role", "status");
    const terminal = terminalRun(runFlow.result.execution || {});
    const waitingForResponse = Boolean(runHumanRequest());
    summary.textContent = terminal ? `${formatStatus(runFlow.result.execution.status)}. Review the result below.`
      : chatHandoff?.status === "sending"
        ? "Run started. Opening monitoring in chat…"
      : chatHandoff?.status === "sent"
        ? "Sent to chat."
      : ["manual", "failed"].includes(chatHandoff?.status)
        ? "Run started. The chat continuation could not be opened automatically."
      : waitingForResponse
        ? "This run needs a response in chat."
      : /waiting|queued|pending|paused/i.test(runFlow.result.execution.status || "")
        ? "This run is waiting. Its current summary is shown here."
        : "This run is active. Its current summary is shown here.";
    if (runFlow.errorMessage) runFlowError(runFlow.errorMessage);
  }

  function renderIntegratedRunFlow() {
    try { renderIntegratedRunFlowContent(); } finally { syncChrome(); }
  }

  function renderIntegratedRunFlowContent() {
    if (!runFlow) return;
    renderCount += 1;
    errorDetails.replaceChildren();
    errorDetails.hidden = true;
    if (!runFlow.errorMessage) runFlow.error = undefined;
    if (runFlow.stage === "setup") renderRunSetup();
    else if (runFlow.stage === "review") renderRunReview();
    else renderRunStarted();
  }

  function mutationFailureMessage(result, fallback) {
    const error = structuredError(result);
    return safeText(error?.message, 1000) || fallback;
  }

  function stopAutomaticPreparation(operation) {
    if (runFlow?.autoPreparation === "started" && ["loomex_workspace_grant", "loomex_run_prepare"].includes(operation?.name)) {
      runFlow.autoPreparation = "failed";
    }
  }

  async function ensureRunPreparationTarget(operation, result) {
    const preparationId = safeText(dataOf(result)?.preparationId, 64);
    if (!workflowIdValid(preparationId)) throw new Error("The preparation identity could not be verified.");
    if (!operation.targetSession) {
      if (!operation.targetCreateAttempt) operation.targetCreateAttempt = immutableCopy({
        kind: "prepare",
        entityType: "preparation",
        entityId: preparationId,
        state: { schemaVersion: 1, screen: "review", preparationId },
        idempotencyKey: uuid(),
      });
      operation.targetSession = await persistenceTool(VIEW_SESSION_TOOLS.create, immutableCopy(operation.targetCreateAttempt));
    }
    const target = operation.targetSession;
    if (target?.kind !== "prepare" || target?.entityType !== "preparation" || target?.entityId !== preparationId || !workflowIdValid(target.viewSessionId)) {
      throw new Error("The durable preparation view binding could not be verified.");
    }
    return target;
  }

  async function ensureRunMonitorTarget(operation, result) {
    const runId = safeText(executionId(dataOf(result)), 64);
    if (!workflowIdValid(runId)) throw new Error("The started run identity could not be verified.");
    const snapshot = await callTool("loomex_run_get", { runId }, false);
    if (snapshot?.isError || snapshot?.structuredContent?.ok === false || executionId(dataOf(snapshot)) !== runId) {
      throw new Error("The started run could not be verified before opening its monitor.");
    }
    if (!operation.targetSession) {
      if (!operation.targetCreateAttempt) operation.targetCreateAttempt = immutableCopy({
        kind: "monitor",
        entityType: "execution",
        entityId: runId,
        state: { schemaVersion: 1, screen: "monitor", executionId: runId },
        idempotencyKey: uuid(),
      });
      operation.targetSession = await persistenceTool(VIEW_SESSION_TOOLS.create, immutableCopy(operation.targetCreateAttempt));
    }
    if (operation.targetSession?.kind !== "monitor" || operation.targetSession?.entityType !== "execution" ||
        operation.targetSession?.entityId !== runId || !workflowIdValid(operation.targetSession.viewSessionId)) {
      throw new Error("The durable run monitor binding could not be verified.");
    }
    return snapshot;
  }

  async function runFlowMutation(name, slot, label, args, accept) {
    if (runFlow.busy) return;
    requireMutationHydrationReady();
    let afterAccepted;
    let operation = runFlow.operations.get(slot);
    if (!operation) {
      operation = { name, slot, label, arguments: immutableCopy({ ...args, idempotencyKey: uuid() }) };
      runFlow.operations.set(slot, operation);
    }
    if (operation.journalStatus === "completed" && operation.targetSession) {
      try {
        await transitionSessionAfterSuccess(operation);
        runFlow.operations.delete(slot);
        renderIntegratedRunFlow();
      } catch (error) { runFlowError(error?.message || "The next view link could not be completed.", error); }
      return;
    }
    runFlow.errorMessage = "";
    runFlow.error = undefined;
    runFlow.busy = true; renderIntegratedRunFlow();
    try {
      await journalMutationOperation(operation);
      const result = operation.successfulResult
        ? immutableCopy(operation.successfulResult)
        : await callTool(operation.name, immutableCopy(operation.arguments), false,
          !["loomex_run_prepare", "loomex_run_commit"].includes(operation.name));
      const observedTargetSession = viewSessionProjection(result);
      if (!["loomex_run_prepare", "loomex_run_commit"].includes(operation.name)) {
        operation.targetSession = observedTargetSession || operation.targetSession || null;
      }
      if (result?.isError || result?.structuredContent?.ok === false) {
        const code = errorCodeOf(result);
        const ambiguous = ["NETWORK_AMBIGUOUS", "IDEMPOTENCY_REQUEST_IN_PROGRESS"].includes(code);
        await settleMutationOperation(operation, ambiguous ? "ambiguous" : "completed", result);
        stopAutomaticPreparation(operation);
        if (!ambiguous) {
          runFlow.operations.delete(slot);
          if (operation.name === "loomex_run_prepare") delete runFlow.pendingSetupInputs;
        }
        if (!ambiguous && operation.name === "loomex_run_commit" && stalePreparationError(code)) {
          runFlow.preparationStale = true;
          runFlowError("The workflow or its execution settings changed after preparation. Review a new preparation before starting.", structuredError(result));
          return;
        }
        const retry = ambiguous
          ? " Retry sends the exact same request and operation ID."
          : code === "MODEL_CATALOG_UNAVAILABLE" && operation.name === "loomex_run_commit"
            ? " This reviewed preparation remains ready to start."
            : operation.name === "loomex_run_prepare" && runFlow.preparationStale
              ? " Review again to request another fresh preparation."
              : " Correct the setup or try again.";
        runFlowError(`${mutationFailureMessage(result, `The ${label} could not be completed.`)}${retry}`, structuredError(result));
        return;
      }
      if (operation.name === "loomex_run_prepare") {
        validateRunPreparationResult(result, operation.arguments);
        operation.targetSession = observedTargetSession || operation.targetSession || null;
        operation.successfulResult = operation.successfulResult || immutableCopy(result);
        await ensureRunPreparationTarget(operation, result);
      }
      let verifiedRunSnapshot;
      if (operation.name === "loomex_run_commit") {
        validateRunCommitResult(result, operation.arguments);
        operation.targetSession = observedTargetSession || operation.targetSession || null;
        operation.successfulResult = operation.successfulResult || immutableCopy(result);
        verifiedRunSnapshot = await ensureRunMonitorTarget(operation, result);
      }
      const afterSuccess = await accept(result, operation.arguments);
      if (typeof afterSuccess === "function") afterAccepted = afterSuccess;
      if (verifiedRunSnapshot) {
        acceptRunSnapshot(dataOf(verifiedRunSnapshot), executionId(runFlow?.result), { initial: true });
        runFlow.errorMessage = "";
        runFlow.error = undefined;
      }
      await settleMutationOperation(operation, "completed", result);
      await transitionSessionAfterSuccess(operation);
      runFlow.operations.delete(slot);
      authoritativeStateStale = false;
    } catch (error) {
      afterAccepted = undefined;
      authoritativeStateStale = false;
      stopAutomaticPreparation(operation);
      if (operation.operationId && !operation.journalStatus) {
        try { await settleMutationOperation(operation, "ambiguous", { isError: true, structuredContent: { ok: false, error: { code: "NETWORK_AMBIGUOUS" } } }); }
        catch { /* The pending journal remains the recovery source. */ }
      }
      runFlowError(`${error?.message || `The ${label} outcome is uncertain.`} Retry sends the exact same request and operation ID.`, undefined);
    } finally {
      runFlow.busy = false; renderIntegratedRunFlow();
    }
    if (afterAccepted) await afterAccepted();
  }

  async function beginRunSetup(id, detailData) {
    if (!workflowIdValid(id) || browserBusy || authoritativeStateStale) return;
    if (!await flushCurrentPersistence()) return;
    const returnViewSession = viewPersistence.session ? { ...viewPersistence.session, state: captureViewState() } : null;
    const returnViewSessionId = returnViewSession?.viewSessionId || "";
    browserBusy = true;
    showBrowserSkeleton("Loading run setup");
    try {
      const version = workflowVersionNumber(detailData?.selectedVersion) ?? detailData?.workflow?.activeVersion ?? detailData?.workflow?.latestVersion;
      const result = await callTool("loomex_run_setup", { workflowId: id, ...(Number.isInteger(version) && version > 0 ? { version: String(version) } : {}), ...taskWorkspaceArguments() }, false, false);
      if (result?.isError || result?.structuredContent?.ok === false) throw new Error("Run setup could not be loaded. Try again or continue in the conversation.");
      const data = dataOf(result);
      if (!selectedWorkflowVersion(data) || data.workflow.id !== id) throw new Error("The exact workflow version could not be verified for run setup.");
      if (returnViewSession) {
        const setupSession = viewSessionProjection(result);
        if (!setupSession) throw new Error("The durable run setup session could not be verified.");
        const forwardState = immutableCopy({
          ...returnViewSession.state,
          browser: {
            ...returnViewSession.state.browser,
            forwardViewSessionId: setupSession.viewSessionId,
            forwardWorkflowId: id,
            forwardVersion: Number.isInteger(version) ? version : null,
          },
        });
        const linked = await exactSessionUpdate({
          viewSessionId: returnViewSession.viewSessionId,
          expectedRevision: returnViewSession.revision,
          state: forwardState,
          status: "inactive",
          idempotencyKey: uuid(),
        });
        returnViewSession.revision = linked.revision;
      }
      initializeRunSetup(data, true, setupRequestIdentity(result));
      runFlow.returnViewSessionId = returnViewSessionId;
      observeViewPersistence(result);
    } catch (error) {
      if (returnViewSession && viewPersistence.session?.viewSessionId !== returnViewSession.viewSessionId) {
        try {
          const restored = await persistenceTool(VIEW_SESSION_TOOLS.get, { viewSessionId: returnViewSession.viewSessionId });
          observeViewPersistence({ _meta: { "loomex/viewSession": restored } });
        } catch { /* Keep the visible browser state and surface the original link failure. */ }
      }
      setError(error);
    }
    finally {
      browserBusy = false;
      clearBrowserSkeleton();
      runFlow ? renderIntegratedRunFlow() : renderBrowser();
      restoreBrowserFocus(Boolean(runFlow));
    }
  }

  async function returnToBrowserView() {
    const viewSessionId = runFlow?.returnViewSessionId;
    if (!workflowIdValid(viewSessionId)) {
      runFlow = null;
      browserSelected = null;
      browserDetailResponse = null;
      renderBrowser();
      return;
    }
    const projection = await persistenceTool(VIEW_SESSION_TOOLS.get, { viewSessionId });
    if (projection?.viewSessionId !== viewSessionId || projection.kind !== "browser" || projection.entityType !== "catalog" ||
        projection.entityId !== "00000000-0000-0000-0000-000000000000") {
      throw new Error("The durable workflow browser binding could not be verified.");
    }
    const savedBrowser = projection.state?.browser;
    if (!savedBrowser || typeof savedBrowser !== "object" || Array.isArray(savedBrowser)) {
      throw new Error("The saved workflow browser navigation could not be verified.");
    }
    const restoreArguments = (candidate) => {
      if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) {
        throw new Error("The saved workflow browser arguments could not be verified.");
      }
      if (candidate.limit !== undefined && (!Number.isInteger(candidate.limit) || candidate.limit < 0)) {
        throw new Error("The saved workflow browser page size could not be verified.");
      }
      for (const key of ["query", "cursor", "systemKey"]) {
        if (candidate[key] !== undefined && typeof candidate[key] !== "string") {
          throw new Error("The saved workflow browser arguments could not be verified.");
        }
      }
      return immutableCopy({
        limit: candidate.limit === undefined ? 20 : candidate.limit,
        ...(candidate.query !== undefined ? { query: candidate.query } : {}),
        ...(candidate.cursor !== undefined ? { cursor: candidate.cursor } : {}),
        ...(candidate.systemKey !== undefined ? { systemKey: candidate.systemKey } : {}),
      });
    };
    const restoredArguments = restoreArguments(savedBrowser.arguments);
    if (savedBrowser.history !== undefined && !Array.isArray(savedBrowser.history)) {
      throw new Error("The saved workflow browser history could not be verified.");
    }
    const restoredHistory = immutableCopy((savedBrowser.history || []).map(restoreArguments));
    const result = await callTool("loomex_workflows_list", restoredArguments, false, false);
    if (result?.isError || result?.structuredContent?.ok === false) throw new Error("The workflow browser could not be restored.");
    const page = workflowPageData(dataOf(result));
    if (!page) throw new Error("The restored workflow page could not be verified.");
    const restoredState = immutableCopy({
      ...projection.state,
      screen: "browser",
      browser: {
        ...savedBrowser,
        forwardViewSessionId: null,
        forwardWorkflowId: null,
        forwardVersion: null,
      },
    });
    const updated = await exactSessionUpdate({
      viewSessionId,
      expectedRevision: projection.revision,
      state: restoredState,
      status: "active",
      idempotencyKey: uuid(),
    });
    browserArgs = restoredArguments;
    browserHistory = restoredHistory;
    runFlow = null;
    browserPage = page;
    browserSelected = null;
    browserDetailResponse = null;
    observeViewPersistence({ _meta: { "loomex/viewSession": updated } });
    renderBrowser();
  }

  async function returnToRunSetup() {
    const setupViewSessionId = runFlow?.setupViewSessionId;
    const selected = runFlow?.selected;
    if (!workflowIdValid(setupViewSessionId) || !selected?.workflowId) throw new Error("The saved setup view could not be verified.");
    if (!await flushCurrentPersistence()) return;
    const result = await callTool("loomex_run_setup", {
      workflowId: selected.workflowId,
      ...((workflowVersionNumber(selected.version) || runFlow.editWorkflowVersion)
        ? { version: String(workflowVersionNumber(selected.version) || runFlow.editWorkflowVersion) }
        : {}),
      ...taskWorkspaceArguments(),
      viewSessionId: setupViewSessionId,
    }, false, false);
    const setup = dataOf(result);
    if (result?.isError || result?.structuredContent?.ok === false || !selectedWorkflowVersion(setup) || setup.workflow.id !== selected.workflowId) {
      throw new Error("The run setup could not be refreshed safely.");
    }
    const current = viewPersistence.session;
    if (current && current.viewSessionId !== setupViewSessionId) {
      const projection = await persistenceTool(VIEW_SESSION_TOOLS.get, { viewSessionId: current.viewSessionId });
      await exactSessionUpdate({
        viewSessionId: current.viewSessionId,
        expectedRevision: projection.revision,
        state: projection.state || captureViewState(),
        status: "inactive",
        idempotencyKey: uuid(),
      });
    }
    const setupProjection = await persistenceTool(VIEW_SESSION_TOOLS.get, { viewSessionId: setupViewSessionId });
    const setupState = { ...(setupProjection.state || {}) };
    delete setupState.forwardSession;
    const activeSetup = await exactSessionUpdate({
      viewSessionId: setupViewSessionId,
      expectedRevision: setupProjection.revision,
      state: setupState,
      status: "active",
      idempotencyKey: uuid(),
    });
