  function renderIntegratedRunFlowContent() {
    if (!runFlow) return;
    renderCount += 1;
    errorDetails.replaceChildren();
    errorDetails.hidden = true;
    if (!runFlow.errorMessage) runFlow.error = undefined;
    if (runFlow.stage === "setup") renderRunSetup();
    else if (runFlow.stage === "review") renderRunReview();
    else renderRunStarted();
  }

  function mutationFailureMessage(result, fallback) {
    const error = structuredError(result);
    return safeText(error?.message, 1000) || fallback;
  }

  async function runFlowMutation(name, slot, label, args, accept) {
    if (runFlow.busy) return;
    let operation = runFlow.operations.get(slot);
    if (!operation) {
      operation = { name, slot, label, arguments: immutableCopy({ ...args, idempotencyKey: uuid() }) };
      runFlow.operations.set(slot, operation);
    }
    runFlow.errorMessage = "";
    runFlow.error = undefined;
    runFlow.busy = true; renderIntegratedRunFlow();
    try {
      const result = await callTool(operation.name, immutableCopy(operation.arguments), false);
      if (result?.isError || result?.structuredContent?.ok === false) {
        const code = errorCodeOf(result);
        const ambiguous = ["NETWORK_AMBIGUOUS", "IDEMPOTENCY_REQUEST_IN_PROGRESS"].includes(code);
        if (!ambiguous) runFlow.operations.delete(slot);
        if (!ambiguous && operation.name === "loomex_run_commit" && stalePreparationError(code)) {
          runFlow.preparationStale = true;
          runFlowError("The workflow or its execution settings changed after preparation. Review a new preparation before starting.", structuredError(result));
          return;
        }
        const retry = ambiguous
          ? " Retry sends the exact same request and operation ID."
          : code === "MODEL_CATALOG_UNAVAILABLE" && operation.name === "loomex_run_commit"
            ? " This reviewed preparation remains ready to start."
            : operation.name === "loomex_run_prepare" && runFlow.preparationStale
              ? " Review again to request another fresh preparation."
              : " Correct the setup or try again.";
        runFlowError(`${mutationFailureMessage(result, `The ${label} could not be completed.`)}${retry}`, structuredError(result));
        return;
      }
      const afterSuccess = await accept(result, operation.arguments);
      runFlow.operations.delete(slot);
      authoritativeStateStale = false;
      if (typeof afterSuccess === "function") {
        try { afterSuccess(); } catch { /* A best-effort host notification cannot change the accepted mutation outcome. */ }
      }
    } catch (error) {
      authoritativeStateStale = false;
      runFlowError(`${error?.message || `The ${label} outcome is uncertain.`} Retry sends the exact same request and operation ID.`, undefined);
    } finally {
      runFlow.busy = false; renderIntegratedRunFlow();
    }
  }

  async function beginRunSetup(id, detailData) {
    if (!workflowIdValid(id) || browserBusy || authoritativeStateStale) return;
    browserBusy = true; renderBrowser();
    try {
      const version = workflowVersionNumber(detailData?.selectedVersion) ?? detailData?.workflow?.activeVersion ?? detailData?.workflow?.latestVersion;
      const result = await callTool("loomex_run_setup", { workflowId: id, ...(Number.isInteger(version) && version > 0 ? { version: String(version) } : {}) }, false);
      if (result?.isError || result?.structuredContent?.ok === false) throw new Error("Run setup could not be loaded. Try again or continue in the conversation.");
      const data = dataOf(result);
      if (!selectedWorkflowVersion(data) || data.workflow.id !== id) throw new Error("The exact workflow version could not be verified for run setup.");
      initializeRunSetup(data, true);
      summary.textContent = "Add your inputs and authorize the workspace.";
    } catch (error) { setError(error); }
    finally { browserBusy = false; runFlow ? renderIntegratedRunFlow() : renderBrowser(); }
  }

  async function continueUnsupportedSetup() {
    const selected = runFlow?.selected;
    const result = await send("ui/message", { role: "user", content: [{ type: "text", text:
      `Help me set up Loomex workflow ${selected?.workflowId || "the selected workflow"} at exact version ${workflowVersionNumber(selected?.version) || "selected by the setup result"}. Its input schema cannot be collected safely in the app. Collect every required input and one workspace, then call loomex_run_prepare. Do not commit or execute the run without showing its exact preparation for confirmation.` }] });
    if (result?.isError) throw new Error("The host could not open the setup request. Continue in the conversation and ask to set up this workflow.");
    summary.classList.remove("error"); summary.setAttribute("role", "status");
    summary.textContent = "Continue in the conversation to provide the unsupported inputs and review the exact preparation.";
  }

  async function handleRunFlowPrimary() {
    if (!runFlow || runFlow.busy) return;
    if (runFlow.stage === "setup") {
      if (!runFlow.analysis.supported) { await continueUnsupportedSetup(); return; }
      const retained = runFlow.operations.values().next().value;
      if (retained) {
        if (retained.name === "loomex_workspace_grant") {
          await runFlowMutation(retained.name, retained.slot, retained.label, {}, acceptWorkspaceGrant);
        } else await runFlowMutation(retained.name, retained.slot, retained.label, {}, acceptRunPreparation);
        return;
      }
      const inputs = collectRunSetupInputs();
      runFlow.errorMessage = "";
      if (!runFlow.canonicalWorkspace || runFlow.workspaceDraft !== runFlow.canonicalWorkspace) {
        await runFlowMutation("loomex_workspace_grant", `workspace:${runFlow.workspaceDraft}`, "workspace grant", {
          workspacePath: runFlow.workspaceDraft,
          organizationId: runFlow.selected.organizationId,
        }, acceptWorkspaceGrant);
        return;
      }
      const preparedInputs = { ...inputs };
      if (runFlow.analysis.workspaceInputField) preparedInputs[runFlow.analysis.workspaceInputField] = runFlow.canonicalWorkspace;
      await runFlowMutation("loomex_run_prepare", `prepare:${runFlow.selected.versionId}:${runFlow.canonicalWorkspace}`, "preparation", {
        workflowId: runFlow.selected.workflowId,
        versionId: runFlow.selected.versionId,
        ...(Object.keys(preparedInputs).length ? { inputs: preparedInputs } : {}),
        workspacePath: runFlow.canonicalWorkspace,
      }, acceptRunPreparation);
      return;
    }
    if (runFlow.stage === "review") {
      if (runFlow.preparationStale) {
        const args = reprepareArguments();
        if (!args) throw new Error("The sealed preparation cannot be refreshed safely. Return to setup and prepare the run again.");
        const retained = runFlow.operations.values().next().value;
        await runFlowMutation("loomex_run_prepare", retained?.slot || `reprepare:${runFlow.prepared.preparationId}`, "preparation", args, acceptRunPreparation);
        return;
      }
      const prepared = runFlow.prepared;
      if (!preparationReviewable(prepared)) throw new Error("Review the complete execution details in the conversation before starting.");
      const slot = `loomex_run_commit:${prepared.preparationId}`;
      await runFlowMutation("loomex_run_commit", slot, "start", {
        preparationId: prepared.preparationId,
        bindingDigest: prepared.bindingDigest,
        confirmationKey: prepared.confirmationKey,
      }, acceptRunCommit);
      if (runFlow.stage === "monitor" && runFlow.baselineRequired && !runFlow.operations.size) {
        await readRunSnapshot("loomex_run_get");
      }
      return;
    }
    if (runFlow.stage === "monitor") {
      const runId = executionId(runFlow.result);
      if (!runId || terminalRun(runFlow.result.execution || {})) throw new Error("This run is already complete.");
      if (runFlow.cancellationRequested) throw new Error("Cancellation has already been requested for this run.");
      const request = runHumanRequest();
      const retained = runFlow.operations.values().next().value;
      if (request && runFlow.humanMode !== "cancel") {
        const requestId = request.id;
        if (retained) {
          await runFlowMutation(retained.name, retained.slot, retained.label, {}, acceptHumanResolution);
        } else if (request.type === "approval" || runFlow.result.decisionRequired === true) {
          await runFlowMutation("loomex_interaction_decide", `interaction:approve:${requestId}`, "approval", {
            requestId, decision: "approve",
          }, acceptHumanResolution);
        } else {
          captureRunHumanDraft();
          await runFlowMutation("loomex_interaction_respond", `interaction:respond:${requestId}`, "response", {
            requestId, answer: collectAnswer(),
          }, acceptHumanResolution);
        }
        if (runFlow.resolvedRequestIds.has(requestId) && !runFlow.operations.size) {
          await readRunSnapshot("loomex_run_get");
        }
        return;
      }
      const slot = `run:cancel:${runId}`;
      if (runFlow.operations.has(slot)) {
        await runFlowMutation("loomex_run_cancel", slot, "cancellation", {}, acceptRunStatus);
        return;
      }
      const answer = collectAnswer();
      if (!answer.reason) throw new Error("Enter a cancellation reason.");
      await runFlowMutation("loomex_run_cancel", slot, "cancellation", { runId, reason: answer.reason }, acceptRunStatus);
    }
  }

  async function acceptWorkspaceGrant(result) {
    const data = dataOf(result);
    const canonical = safeText(data?.workspace?.path, 4096);
    const organizationId = safeText(data?.workspace?.organizationId, 64);
    const installationId = safeText(data?.workspace?.installationId, 64);
    if (!canonical || !canonical.startsWith("/") || organizationId !== runFlow.selected.organizationId || !workflowIdValid(installationId) || data.executionPolicy !== "host_user/v1") {
      throw new Error("The runner did not return a verified canonical workspace grant for this organization and installation.");
    }
    runFlow.canonicalWorkspace = canonical;
    runFlow.workspaceDraft = canonical;
    runFlow.installationId = installationId;
    if (runFlow.analysis.workspaceInputField) runFlow.inputDraft[runFlow.analysis.workspaceInputField] = canonical;
  }

  async function acceptRunPreparation(result, request) {
    const data = dataOf(result);
    const presentation = result?._meta?.["loomex/preparationReview"];
    const binding = data?.binding;
    const expectedInputs = request?.inputs || {};
    const retired = runFlow.preparationStale ? runFlow.prepared : undefined;
    const identityValid = workflowIdValid(data?.preparationId) && workflowIdValid(data?.confirmationKey) &&
      typeof data?.bindingDigest === "string" && /^[a-f0-9]{64}$/i.test(data.bindingDigest);
    const identityFresh = !retired || (data.preparationId !== retired.preparationId && data.confirmationKey !== retired.confirmationKey);
    const exact = identityValid && identityFresh && binding && binding.workflowId === runFlow.selected.workflowId && binding.versionId === runFlow.selected.versionId &&
      binding.organizationId === runFlow.selected.organizationId && binding.installationId === runFlow.installationId &&
      binding.workspacePath === runFlow.canonicalWorkspace && binding.executionPolicy === "host_user/v1" &&
      binding.inputs && exactJsonEqual(binding.inputs, expectedInputs) &&
      binding.providerConfiguration && typeof binding.providerConfiguration === "object";
    if (!exact || !presentationMatches(presentation, data)) throw new Error("The exact preparation review did not match the sealed setup. Continue in the conversation before starting.");
    preparationPresentation = presentation;
    latest = data;
    runFlow.prepared = immutableCopy(data);
    runFlow.preparationStale = false;
    runFlow.stage = "review";
  }

  async function acceptRunCommit(result, request) {
    const data = dataOf(result);
    const runId = executionId(data);
    if (!runId || data.preparationId !== request.preparationId || data.executionPolicy !== "host_user/v1") throw new Error("The runner did not return a run bound to the exact preparation and execution policy.");
    initializeRunMonitor(data, runFlow, { acceptedCommit: true });
    return () => send("ui/update-model-context", { content: [{ type: "text", text: `Loomex started run ${runId}. The app is showing its current authoritative status.` }] }, false);
  }

  async function acceptRunStatus(result, request) {
    const data = dataOf(result);
    if (executionId(data) !== request.runId) throw new Error("The runner did not return status for the requested run.");
    try {
      acceptRunSnapshot(data, request.runId);
    } catch (error) {
      runFlow.errorMessage = "The cancellation was accepted, but its returned run state could not be verified. Refresh run to load the current authoritative state.";
    }
    runFlow.humanMode = undefined;
    runFlow.cancellationRequested = true;
  }

  async function acceptHumanResolution(result, request) {
    const data = dataOf(result);
    const status = String(data?.requestStatus || "").toLowerCase();
    if (data?.requestId !== request.requestId || data?.executionId !== executionId(runFlow.result) ||
      !["resolved", "completed", "answered", "approved", "rejected"].includes(status) || data?.error != null) {
      throw new Error("The runner did not confirm the exact response for this run and request.");
    }
    runFlow.resolvedRequestIds.add(request.requestId);
    const current = humanRequest(runFlow.result);
    if (current?.id === request.requestId) {
      runFlow.result = { ...runFlow.result, humanRequest: { ...current, status } };
    }
    runFlow.humanDrafts.delete(request.requestId);
    runFlow.currentRequestId = request.requestId;
    latest = runFlow.result;
  }

  async function readRunSnapshot(toolName, { automatic = false } = {}) {
    if (!runFlow || runFlow.stage !== "monitor" || runFlow.busy) return false;
    if (automatic && (document.visibilityState !== "visible" || runHumanRequest())) return false;
    const runId = executionId(runFlow.result);
    if (!runId || terminalRun(runFlow.result.execution || {})) return false;
    captureRunHumanDraft();
    const epoch = ++runFlow.readEpoch;
    if (runFlow.waitTimer) { clearTimeout(runFlow.waitTimer); runFlow.waitTimer = undefined; }
    runFlow.busy = true;
    runFlow.errorMessage = "";
    renderIntegratedRunFlow();
    try {
      const args = toolName === "loomex_run_wait" ? { runId, timeoutSeconds: automatic ? 5 : 30 } : { runId };
      const result = await callTool(toolName, args, false);
      if (epoch !== runFlow.readEpoch) return false;
      if (result?.isError || result?.structuredContent?.ok === false) throw new Error(automatic ? "" : "The current run status could not be verified.");
      const establishingBaseline = runFlow.baselineRequired;
      acceptRunSnapshot(dataOf(result), runId, { initial: establishingBaseline });
      runFlow.baselineRequired = false;
      runFlow.errorMessage = "";
      runFlow.automaticFailures = 0;
      if (automatic) runFlow.automaticPolls = Math.min(runFlow.automaticPolls + 1, 2);
      else runFlow.automaticPolls = 0;
      return true;
    } catch (error) {
      if (epoch !== runFlow.readEpoch) return false;
      if (automatic) {
        runFlow.automaticFailures += 1;
        if (error?.message) runFlow.errorMessage = "Automatic refresh could not verify the returned run state. Use Refresh run to check again.";
      } else {
        const acceptedRequest = humanRequest(runFlow.result);
        runFlow.errorMessage = acceptedRequest && runFlow.resolvedRequestIds.has(acceptedRequest.id)
          ? "The response was accepted, but the current run status could not be verified. Refresh run to check it; the response will not be sent again."
          : error?.message || "The current run status could not be verified.";
        runFlow.error = undefined;
      }
      return false;
    } finally {
      if (epoch === runFlow.readEpoch) {
        runFlow.busy = false;
        renderIntegratedRunFlow();
      }
    }
  }

  function scheduleRunWait() {
    if (!runFlow || runFlow.stage !== "monitor" || runFlow.busy || runFlow.waitTimer || runHumanRequest() ||
      terminalRun(runFlow.result.execution || {}) || document.visibilityState !== "visible" || !connected ||
      runFlow.automaticFailures >= 3) return;
    const delays = [750, 2_000, 5_000];
    const delay = delays[Math.min(runFlow.automaticPolls, delays.length - 1)];
    runFlow.waitTimer = setTimeout(async () => {
      runFlow.waitTimer = undefined;
      await readRunSnapshot("loomex_run_wait", { automatic: true });
    }, delay);
  }

  function dataOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && structured.data ? structured.data : structured;
  }

  function methodOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && typeof structured.method === "string" ? structured.method : "";
  }

  function errorCodeOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && structured.error && typeof structured.error.code === "string"
      ? structured.error.code
      : undefined;
  }

  function preparedCommitTool() {
    if (latestMethod === "builder.prepare" || latestToolName === "loomex_builder_prepare") return "loomex_builder_commit";
    if (latestMethod === "editor.prepare" || latestToolName === "loomex_editor_prepare") return "loomex_editor_commit";
    return "loomex_run_commit";
  }

  function findId(data, name) {
    if (!data || typeof data !== "object") return undefined;
    if (typeof data[name] === "string") return data[name];
    for (const value of Object.values(data)) {
      if (value && typeof value === "object") {
        const found = findId(value, name);
        if (found) return found;
      }
    }
    return undefined;
  }

  function executionId(data) {
    return data && data.execution && typeof data.execution.id === "string"
      ? data.execution.id
      : undefined;
  }

  function humanRequest(data) {
    return data && data.humanRequest && typeof data.humanRequest === "object"
      ? data.humanRequest
      : undefined;
  }

  function interactionId(data) {
    const request = humanRequest(data);
    return request && typeof request.id === "string" ? request.id : undefined;
  }

  function humanRequestResolved(request) {
    if (!request || typeof request !== "object") return false;
    const status = String(request.status || "").toLowerCase();
    return ["resolved", "completed", "answered", "approved", "rejected", "cancelled", "canceled", "expired"].includes(status) ||
      (request.answer !== undefined && request.answer !== null);
  }

  function builderSessionId(data) {
    return data && data.builderSession && typeof data.builderSession.id === "string"
      ? data.builderSession.id
      : undefined;
  }

  function setError(error) {
    summary.classList.add("error");
    summary.setAttribute("role", "alert");
    summary.textContent = error && error.message ? String(error.message) : "The host could not complete this action.";
  }

  function structuredError(result) {
    const envelope = result && result.structuredContent ? result.structuredContent : result;
    return envelope && envelope.error && typeof envelope.error === "object" ? envelope.error : undefined;
  }

  function renderFailure(result) {
    errorDetails.replaceChildren();
    errorDetails.hidden = true;
    const error = structuredError(result);
    if (!error) return;
    summary.textContent = safeText(error.message) || "Loomex could not complete this action. Refresh to check its current status before trying again.";
    if (error.validationIssueVersion !== "v1" || !Array.isArray(error.validationIssues)) return;
    const issues = error.validationIssues.slice(0, 32).filter((issue) => issue && typeof issue === "object" && safeText(issue.message, 1024));
    if (!issues.length) return;
    const heading = element("h2", { className: "ui-label" }, "What needs attention");
    const list = element("div", { className: "ui-stack" });
    for (const issue of issues) {
      const card = element("section", { className: "ui-card" });
      const label = Number.isSafeInteger(issue.nodeIndex) && issue.nodeIndex >= 1 && issue.nodeIndex <= 1_000_000
        ? `Step ${issue.nodeIndex}`
        : "Workflow configuration";
      card.append(element("h3", { className: "ui-value" }, label));
      card.append(element("p", { className: "ui-caption" }, safeText(issue.message)));
      const nextActions = {
        correct_workflow_inputs: "Correct the workflow inputs, then prepare the run again.",
        update_workflow_definition: "Update the workflow definition, then prepare the run again.",
        prepare_runner_execution: "Prepare this run with a local runner execution root.",
        connect_runner: "Connect the required local runner, then refresh its status.",
        choose_supported_provider: "Choose a provider that supports this workflow, then prepare the run again.",
        allow_capability: "Allow the required workflow capability, then prepare the run again.",
        configure_capability_policy: "Configure the workflow capability policy, then prepare the run again.",
        review_workflow_validation: "Review the workflow validation details, fix the listed steps, then prepare the run again.",
      };
      const action = nextActions[issue.nextAction];
      if (action) card.append(element("p", {}, action));
      list.append(card);
    }
    errorDetails.append(heading, list);
    errorDetails.hidden = false;
  }

  function element(tag, attributes = {}, text = "") {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (name === "className") node.className = value;
      else if (name === "dataset") Object.assign(node.dataset, value);
      else if (name in node && name !== "list") node[name] = value;
      else node.setAttribute(name, String(value));
    }
    if (tag === "button" && text) setAction(node, text);
    else if (text) node.textContent = text;
    return node;
  }

  function normalizeInputType(value) {
    const normalized = String(value || "text").trim().toLowerCase().replaceAll("-", "_");
    if (["long_answer", "textarea"].includes(normalized)) return "long_text";
    return normalized;
  }

  function inputSpecSupported(spec) {
    if (!spec || typeof spec !== "object") return false;
    const supportedTypes = new Set(["text", "long_text", "date", "rating", "boolean", "radio", "checkbox"]);
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch
      ? spec.questions
      : [spec];
    if (!Array.isArray(questions) || !questions.length) return false;
    const ids = new Set();
    return questions.every((question) => {
      if (!question || typeof question !== "object" || typeof question.question !== "string" || !question.question.trim()) return false;
      const inputType = normalizeInputType(question.inputType || spec.inputType);
      if (!supportedTypes.has(inputType)) return false;
      if (batch) {
        if (typeof question.id !== "string" || !question.id.trim() || ids.has(question.id)) return false;
        ids.add(question.id);
      }
      if (inputType === "rating") {
        const minimumValid = question.minimum === undefined || Number.isSafeInteger(question.minimum);
        const maximumValid = question.maximum === undefined || Number.isSafeInteger(question.maximum);
        const minimum = question.minimum === undefined ? 1 : question.minimum;
        const maximum = question.maximum === undefined ? 5 : question.maximum;
        if (!minimumValid || !maximumValid || minimum > maximum) return false;
      }
      if (inputType === "radio" || inputType === "checkbox") {
        if (!Array.isArray(question.options) || typeof question.allowOther !== "boolean") return false;
        const optionIds = new Set();
        for (const option of question.options) {
          if (!option || typeof option !== "object" || typeof option.id !== "string" || !option.id || option.id === "other" || optionIds.has(option.id)) return false;
          if (typeof (option.label || option.text) !== "string" || !(option.label || option.text).trim()) return false;
          optionIds.add(option.id);
        }
        if (!optionIds.size && !question.allowOther) return false;
      }
      return true;
    });
  }

  function normalizedCopy(value) {
    return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
  }

  function questionCopyValues(spec) {
    if (!spec || typeof spec !== "object") return [];
    const questions = Array.isArray(spec.questions) ? spec.questions : [spec];
    return questions.map((question) => safeText(question && question.question)).filter(Boolean);
  }

  function appendRequestCopy(request, spec) {
    const presentation = humanPresentation(request);
    const questionCopies = new Set(questionCopyValues(spec).map(normalizedCopy));
    const candidateHeading = typeof request.title === "string" ? request.title.trim() : "";
    const heading = presentation || questionCopies.has(normalizedCopy(candidateHeading)) ? "" : candidateHeading;
    const descriptions = [];
    const seen = new Set([normalizedCopy(heading), ...questionCopies]);
    if (presentation) {
      seen.add(normalizedCopy(safeText(request.title)));
      seen.add(normalizedCopy(presentation.question));
      seen.add(normalizedCopy(presentation.summary));
    }
    for (const value of [request.description, request.prompt]) {
      if (typeof value !== "string" || !value.trim()) continue;
      const copy = value.trim();
      const normalized = normalizedCopy(copy);
      if (seen.has(normalized)) continue;
      seen.add(normalized);
      descriptions.push(copy);
    }
    if (!heading && !descriptions.length) return;
    const copy = element("div", { className: "request-copy" });
    if (heading) copy.append(element("h2", {}, heading));
    for (const description of descriptions) copy.append(element("p", {}, description));
    form.append(copy);
  }

  function initialQuestionAnswer(initial, questionId, batch) {
    if (!initial || typeof initial !== "object") return {};
    if (!batch) return initial;
    const answers = Array.isArray(initial.answers) ? initial.answers : [];
    return answers.find((answer) => answer && String(answer.questionId) === questionId) || {};
  }

  function requiredAnswer(schema, inputType, batch) {
    if (batch) return true;
    if (!schema || typeof schema !== "object") return true;
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    return required.has(inputType === "checkbox" ? "values" : "value");
  }

  function setChoiceName(control, questionIndex) {
    control.name = `question-${questionIndex}`;
    return control;
  }

  function appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer) {
    if (spec.allowOther === false) return;
    const choiceId = `question-${questionIndex}-other-choice`;
    const entryId = `question-${questionIndex}-other-entry`;
    const selected = inputType === "checkbox"
      ? Array.isArray(answer.values) && answer.values.includes("other")
      : answer.value === "other";
    const label = element("label", { className: "choice", htmlFor: choiceId });
    const choice = setChoiceName(element("input", {
      id: choiceId,
      type: inputType,
      value: "other",
      checked: selected,
      dataset: { option: "other" },
    }), questionIndex);
    label.append(choice, element("span", {}, spec.otherLabel || "Other"));
    const entry = element("div", { className: "other-entry", id: entryId, hidden: !selected });
    const otherLabel = element("label", { htmlFor: `question-${questionIndex}-other-text` }, "Describe your answer");
    const otherInput = element("input", {
      id: `question-${questionIndex}-other-text`,
      type: "text",
      value: typeof answer.otherText === "string" ? answer.otherText : "",
      autocomplete: "off",
      dataset: { otherText: "true" },
    });
    entry.append(otherLabel, otherInput);
    choice.addEventListener("change", () => {
      const active = inputType === "checkbox" ? choice.checked : true;
      entry.hidden = !active;
      if (active) otherInput.focus();
    });
    fieldset.addEventListener("change", () => {
      const otherSelected = Boolean(fieldset.querySelector('[data-option="other"]:checked'));
      entry.hidden = !otherSelected;
      if (!otherSelected) otherInput.removeAttribute("aria-invalid");
    });
    stack.append(label, entry);
  }

  function renderQuestion(spec, schema, initial, questionIndex, batch) {
    const questionId = String(spec.id || `question_${questionIndex + 1}`);
    const inputType = normalizeInputType(spec.inputType);
    const answer = initialQuestionAnswer(initial, questionId, batch);
    const required = requiredAnswer(schema, inputType, batch);
    const errorId = `question-${questionIndex}-error`;
    const legendId = `question-${questionIndex}-legend`;
    const fieldset = element("fieldset", {
      dataset: { questionId, inputType, required: String(required), errorId },
      "aria-describedby": errorId,
    });
    const legend = element("legend", { id: legendId }, spec.question);
    if (required) legend.append(" ", element("span", { className: "required-mark", "aria-hidden": "true" }, "*"));
    fieldset.append(legend);
    const stack = element("div", { className: "control-stack" });

    if (inputType === "text" || inputType === "long_text" || inputType === "date") {
      const labelId = `question-${questionIndex}-control-label`;
      const hintId = inputType === "date" ? `question-${questionIndex}-hint` : undefined;
      const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` });
      label.append(element("span", { className: "sr-only" }, inputType === "date" ? "Date" : "Your answer"));
      const control = element(inputType === "long_text" ? "textarea" : "input", {
        id: `question-${questionIndex}-value`,
        "aria-labelledby": `${legendId} ${labelId}`,
        "aria-describedby": [hintId, errorId].filter(Boolean).join(" "),
        type: inputType === "long_text" ? undefined : inputType === "date" ? "date" : "text",
        value: typeof answer.value === "string" ? answer.value : "",
        placeholder: inputType === "date" ? "YYYY-MM-DD" : "",
        inputMode: inputType === "date" ? "numeric" : undefined,
        pattern: inputType === "date" ? "[0-9]{4}-[0-9]{2}-[0-9]{2}" : undefined,
        autocomplete: "off",
        dataset: { value: "true" },
      });
      label.append(control);
      stack.append(label);
      if (inputType === "date") stack.append(element("p", { id: hintId, className: "hint" }, "Choose a calendar date."));
    } else if (inputType === "boolean") {
      const booleanLabels = spec.acceptanceLabels === true
        ? [{ value: "true", label: "Accept" }, { value: "false", label: "Request changes" }]
        : [{ value: "true", label: "Yes" }, { value: "false", label: "No" }];
      for (const option of booleanLabels) {
        const id = `question-${questionIndex}-${option.value}`;
        const label = element("label", { className: "choice", htmlFor: id });
        const selected = typeof answer.value === "boolean" && String(answer.value) === option.value;
        label.append(setChoiceName(element("input", { id, type: "radio", value: option.value, checked: selected }), questionIndex), element("span", {}, option.label));
        stack.append(label);
      }
    } else if (inputType === "rating") {
      const minimum = Number.isSafeInteger(spec.minimum) ? spec.minimum : 1;
      const maximum = Number.isSafeInteger(spec.maximum) && spec.maximum >= minimum ? spec.maximum : 5;
      fieldset.dataset.minimum = String(minimum);
      fieldset.dataset.maximum = String(maximum);
      const span = maximum - minimum + 1;
      if (span <= 20) {
        const choices = element("div", { className: "rating-options", role: "radiogroup", "aria-labelledby": legendId, "aria-describedby": errorId });
        for (let value = minimum; value <= maximum; value += 1) {
          const id = `question-${questionIndex}-rating-${value}`;
          const label = element("label", { className: "rating-choice", htmlFor: id });
          label.append(setChoiceName(element("input", {
            id, type: "radio", value: String(value), checked: answer.value === value,
          }), questionIndex), element("span", {}, String(value)));
          choices.append(label);
        }
        stack.append(choices);
      } else {
        const labelId = `question-${questionIndex}-control-label`;
        const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` }, `Rating (${minimum} to ${maximum})`);
        label.append(element("input", {
          id: `question-${questionIndex}-value`, type: "number", min: String(minimum), max: String(maximum), step: "1",
          value: Number.isSafeInteger(answer.value) ? String(answer.value) : "", dataset: { value: "true" },
          "aria-labelledby": `${legendId} ${labelId}`, "aria-describedby": errorId,
        }));
        stack.append(label);
      }
    } else {
      for (const [optionIndex, option] of (Array.isArray(spec.options) ? spec.options : []).entries()) {
        const optionId = String(option && option.id !== undefined ? option.id : `option_${optionIndex + 1}`);
        const optionLabel = String(option && (option.label || option.text) || optionId);
        const id = `question-${questionIndex}-option-${optionIndex}`;
        const selected = inputType === "checkbox"
          ? Array.isArray(answer.values) && answer.values.includes(optionId)
          : answer.value === optionId;
        const label = element("label", { className: "choice", htmlFor: id });
        label.append(setChoiceName(element("input", {
          id, type: inputType, value: optionId, checked: selected, dataset: { option: optionId },
        }), questionIndex), element("span", {}, optionLabel));
        stack.append(label);
      }
      appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer);
    }
    const error = element("p", { id: errorId, className: "field-error", role: "alert", hidden: true, dataset: { fieldError: "true" } });
    fieldset.append(stack, error);
    form.append(fieldset);
  }

  function questionForm(spec, schema, initial, request) {
    form.replaceChildren();
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch ? spec.questions : [spec];
    appendRequestCopy(request || {}, spec);
    if (questions.length > 1) form.append(element("p", { className: "form-guide" }, `${questions.length} questions · * Required`));
    const acceptance = humanPresentation(request || {})?.kind === "review" && questions.length === 1 &&
      normalizeInputType(questions[0].inputType || spec.inputType) === "boolean";
    questions.forEach((question, index) => renderQuestion({
      ...question,
      inputType: question.inputType || spec.inputType,
      acceptanceLabels: acceptance,
    }, schema, initial || {}, index, batch));
    form.dataset.formKind = "questions";
    form.dataset.collectionMode = batch ? "batch" : "single";
    form.hidden = false;
  }

  function typedForm(schema, initial, spec, request = {}) {
    if (inputSpecSupported(spec)) {
      questionForm(spec, schema, initial, request);
      return true;
    }
    if (spec && typeof spec === "object" && Object.keys(spec).length) {
      form.replaceChildren();
      appendRequestCopy(request, spec);
      form.append(element("p", { className: "notice error", role: "alert" }, "This question cannot be displayed here. Continue in the conversation for help with this request."));
      form.dataset.formKind = "invalid-questions";
      form.hidden = false;
      setError(new Error("This question cannot be displayed here. Continue in the conversation for help with this request."));
      return false;
    }
    form.replaceChildren();
    appendRequestCopy(request, spec);
    const properties = schema && schema.properties && typeof schema.properties === "object" ? schema.properties : null;
    const supported = properties && Object.values(properties).every((field) =>
      field && typeof field === "object" &&
      (Array.isArray(field.enum) || ["string", "boolean", "integer", "number"].includes(field.type))
    );
    if (!properties || !supported) {
      form.append(element("p", { className: "notice", role: "status" }, "This form cannot be displayed here. Continue in the conversation to provide your answer."));
      form.dataset.formKind = "unsupported";
      form.hidden = false;
      return false;
    }
    form.dataset.formKind = "generic";
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    for (const [name, field] of Object.entries(properties)) {
      const label = document.createElement("label");
      label.className = "field-label";
      label.htmlFor = `schema-${name}`;
      label.textContent = mode === "monitor" && name === "reason"
        ? "Cancellation reason"
        : name.replaceAll("_", " ");
      let control;
      if (Array.isArray(field.enum)) {
        control = document.createElement("select");
        const empty = element("option", { value: "", disabled: true }, "Choose an option");
        control.append(empty);
        for (const optionValue of field.enum) {
          const option = document.createElement("option");
          option.value = String(optionValue);
          option.textContent = String(optionValue);
          control.append(option);
        }
      } else if (field.type === "boolean") {
        control = document.createElement("select");
        control.append(element("option", { value: "", disabled: true }, "Choose yes or no"));
        for (const [value, bool] of [["true", "Yes"], ["false", "No"]]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = bool;
          control.append(option);
        }
      } else {
        control = document.createElement("input");
        control.type = field.type === "integer" || field.type === "number" ? "number" : "text";
      }
      control.id = `schema-${name}`;
      control.dataset.field = name;
      control.dataset.type = field.type || "string";
      control.dataset.required = required.has(name) ? "true" : "false";
      if (initial && initial[name] !== undefined) control.value = String(initial[name]);
      label.append(control);
      form.append(label);
    }
    form.dataset.formKind = "schema";
    form.hidden = false;
    return true;
  }

  function clearQuestionErrors() {
    for (const fieldset of form.querySelectorAll("fieldset[data-question-id]")) {
      for (const control of fieldset.querySelectorAll("input, textarea, select")) control.removeAttribute("aria-invalid");
      const error = fieldset.querySelector("[data-field-error]");
      if (error) { error.hidden = true; error.textContent = ""; }
    }
  }

  function questionError(fieldset, message, target) {
    const error = fieldset.querySelector("[data-field-error]");
    if (error) { error.textContent = message; error.hidden = false; }
    const focusTarget = target || fieldset.querySelector("input, textarea, select");
    if (focusTarget) {
      focusTarget.setAttribute("aria-invalid", "true");
      focusTarget.focus();
    }
    throw new Error(message);
  }

  function validDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return false;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    if (year < 1 || month < 1 || month > 12 || day < 1) return false;
    const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
    const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return day <= days[month - 1];
  }

  function collectQuestion(fieldset) {
    const type = fieldset.dataset.inputType;
    const required = fieldset.dataset.required === "true";
    if (["text", "long_text", "date"].includes(type)) {
      const control = fieldset.querySelector("[data-value]");
      const value = control ? control.value : "";
      if (required && !value.trim()) questionError(fieldset, "Answer this question.", control);
      if (type === "date" && value && !validDate(value)) questionError(fieldset, "Enter a real date in YYYY-MM-DD format.", control);
      return value === "" && !required ? {} : { value };
    }
    if (type === "boolean") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose Yes or No.");
      return selected ? { value: selected.value === "true" } : {};
    }
    if (type === "rating") {
      const control = fieldset.querySelector('input[type="radio"]:checked, [data-value]');
      const raw = control ? control.value : "";
      if (!raw && required) questionError(fieldset, "Choose a rating.");
      if (!raw) return {};
      const value = Number(raw);
      const minimum = Number(fieldset.dataset.minimum);
      const maximum = Number(fieldset.dataset.maximum);
      if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
        questionError(fieldset, `Enter a whole number from ${minimum} to ${maximum}.`, control);
      }
      return { value };
    }
    if (type === "radio") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose one option.");
      if (!selected) return {};
      const answer = { value: selected.value };
      if (selected.value === "other") {
        const other = fieldset.querySelector("[data-other-text]");
        if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
        answer.otherText = other.value;
      }
      return answer;
    }
    const selected = [...fieldset.querySelectorAll('input[type="checkbox"]:checked')];
    if (!selected.length && required) questionError(fieldset, "Choose at least one option.");
    if (!selected.length) return {};
    const answer = { values: selected.map((control) => control.value) };
    if (answer.values.includes("other")) {
      const other = fieldset.querySelector("[data-other-text]");
      if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
      answer.otherText = other.value;
    }
    return answer;
  }

  function collectAnswer() {
    if (["unsupported", "invalid-questions"].includes(form.dataset.formKind)) {
      throw new Error("This form cannot be displayed here. Continue in the conversation to provide your answer.");
    }
    const questionFields = [...form.querySelectorAll("fieldset[data-question-id]")];
    if (questionFields.length) {
      clearQuestionErrors();
      const batch = form.dataset.collectionMode === "batch";
      const answers = questionFields.map((fieldset) => ({
        questionId: fieldset.dataset.questionId,
        ...collectQuestion(fieldset),
      }));
      if (batch) return { answers };
      const [{ questionId: _questionId, ...answer }] = answers;
      return answer;
    }
    const answer = {};
    for (const control of form.querySelectorAll("[data-field]")) {
      const field = control.dataset.field;
      const type = control.dataset.type;
      const required = control.dataset.required === "true";
      if (control.value === "" && !required) continue;
      if (control.value === "" && required) throw new Error(`Enter ${field}.`);
      if (type === "boolean") answer[field] = control.value === "true";
      else if (type === "integer") answer[field] = Number.parseInt(control.value, 10);
      else if (type === "number") answer[field] = Number(control.value);
      else answer[field] = control.value;
    }
    return answer;
  }

  // Browsing only reads metadata. Execution preparation stays in the conversation.
  let browserPage = null;
  let browserArgs = { limit: 20 };
  let browserHistory = [];
  let browserSelected = null;
  let browserDetailResponse = null;
  let browserBusy = false;
  let browserEpoch = 0;
  const workflowIdValid = (id) => typeof id === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

  function browserButton(label, action, disabled = false) {
    const button = element("button", { type: "button", className: "secondary", disabled: disabled || !connected || browserBusy }, label);
    button.addEventListener("click", () => { if (!browserBusy && connected) action(); });
    return button;
  }

  async function browserRead(name, args, commit) {
    if (browserBusy || !connected) return;
    const epoch = ++browserEpoch;
    browserBusy = true;
    renderBrowser();
    summary.textContent = "Loading workflows…";
    summary.classList.remove("error");
    try {
      const result = await callTool(name, args, false);
      if (epoch !== browserEpoch) return;
      if (result.isError || result.structuredContent?.ok === false) throw new Error("Workflows could not be loaded. Try Refresh again.");
      const data = dataOf(result);
      if (pagedResponse(data)) {
        if (name === "loomex_workflows_list") { browserDetailResponse = null; commit(data); }
        else browserDetailResponse = { data, workflowId: args.workflowId };
      }
      else {
      if (name === "loomex_workflows_list" && !Array.isArray(data.workflows)) throw new Error("The workflow list is unavailable. Continue in the conversation.");
      if (name === "loomex_workflow_get" && (!data.workflow || data.workflow.id !== args.workflowId)) throw new Error("The workflow details could not be verified. Refresh and try again.");
      browserDetailResponse = null; commit(data);
      }
      authoritativeStateStale = false;
      summary.textContent = browserSelected ? "" : "";
    } catch (error) { if (epoch === browserEpoch) { authoritativeStateStale = true; setError(error); } }
    finally { if (epoch === browserEpoch) { browserBusy = false; renderBrowser(); } }
  }

  function loadBrowserPage(args, history) {
    return browserRead("loomex_workflows_list", args, (data) => {
      browserPage = data; browserArgs = args; browserHistory = history; browserSelected = null;
    });
  }

  async function requestWorkflowPreparation(id, detailData = browserSelected) {
    if (mode === "browser") return beginRunSetup(id, detailData);
    if (!workflowIdValid(id) || browserBusy || authoritativeStateStale) return;
    browserBusy = true;
    renderWorkflowDetail(detailData, { onPrepare: () => requestWorkflowPreparation(id, detailData) });
    try {
      const version = workflowVersionNumber(detailData?.selectedVersion);
      const result = await callTool("loomex_run_setup", { workflowId: id, ...(Number.isInteger(version) && version > 0 ? { version: String(version) } : {}) }, false);
      if (result?.isError || result?.structuredContent?.ok === false) throw new Error("Run setup could not be loaded. Try again or continue in the conversation.");
      const data = dataOf(result);
      if (!selectedWorkflowVersion(data) || data.workflow.id !== id) throw new Error("The exact workflow version could not be verified for run setup.");
      initializeRunSetup(data, false);
    } catch (error) { setError(error); }
    finally { browserBusy = false; runFlow ? renderIntegratedRunFlow() : renderWorkflowDetail(detailData, { onPrepare: () => requestWorkflowPreparation(id, detailData) }); }
  }

  async function requestCompleteWorkflowResponse(paged, rerender) {
    if (browserBusy || !connected) return;
    browserBusy = true; rerender();
    try {
      const result = await send("ui/message", { role: "user", content: [{ type: "text", text: `Read and present the complete Loomex workflow response using loomex_response_read with responseRef ${paged.responseRef}. Start at offset 0 and follow all nextOffset pages. This is a read-only request.` }] });
      if (result?.isError) throw new Error("The host could not send this request. Continue in the conversation to retrieve the workflow response.");
      summary.textContent = "The conversation has been asked to retrieve the complete workflow response.";
    } catch (error) { setError(error); }
    finally { browserBusy = false; rerender(); }
  }

  function renderWorkflowPagedResponse(paged, options = {}) {
    context.hidden = false; context.className = "ui-stack";
    context.setAttribute("aria-label", "Workflow response");
    context.setAttribute("aria-busy", String(browserBusy));
    context.replaceChildren();
    form.hidden = true; primary.hidden = true; secondary.hidden = true;
    refresh.disabled = !connected || browserBusy;
    if (options.onBack) context.append(browserButton("Back to workflows", options.onBack));
    context.append(element("p", { className: "ui-caption" }, "This workflow response is too large for the inline view. Read the complete response in the conversation."));
    context.append(browserButton("View complete response", () => requestCompleteWorkflowResponse(paged, () => renderWorkflowPagedResponse(paged, options)), authoritativeStateStale));
  }

  function workflowVersionNumber(version) {
    return Number.isInteger(version?.versionNumber) ? version.versionNumber : Number.isInteger(version?.version) ? version.version : undefined;
  }

  function workflowRefreshArgs(data) {
    const workflowId = safeText(data?.workflow?.id, 64) || findId(data, "workflowId");
    const selectedVersion = workflowVersionNumber(data?.selectedVersion);
    return {
      workflowId,
      ...(Number.isInteger(selectedVersion) && selectedVersion > 0 ? { version: String(selectedVersion) } : {}),
    };
  }

  function workflowDefinition(data) {
    const version = data?.selectedVersion || data?.activeVersion || data?.version || {};
    return { version, definition: version && typeof version.definition === "object" && version.definition ? version.definition : {} };
  }

  function workflowInputSchema(data, definition) {
    const settings = definition.settings && typeof definition.settings === "object" ? definition.settings : {};
    if (settings.inputSchema && typeof settings.inputSchema === "object") return settings.inputSchema;
    const start = Array.isArray(definition.nodes) && definition.nodes.find((node) => node && node.type === "start" && node.inputSchema && typeof node.inputSchema === "object");
    if (start) return start.inputSchema;
    return data?.inputSchema && typeof data.inputSchema === "object" ? data.inputSchema : {};
  }

  function workflowNodes(data, definition) {
    return Array.isArray(definition.nodes) ? definition.nodes : Array.isArray(data?.nodes) ? data.nodes : [];
  }

  function schemaType(schema) {
    if (!schema || typeof schema !== "object") return undefined;
    if (Array.isArray(schema.type)) return schema.type.map((item) => safeText(item, 40)).filter(Boolean).join(" or ") || undefined;
    return safeText(schema.type, 40) || (Array.isArray(schema.enum) ? "choice" : undefined);
  }

  function authoredLabel(key, schema) {
    const title = safeText(schema?.title, 120);
    if (title) return title;
    const text = safeText(key, 120);
    return text ? text.replaceAll("_", " ").replace(/([a-z0-9])([A-Z])/g, "$1 $2") : undefined;
  }

  function workflowProviders(nodes) {
    const providers = [];
    const seen = new Set();
    for (const node of nodes) {
      if (!node || !["ai_agent", "ai_prompt", "person"].includes(node.type)) continue;
      const config = node.config && typeof node.config === "object" ? node.config : {};
      const resolution = config.modelResolution && typeof config.modelResolution === "object" ? config.modelResolution : {};
      const provider = safeText(resolution.provider || config.provider || config.providerFamily, 120);
      const model = safeText(resolution.runtimeModel || resolution.model || config.model || config.modelKey, 160);
      const effort = safeText(config.reasoningEffort || config.reasoning_effort || config.effort, 80);
      if (!provider && !model && !effort) continue;
      const key = [provider, model, effort].join("\u0000");
      if (seen.has(key)) continue;
      seen.add(key); providers.push({ provider, model, effort });
    }
    return { items: providers.slice(0, 20), total: providers.length };
  }

  function renderWorkflowDetail(data, options = {}) {
    const workflow = data?.workflow || {};
    const { version, definition } = workflowDefinition(data);
    const nodes = workflowNodes(data, definition);
    const root = element("div", { className: "workflow-detail" });
    const heading = element("div", { className: "workflow-detail-heading" });
    const hero = element("div", { className: "ui-hero" });
    hero.append(element("h2", {}, safeText(workflow.name) || "Workflow"));
    const description = safeText(workflow.description || workflow.metadata?.description);
    if (description) hero.append(element("p", { className: "ui-caption" }, description));
    const meta = [formatStatus(workflow.status), workflowVersionNumber(version) !== undefined ? `Version ${workflowVersionNumber(version)}` : undefined];
    if (nodes.length) meta.push(`${nodes.length} step${nodes.length === 1 ? "" : "s"}`);
    hero.append(element("p", { className: "ui-meta" }, meta.filter(Boolean).join(" · ")));
    heading.append(hero);
    if (options.onBack) heading.append(browserButton("Back to workflows", options.onBack));
    root.append(heading);

    const inputSchema = workflowInputSchema(data, definition);
    const properties = inputSchema.properties && typeof inputSchema.properties === "object" ? inputSchema.properties : {};
    const inputEntries = Object.entries(properties);
    const required = new Set(Array.isArray(inputSchema.required) ? inputSchema.required.filter((item) => typeof item === "string") : []);
    const inputs = element("section", { className: "workflow-detail-section", "aria-label": "Input requirements" });
    inputs.append(element("h3", { className: "ui-label" }, "Input requirements"));
    const inputList = element("dl", { className: "workflow-detail-list" });
    for (const [key, schema] of inputEntries.slice(0, 50)) {
      const label = authoredLabel(key, schema);
      if (!label) continue;
      const row = element("div", { className: "workflow-detail-item" });
      row.append(element("dt", { className: "ui-value" }, label));
      const value = element("dd", { className: "ui-meta" });
      const type = schemaType(schema);
      if (type) value.append(element("span", {}, type));
      if (required.has(key)) value.append(element("span", { className: "ui-badge" }, "Required"));
      row.append(value); inputList.append(row);
    }
    if (inputList.childElementCount) inputs.append(inputList);
    else inputs.append(element("p", { className: "ui-caption" }, "No startup inputs are declared."));
    if (inputEntries.length > 50) inputs.append(element("p", { className: "ui-caption" }, `Showing the first 50 of ${inputEntries.length} input requirements.`));
    root.append(inputs);

    const providers = workflowProviders(nodes);
    if (providers.total) {
      const providerSection = element("section", { className: "workflow-detail-section", "aria-label": "AI configuration" });
      providerSection.append(element("h3", { className: "ui-label" }, "AI configuration"));

  function immutableCopy(value) {

  function exactJsonEqual(left, right) {

    if (Array.isArray(left)) return left.length === right.length && left.every((item, index) => exactJsonEqual(item, right[index]));
    const leftKeys = Object.keys(left).sort();

    return leftKeys.length === rightKeys.length && leftKeys.every((key, index) => key === rightKeys[index] && exactJsonEqual(left[key], right[key]));

  async function callTool(name, args, renderResult = true) {

      secondary.disabled = true;

  async function callMutation(name, slot, args) {
    let operation = mutationOperations.get(slot);
    if (!operation) {
      const idempotencyKey = uuid();
      mutationKeys.set(slot, idempotencyKey);
      operation = {
        name,
        slot,
        arguments: immutableCopy({ ...args, idempotencyKey }),
        uncertain: false,
        reconciled: false,

    const uncertain = ["NETWORK_AMBIGUOUS", "IDEMPOTENCY_REQUEST_IN_PROGRESS"].includes(errorCodeOf(result));

        });
      } else if (mode === "monitor" && pagedResponse(data)) {
        const response = pagedResponse(data);
        const messageResult = await send("ui/message", {
          role: "user",
          content: [{
            type: "text",
            text: `Read and present the complete Loomex result using loomex_response_read with responseRef ${response.responseRef}. Begin at offset 0, continue through every nextOffset, and verify checksumSha256 before presenting it.`,
          }],
        });
        if (messageResult && messageResult.isError === true) {
          throw new Error("The host could not send this result request. Continue in the conversation to retrieve it.");
        }
        summary.textContent = "The conversation has been asked to retrieve and present the complete result.";
      } else if (mode === "monitor") {
        if (terminalRun(data.execution || {})) throw new Error("This run is already complete.");
        const answer = collectAnswer();
        if (!answer.reason) throw new Error("Enter a cancellation reason.");
        const runId = executionId(data);
        await callMutation("loomex_run_cancel", `run:cancel:${runId}`, {
          runId, reason: answer.reason
        });
      } else if (mode === "interaction") {
        const approval = primary.textContent === "Approve";
        if (approval) {
          const requestId = interactionId(data);
          await callMutation("loomex_interaction_decide", `interaction:approve:${requestId}`, {
            requestId, decision: "approve"
          });
        } else {
          const requestId = interactionId(data);
          await callMutation("loomex_interaction_respond", `interaction:respond:${requestId}`, {
            requestId, answer: collectAnswer()
          });
        }
      } else if (mode === "authoring") {
        const sessionId = builderSessionId(data);
        await callMutation("loomex_builder_respond", `builder:respond:${sessionId}`, {
          sessionId, response: collectAnswer()
        });
      }
    } catch (error) { setError(error); }
  }));

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const waiter = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) waiter.reject(new Error("The host could not complete this action. Continue in the conversation for help."));
      else waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-input") {
      const toolName = message.params && (message.params.name || message.params.toolName);
      if (typeof toolName === "string") latestToolName = toolName;
      if (mode === "browser" && message.params?.arguments) {
        const args = message.params.arguments;
        browserArgs = { limit: Number.isInteger(args.limit) ? args.limit : 20, ...(typeof args.query === "string" ? { query: args.query } : {}), ...(typeof args.cursor === "string" ? { cursor: args.cursor } : {}), ...(typeof args.systemKey === "string" ? { systemKey: args.systemKey } : {}) };
        browserHistory = [];
      }
    }
    if (message.method === "ui/notifications/tool-result") render(message.params);
  }, { passive: true });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" && runFlow?.waitTimer) {
      clearTimeout(runFlow.waitTimer);
      runFlow.waitTimer = undefined;
    } else if (document.visibilityState === "visible") {
      scheduleRunWait();
    }
  }, { passive: true });

  setAction(refresh, "Refresh");
  setAction(document.getElementById("connection-info"), "Connection information");
  document.getElementById("connection-info").classList.add("info-button");
  setInterval(() => { if (document.visibilityState === "visible") updateClock(); }, 1000);

  const handshake = send("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "loomex", version: "0.2.14" },
    appCapabilities: { availableDisplayModes: ["inline"] }
  });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Portable MCP Apps bridge unavailable.")), 3000));
  Promise.race([handshake, timeout]).then(() => {
    connected = true;
    connection.textContent = "Connected";
    refresh.disabled = false;
    send("ui/notifications/initialized", {}, false);
    if (latest) render(latest);
    if (typeof ResizeObserver === "function") {
      let lastSize = "";
      const reportSize = () => {
        const box = document.querySelector("main").getBoundingClientRect();
        const size = { width: Math.ceil(document.documentElement.clientWidth), height: Math.ceil(box.height) };
        const key = `${size.width}:${size.height}`;
        if (key !== lastSize) {
          lastSize = key;
          send("ui/notifications/size-changed", size, false);
        }
      };
      new ResizeObserver(reportSize).observe(document.querySelector("main"));
      reportSize();
    }
  }).catch((error) => {
    connected = false;
    connection.textContent = "Headless tools remain available";
    setError(error);
  });
})();
</script>
</body>
</html>
