<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Loomex</title>
  <style>
    /* Primitive tokens: one palette and scale for every Loomex view. */
    :root {
      color-scheme: light dark;
      --green-700: #18765e; --green-600: #237e66;
      --red-700: #b3263a; --red-300: #ff8c9b; --white: #fff;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
      --radius-small: 6px; --radius-control: 9px; --radius-card: 12px;
      --font-small: 12px; --font-body: 14px; --font-title: 27px;
      --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      /* Semantic tokens: themes change these, never individual views. */
      --background: Canvas; --foreground: CanvasText;
      --accent: var(--green-700); --on-accent: var(--white);
      --accent-soft: color-mix(in srgb, var(--accent) 8%, var(--background));
      --danger: var(--red-700); --danger-button: var(--red-700);
      --danger-soft: color-mix(in srgb, var(--danger) 8%, var(--background));
      --line: color-mix(in srgb, var(--foreground) 17%, transparent);
      --muted: color-mix(in srgb, var(--foreground) 66%, var(--background));
      --surface: color-mix(in srgb, var(--foreground) 3%, var(--background));
      --focus: color-mix(in srgb, var(--accent) 60%, var(--foreground));
      /* Component tokens: shared shell, cards and controls. */
      --shell-width: 720px; --shell-padding: var(--space-6); --section-gap: var(--space-5);
      --card-padding: var(--space-4); --card-background: var(--background);
      --control-height: 42px; --control-border: color-mix(in srgb, var(--foreground) 44%, transparent);
      font: var(--font-body)/1.5 var(--font-sans);
    }
    @media (prefers-color-scheme: dark) { :root { --accent: var(--green-600); --danger: var(--red-300); } }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--foreground); background: var(--background); }
    main { display: grid; width: 100%; max-width: var(--shell-width); margin: 0 auto; padding: 0 var(--shell-padding); }
    .app-header, .app-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .app-header { min-height: 72px; border-bottom: 1px solid var(--line); }
    .app-brand { display: flex; align-items: center; min-width: 0; gap: var(--space-3); }
    .app-mark { display: grid; flex: none; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 800; }
    .app-heading { min-width: 0; display: grid; gap: 1px; }
    h1 { margin: 0; font-size: 15px; font-weight: 750; line-height: 1.25; }
    #view-label { margin: 0; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
    .app-body { display: grid; gap: var(--section-gap); padding: var(--space-5) 0; }
    .app-footer { min-height: 68px; border-top: 1px solid var(--line); }
    #connection { flex: none; font-size: 11px; color: var(--muted); }
    #summary { margin: 0; padding: 0; border: 0; background: transparent; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    #summary.error { color: var(--danger); background: var(--danger-soft); border-radius: var(--radius-control); padding: var(--space-3) var(--space-4); }
    .ui-stack, .field { display: grid; gap: var(--section-gap); }
    .ui-hero, .request-copy { display: grid; gap: var(--space-2); }
    .ui-hero h2, .request-copy h2 { margin: 0; font-size: var(--font-title); line-height: 1.2; font-weight: 700; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .request-copy p { margin: 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .ui-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); color: var(--muted); font-size: var(--font-small); }
    .ui-badge { max-width: 100%; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: var(--radius-small); padding: 2px 7px; font-size: 11px; font-weight: 650; }
    .ui-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin: 0; }
    .ui-card, fieldset { min-width: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--radius-card); padding: var(--card-padding); background: var(--card-background); }
    .ui-card { display: grid; align-content: start; gap: var(--space-2); }
    .ui-label { margin: 0; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .045em; text-transform: uppercase; }
    .ui-value { margin: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    .workspace-path { margin: 0; font: 11px/1.6 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
    .provider-row { display: grid; gap: 2px; }
    .ui-caption, .hint, .form-guide { margin: 0; font-size: var(--font-small); line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
    .ui-section { border-top: 1px solid var(--line); padding-top: var(--space-4); display: grid; gap: var(--space-3); }
    .ui-section h3 { margin: 0; }
    .workflow-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .workflow-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
    .workflow-row-copy { min-width: 0; display: grid; gap: 2px; }
    .workflow-row-actions, .workflow-search-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .workflow-row-actions button, .workflow-search-actions button { min-height: var(--control-height); padding: var(--space-2) var(--space-3); }
    .workflow-detail { display: grid; gap: var(--space-4); }
    .workflow-detail-heading { display: flex; align-items: start; justify-content: space-between; gap: var(--space-3); }
    .workflow-detail-heading .ui-hero { min-width: 0; }
    .workflow-detail-section { display: grid; gap: var(--space-2); border-top: 1px solid var(--line); padding-top: var(--space-3); }
    .workflow-detail-list { margin: 0; display: grid; gap: 0; }
    .workflow-detail-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
    .workflow-detail-item:last-child { border-bottom: 0; }
    .workflow-detail-item dd { margin: 0; text-align: right; }
    .ui-list { margin: 0; padding-left: var(--space-5); display: grid; gap: var(--space-1); font-size: 13px; }
    .ui-list li { overflow-wrap: anywhere; white-space: pre-wrap; }
    .progress-steps { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: var(--font-small); }
    .progress-steps li { display: flex; align-items: center; gap: var(--space-2); }
    .progress-steps li:not(:last-child)::after { content: "→"; color: var(--muted); }
    .progress-steps [aria-current="step"] { color: var(--foreground); font-weight: 700; }
    .review-list { margin: 0; display: grid; gap: var(--space-1); font-size: 13px; }
    .review-list dt { font-weight: 550; }
    .review-list dd { margin: 0 0 var(--space-2); white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-list .review-list { margin-left: var(--space-3); border-left: 2px solid var(--line); padding-left: var(--space-3); }
    .ui-callout, .notice { margin: 0; display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); background: var(--surface); border-radius: var(--radius-control); }
    .ui-callout h3 { margin: 0; font-size: var(--font-small); font-weight: 650; }
    .ui-callout p { margin: 0; font-size: var(--font-small); color: var(--muted); }
    .notice.error { color: var(--danger); background: var(--danger-soft); }
    .ui-disclosure { color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: var(--space-3); }
    .ui-disclosure summary { cursor: pointer; width: fit-content; padding: var(--space-1) 0; }
    .ui-disclosure dl { padding-top: var(--space-3); font-size: 11px; }
    .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    .app-body > .actions, .app-body .workflow-detail > .actions, .app-body nav.actions, .app-body section.actions { border-top: 1px solid var(--line); padding-top: var(--space-4); }
    button, input, select, textarea { font: inherit; color: inherit; background: var(--background); border-radius: var(--radius-control); border: 1px solid var(--control-border); padding: var(--space-2) var(--space-3); }
    button { min-height: var(--control-height); padding: var(--space-2) var(--space-4); cursor: pointer; background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 650; }
    button.secondary { background: transparent; color: var(--foreground); border-color: var(--line); font-weight: 550; }
    #refresh { border-color: transparent; color: var(--muted); }
    button.danger { background: var(--danger-button); border-color: var(--danger-button); color: var(--white); }
    button:not(:disabled):hover { filter: brightness(.92); }
    button.secondary:not(:disabled):hover { background: var(--surface); filter: none; }
    button:not(:disabled):active { filter: brightness(.85); }
    button:disabled { cursor: not-allowed; opacity: .48; }
    input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; margin: 0; padding: 0; accent-color: var(--accent); flex: none; }
    input:not([type="checkbox"]):not([type="radio"]), select, textarea { width: 100%; min-width: 0; min-height: var(--control-height); }
    textarea { min-height: 112px; resize: vertical; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    input:disabled, select:disabled, textarea:disabled { color: var(--muted); background: var(--surface); cursor: not-allowed; }
    legend { max-width: 100%; padding: 0 var(--space-1); font-weight: 650; overflow-wrap: anywhere; }
    .required-mark { color: var(--danger); }
    .control-stack { display: grid; gap: var(--space-3); }
    .choice { display: flex; align-items: flex-start; gap: var(--space-2); min-height: var(--control-height); border: 1px solid var(--line); border-radius: var(--radius-control); padding: var(--space-3); background: var(--background); cursor: pointer; font-weight: 550; }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .choice:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
    .choice:has(input:disabled), .rating-choice:has(input:disabled) { cursor: not-allowed; opacity: .65; }
    .choice input:focus-visible { outline: none; }
    .other-entry { display: grid; gap: var(--space-2); margin-left: 26px; }
    .field-label { display: grid; gap: var(--space-2); font-weight: 550; }
    .setup-fields { display: grid; gap: var(--space-4); }
    .setup-field { display: grid; gap: var(--space-2); }
    .setup-field > label { font-weight: 650; }
    .setup-field .workspace-path { padding: var(--space-2) 0; }
    .field-error { margin: 2px 0 0; color: var(--danger); font-size: var(--font-small); font-weight: 650; }
    .rating-options { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .rating-choice { position: relative; }
    .rating-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .rating-choice span { display: grid; place-items: center; min-width: var(--control-height); min-height: var(--control-height); border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--background); cursor: pointer; font-weight: 650; }
    .rating-choice input:checked + span { color: var(--on-accent); border-color: var(--accent); background: var(--accent); }
    .rating-choice input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 3px; }
    [aria-invalid="true"] { border-color: var(--danger) !important; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      :root { --shell-padding: var(--space-4); --font-title: 24px; }
      .ui-grid { grid-template-columns: 1fr; }
      .actions { display: grid; grid-template-columns: 1fr; }
      .actions button { width: 100%; }
      .workflow-row { grid-template-columns: 1fr; }
      .workflow-row-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workflow-row-actions button { width: 100%; }
      .workflow-detail-heading { display: grid; }
      .workflow-detail-heading > button { width: 100%; }
      .app-footer { align-items: stretch; flex-direction: column-reverse; padding: var(--space-4) 0; }
      .app-footer #connection { align-self: center; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body data-mode="__LOOMEX_MODE__">
<main>
  <header class="app-header">
    <div class="app-brand"><span class="app-mark" aria-hidden="true">L</span><div class="app-heading"><h1 id="title">Loomex</h1><p id="view-label">Workflow</p></div></div>
  </header>
  <section class="app-body" aria-label="Loomex workspace">
    <p id="summary" class="notice" role="status" aria-live="polite">Waiting for the authoritative tool result.</p>
    <p id="support-reference" class="hint" hidden></p>
    <section id="error-details" class="ui-stack" aria-label="Action details" hidden></section>
    <section id="context" aria-label="Review details" hidden></section>
    <section id="form" class="field" hidden></section>
  </section>
  <footer class="app-footer">
    <span id="connection">Connecting…</span>
    <div class="actions">
      <button id="refresh" class="secondary" type="button" disabled>Refresh</button>
      <button id="secondary" class="secondary" type="button" hidden disabled></button>
      <button id="primary" type="button" hidden disabled></button>
    </div>
  </footer>
</main>
<script>
(() => {
  "use strict";
  const mode = document.body.dataset.mode;
  const connection = document.getElementById("connection");
  const summary = document.getElementById("summary");
  const context = document.getElementById("context");
  const errorDetails = document.getElementById("error-details");
  const supportReference = document.getElementById("support-reference");
  const form = document.getElementById("form");
  const refresh = document.getElementById("refresh");
  const primary = document.getElementById("primary");
  const secondary = document.getElementById("secondary");
  const title = document.getElementById("title");
  const viewLabel = document.getElementById("view-label");
  const pending = new Map();
  const mutationKeys = new Map();
  const mutationOperations = new Map();
  let nextId = 1;
  let connected = false;
  let latest = null;
  let latestMethod = "";
  let latestToolName = "";
  let renderCount = 0;
  let authoritativeStateStale = false;
  let preparationPresentation = null;
  let runFlow = null;

  const labels = {
    browser: "Workflow browser",
    authoring: "Workflow authoring review",
    prepare: "Run workflow",
    monitor: "Run monitor",
    interaction: "Human interaction"
  };
  title.textContent = "Loomex";
  viewLabel.textContent = labels[mode] || "Workflow";

  function send(method, params, expectReply = true) {
    const message = { jsonrpc: "2.0", method, params };
    if (!expectReply) {
      window.parent.postMessage(message, "*");
      return Promise.resolve();
    }
    const id = nextId++;
    message.id = id;
    return new Promise((resolve, reject) => {
      const timeoutMs = method === "tools/call" ? 60_000 : 5_000;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error(method === "tools/call" ? "The runner did not reply in time." : "The host did not reply in time."));
      }, timeoutMs);
      pending.set(id, {
        resolve: (value) => { clearTimeout(timer); resolve(value); },
        reject: (error) => { clearTimeout(timer); reject(error); },
      });
      window.parent.postMessage(message, "*");
    });
  }

  function uuid() {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
      return globalThis.crypto.randomUUID();
    }
    throw new Error("This host cannot generate a safe idempotency UUID.");
  }

  // Render only the deliberately selected review fields, never the transport envelope.
  function reviewValue(value, key = "") {
    if (/secret|token|credential|authorization|confirmationkey/i.test(key)) return element("span", {}, "Sensitive value hidden");
    if (value === null || value === undefined) return element("span", {}, "Not specified");
    if (typeof value !== "object") return element("span", {}, typeof value === "boolean" ? (value ? "Yes" : "No") : String(value));
    const entries = Object.entries(value);
    if (!entries.length) return element("span", {}, "None");
    const list = element("dl", { className: "review-list" });
    for (const [key, item] of entries) {
      list.append(element("dt", {}, Array.isArray(value) ? `Item ${Number(key) + 1}` : key.replace(/([a-z])([A-Z])/g, "$1 $2").replaceAll("_", " ")));
      const detail = element("dd");
      detail.append(reviewValue(item, key));
      list.append(detail);
    }
    return list;
  }

  function reviewFields(fields, headingText = "Run status") {
    const heading = element("div", { className: "ui-hero" });
    heading.append(element("h2", {}, headingText));
    const list = element("dl", { className: "ui-grid" });
    for (const [label, value] of fields) {
      if (value === undefined) continue;
      const card = element("div", { className: "ui-card" });
      card.append(element("dt", { className: "ui-label" }, label));
      const detail = element("dd", { className: "ui-value" });
      detail.append(reviewValue(value));
      card.append(detail);
      list.append(card);
    }
    context.className = "ui-stack";
    context.replaceChildren(heading, list);
    context.hidden = !list.childElementCount;
  }

  function safeText(value, maximumLength = 4096) {
    return typeof value === "string" && value.trim() && value.trim().length <= maximumLength ? value.trim() : undefined;
  }

  function safeTextList(value, maximumItems = 50, maximumItemLength = 2048) {
    return Array.isArray(value) && value.length <= maximumItems && value.every((item) => safeText(item, maximumItemLength))
      ? value.map((item) => item.trim()).filter(Boolean)
      : undefined;
  }

  function humanPresentation(request) {
    const presentation = request && request.presentation;
    if (!presentation || presentation.version !== 1 || !["review", "clarification", "progress"].includes(presentation.kind)) return undefined;
    const textFields = ["stageLabel", "summary", "question"];
    const listFields = ["changedFiles", "verification", "limitations", "artifacts", "priorRequirements", "decisions", "openQuestions"];
    if (textFields.some((key) => presentation[key] !== undefined && !safeText(presentation[key]))) return undefined;
    if (listFields.some((key) => presentation[key] !== undefined && !safeTextList(presentation[key]))) return undefined;
    return presentation;
  }

  function appendTextList(parent, label, values, excluded = new Set()) {
    const items = (safeTextList(values) || []).filter((item) => !excluded.has(normalizedCopy(item)));
    if (!items.length) return 0;
    const section = element("section", { className: "ui-section" });
    section.append(element("h3", { className: "ui-label" }, label));
    const list = element("ul", { className: "ui-list" });
    for (const item of items) list.append(element("li", {}, item));
    section.append(list);
    parent.append(section);
    return items.length;
  }

  function appendRequirementsContext(parent, presentation, excluded) {
    const content = element("div", { className: "ui-stack" });
    const count = appendTextList(content, "Requirements gathered", presentation.priorRequirements, excluded) +
      appendTextList(content, "Decisions", presentation.decisions, excluded) +
      appendTextList(content, "Open questions", presentation.openQuestions, excluded);
    if (!count) return;
    const details = element("details", { className: "ui-disclosure" });
    details.append(element("summary", {}, `Requirements context (${count} ${count === 1 ? "item" : "items"})`), content);
    parent.append(details);
  }

  function appendProgress(parent, stageLabel) {
    const current = safeText(stageLabel);
    if (!current) return;
    const stages = ["Idea", "Clarify", "Build", "Review"];
    const normalized = current.toLowerCase();
    const matched = stages.find((stage) => normalized === stage.toLowerCase());
    if (!matched) {
      const meta = element("div", { className: "ui-meta" });
      meta.append(element("span", { className: "ui-badge" }, current));
      parent.append(meta);
      return;
    }
    const list = element("ol", { className: "progress-steps", "aria-label": "Workflow progress" });
    for (const stage of stages) {
      list.append(element("li", stage === matched ? { "aria-current": "step" } : {}, stage));
    }
    parent.append(list);
  }

  function renderHumanPresentation(request, spec) {
    const presentation = humanPresentation(request);
    if (!presentation) return false;
    const wrapper = element("div", { className: "ui-stack" });
    const hero = element("div", { className: "ui-hero" });
    const heading = safeText(request && request.title) || (presentation.kind === "review" ? "Implementation review" : "Requirements progress");
    hero.append(element("h2", {}, heading));
    appendProgress(hero, presentation.stageLabel);
    if (safeText(presentation.summary)) hero.append(element("p", { className: "ui-caption" }, safeText(presentation.summary)));
    wrapper.append(hero);
    const questionTexts = new Set(questionCopyValues(spec).map(normalizedCopy));
    appendTextList(wrapper, "Changed files", presentation.changedFiles, questionTexts);
    appendTextList(wrapper, "Checks", presentation.verification, questionTexts);
    appendTextList(wrapper, "Limitations", presentation.limitations, questionTexts);
    appendTextList(wrapper, "Artifacts", presentation.artifacts, questionTexts);
    if (presentation.kind === "review") {
      appendTextList(wrapper, "Requirements gathered", presentation.priorRequirements, questionTexts);
      appendTextList(wrapper, "Decisions", presentation.decisions, questionTexts);
      appendTextList(wrapper, "Open questions", presentation.openQuestions, questionTexts);
    } else {
      appendRequirementsContext(wrapper, presentation, questionTexts);
    }
    context.className = "ui-stack";
    context.replaceChildren(wrapper);
    context.hidden = false;
    return true;
  }

  function formatStatus(value) {
    const status = safeText(value);
    return status ? status.replaceAll("_", " ").replace(/\b\w/g, (letter) => letter.toUpperCase()) : undefined;
  }

  function formatDateTime(value) {
    const text = safeText(value);
    if (!text) return undefined;
    const date = new Date(text);
    return Number.isNaN(date.getTime()) ? undefined : new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(date);
  }

  function formatDuration(startedAt, endedAt) {
    const started = new Date(startedAt || "").getTime();
    const ended = endedAt ? new Date(endedAt).getTime() : Date.now();
    if (!Number.isFinite(started) || !Number.isFinite(ended) || ended < started) return undefined;
    const seconds = Math.floor((ended - started) / 1000);
    if (seconds < 60) return `${seconds}s`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ${seconds % 60}s`;
    const hours = Math.floor(minutes / 60);
    return `${hours}h ${minutes % 60}m`;
  }

  function terminalRun(run) {
    return ["completed", "failed", "canceled", "cancelled", "succeeded", "expired"].includes(String(run && run.status || "").toLowerCase());
  }

  function pagedResponse(output) {
    return output && typeof output.responseRef === "string" &&

      primary.hidden = false; primary.className = "danger"; primary.textContent = operation ? "Retry exact cancellation" : "Cancel run";
      primary.disabled = !connected || runFlow.busy || !runId;
      typedForm({ properties: { reason: { type: "string" } } }, {});
      if (operation) {
        const reason = form.querySelector("input");
        if (reason) { reason.value = operation.arguments.reason; reason.disabled = true; }
      }
    }
    if (runFlow.errorMessage) runFlowError(runFlow.errorMessage);
  }

  function renderIntegratedRunFlow() {
    if (!runFlow) return;
    renderCount += 1;
    if (runFlow.stage === "setup") renderRunSetup();
    else if (runFlow.stage === "review") renderRunReview();
    else renderRunStarted();
  }

  function mutationFailureMessage(result, fallback) {
    const error = structuredError(result);
    return safeText(error?.message, 1000) || fallback;
  }

  async function runFlowMutation(name, slot, label, args, accept) {
    if (runFlow.busy) return;
    let operation = runFlow.operations.get(slot);
    if (!operation) {
      operation = { name, slot, label, arguments: immutableCopy({ ...args, idempotencyKey: uuid() }) };
      runFlow.operations.set(slot, operation);
    }
    runFlow.busy = true; renderIntegratedRunFlow();
    try {
      const result = await callTool(operation.name, immutableCopy(operation.arguments), false);
      if (result?.isError || result?.structuredContent?.ok === false) {
        const ambiguous = ["NETWORK_AMBIGUOUS", "IDEMPOTENCY_REQUEST_IN_PROGRESS"].includes(errorCodeOf(result));
        if (!ambiguous) runFlow.operations.delete(slot);
        const retry = ambiguous ? " Retry sends the exact same request and operation ID." : " Correct the setup or try again.";
        runFlowError(`${mutationFailureMessage(result, `The ${label} could not be completed.`)}${retry}`);
        return;
      }
      const afterSuccess = await accept(result, operation.arguments);
      runFlow.operations.delete(slot);
      runFlow.errorMessage = "";
      authoritativeStateStale = false;
      if (typeof afterSuccess === "function") {
        try { afterSuccess(); } catch { /* A best-effort host notification cannot change the accepted mutation outcome. */ }
      }
    } catch (error) {
      authoritativeStateStale = false;
      runFlowError(`${error?.message || `The ${label} outcome is uncertain.`} Retry sends the exact same request and operation ID.`);
    } finally {
      runFlow.busy = false; renderIntegratedRunFlow();
    }
  }

  async function beginRunSetup(id, detailData) {
    if (!workflowIdValid(id) || browserBusy || authoritativeStateStale) return;
    browserBusy = true; renderBrowser();
    try {
      const version = workflowVersionNumber(detailData?.selectedVersion) ?? detailData?.workflow?.activeVersion ?? detailData?.workflow?.latestVersion;
      const result = await callTool("loomex_run_setup", { workflowId: id, ...(Number.isInteger(version) && version > 0 ? { version: String(version) } : {}) }, false);
      if (result?.isError || result?.structuredContent?.ok === false) throw new Error("Run setup could not be loaded. Try again or continue in the conversation.");
      const data = dataOf(result);
      if (!selectedWorkflowVersion(data) || data.workflow.id !== id) throw new Error("The exact workflow version could not be verified for run setup.");
      initializeRunSetup(data, true);
      summary.textContent = "Enter the required inputs and explicitly grant the workspace before review.";
    } catch (error) { setError(error); }
    finally { browserBusy = false; runFlow ? renderIntegratedRunFlow() : renderBrowser(); }
  }

  async function continueUnsupportedSetup() {
    const selected = runFlow?.selected;
    const result = await send("ui/message", { role: "user", content: [{ type: "text", text:
      `Help me set up Loomex workflow ${selected?.workflowId || "the selected workflow"} at exact version ${workflowVersionNumber(selected?.version) || "selected by the setup result"}. Its input schema cannot be collected safely in the app. Collect every required input and one workspace, then call loomex_run_prepare. Do not commit or execute the run without showing its exact preparation for confirmation.` }] });
    if (result?.isError) throw new Error("The host could not open the setup request. Continue in the conversation and ask to set up this workflow.");
    summary.classList.remove("error"); summary.setAttribute("role", "status");
    summary.textContent = "Continue in the conversation to provide the unsupported inputs and review the exact preparation.";
  }

  async function handleRunFlowPrimary() {
    if (!runFlow || runFlow.busy) return;
    if (runFlow.stage === "setup") {
      if (!runFlow.analysis.supported) { await continueUnsupportedSetup(); return; }
      const retained = runFlow.operations.values().next().value;
      if (retained) {
        if (retained.name === "loomex_workspace_grant") {
          await runFlowMutation(retained.name, retained.slot, retained.label, {}, acceptWorkspaceGrant);
        } else await runFlowMutation(retained.name, retained.slot, retained.label, {}, acceptRunPreparation);
        return;
      }
      const inputs = collectRunSetupInputs();
      runFlow.errorMessage = "";
      if (!runFlow.canonicalWorkspace || runFlow.workspaceDraft !== runFlow.canonicalWorkspace) {
        await runFlowMutation("loomex_workspace_grant", `workspace:${runFlow.workspaceDraft}`, "workspace grant", {
          workspacePath: runFlow.workspaceDraft,
          organizationId: runFlow.selected.organizationId,
        }, acceptWorkspaceGrant);
        return;
      }
      const preparedInputs = { ...inputs };
      if (runFlow.analysis.workspaceInputField) preparedInputs[runFlow.analysis.workspaceInputField] = runFlow.canonicalWorkspace;
      await runFlowMutation("loomex_run_prepare", `prepare:${runFlow.selected.versionId}:${runFlow.canonicalWorkspace}`, "preparation", {
        workflowId: runFlow.selected.workflowId,
        versionId: runFlow.selected.versionId,
        ...(Object.keys(preparedInputs).length ? { inputs: preparedInputs } : {}),
        workspacePath: runFlow.canonicalWorkspace,
      }, acceptRunPreparation);
      return;
    }
    if (runFlow.stage === "review") {
      const prepared = runFlow.prepared;
      if (!preparationReviewable(prepared)) throw new Error("Review the complete execution details in the conversation before starting.");
      const slot = `loomex_run_commit:${prepared.preparationId}`;
      await runFlowMutation("loomex_run_commit", slot, "start", {
        preparationId: prepared.preparationId,
        bindingDigest: prepared.bindingDigest,
        confirmationKey: prepared.confirmationKey,
      }, acceptRunCommit);
      return;
    }
    if (runFlow.stage === "monitor") {
      const runId = executionId(runFlow.result);
      if (!runId || terminalRun(runFlow.result.execution || {})) throw new Error("This run is already complete.");
      const slot = `run:cancel:${runId}`;
      if (runFlow.operations.has(slot)) {
        await runFlowMutation("loomex_run_cancel", slot, "cancellation", {}, acceptRunStatus);
        return;
      }
      const answer = collectAnswer();
      if (!answer.reason) throw new Error("Enter a cancellation reason.");
      await runFlowMutation("loomex_run_cancel", slot, "cancellation", { runId, reason: answer.reason }, acceptRunStatus);
    }
  }

  async function acceptWorkspaceGrant(result) {
    const data = dataOf(result);
    const canonical = safeText(data?.workspace?.path, 4096);
    const organizationId = safeText(data?.workspace?.organizationId, 64);
    const installationId = safeText(data?.workspace?.installationId, 64);
    if (!canonical || !canonical.startsWith("/") || organizationId !== runFlow.selected.organizationId || !workflowIdValid(installationId) || data.executionPolicy !== "host_user/v1") {
      throw new Error("The runner did not return a verified canonical workspace grant for this organization and installation.");
    }
    runFlow.canonicalWorkspace = canonical;
    runFlow.workspaceDraft = canonical;
    runFlow.installationId = installationId;
    if (runFlow.analysis.workspaceInputField) runFlow.inputDraft[runFlow.analysis.workspaceInputField] = canonical;
  }

  async function acceptRunPreparation(result, request) {
    const data = dataOf(result);
    const presentation = result?._meta?.["loomex/preparationReview"];
    const binding = data?.binding;
    const expectedInputs = request?.inputs || {};
    const exact = binding && binding.workflowId === runFlow.selected.workflowId && binding.versionId === runFlow.selected.versionId &&
      binding.organizationId === runFlow.selected.organizationId && binding.installationId === runFlow.installationId &&
      binding.workspacePath === runFlow.canonicalWorkspace && binding.executionPolicy === "host_user/v1" &&
      binding.inputs && exactJsonEqual(binding.inputs, expectedInputs) &&
      binding.providerConfiguration && typeof binding.providerConfiguration === "object";
    if (!exact || !presentationMatches(presentation, data)) throw new Error("The exact preparation review did not match the sealed setup. Continue in the conversation before starting.");
    preparationPresentation = presentation;
    latest = data;
    runFlow.prepared = immutableCopy(data);
    runFlow.stage = "review";
  }

  async function acceptRunCommit(result, request) {
    const data = dataOf(result);
    const runId = executionId(data);
    if (!runId || data.preparationId !== request.preparationId || data.executionPolicy !== "host_user/v1") throw new Error("The runner did not return a run bound to the exact preparation and execution policy.");
    latest = data;
    runFlow.result = data;
    runFlow.stage = "monitor";
    return () => send("ui/update-model-context", { content: [{ type: "text", text: `Loomex started run ${runId}. The app is showing its current authoritative status.` }] }, false);
  }

  async function acceptRunStatus(result, request) {
    const data = dataOf(result);
    if (executionId(data) !== request.runId) throw new Error("The runner did not return status for the requested run.");
    latest = data;
    runFlow.result = data;
  }

  async function continueRunInConversation() {
    const runId = executionId(runFlow?.result);
    if (!runId || runFlow?.busy || runFlow?.conversationBusy) return;
    runFlow.conversationBusy = true;
    renderIntegratedRunFlow();
    let message;
    let errorMessage;
    try {
      const result = await send("ui/message", { role: "user", content: [{ type: "text", text:
        `Monitor Loomex run ${runId} and surface its next required human interaction or final result. Do not start another run.` }] });
      if (result?.isError) throw new Error("The host could not open the run follow-up.");
      message = "The conversation has been asked to follow this run and surface its next required action.";
    } catch (error) { errorMessage = error?.message || "The host could not open the run follow-up."; }
    finally {
      runFlow.conversationBusy = false;
      renderIntegratedRunFlow();
      if (errorMessage) setError(new Error(errorMessage));
      else { summary.classList.remove("error"); summary.setAttribute("role", "status"); summary.textContent = message; }
    }
  }

  function dataOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && structured.data ? structured.data : structured;
  }

  function methodOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && typeof structured.method === "string" ? structured.method : "";
  }

  function errorCodeOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && structured.error && typeof structured.error.code === "string"
      ? structured.error.code
      : undefined;
  }

  function preparedCommitTool() {
    if (latestMethod === "builder.prepare" || latestToolName === "loomex_builder_prepare") return "loomex_builder_commit";
    if (latestMethod === "editor.prepare" || latestToolName === "loomex_editor_prepare") return "loomex_editor_commit";
    return "loomex_run_commit";
  }

  function findId(data, name) {
    if (!data || typeof data !== "object") return undefined;
    if (typeof data[name] === "string") return data[name];
    for (const value of Object.values(data)) {
      if (value && typeof value === "object") {
        const found = findId(value, name);
        if (found) return found;
      }
    }
    return undefined;
  }

  function executionId(data) {
    return data && data.execution && typeof data.execution.id === "string"
      ? data.execution.id
      : undefined;
  }

  function humanRequest(data) {
    return data && data.humanRequest && typeof data.humanRequest === "object"
      ? data.humanRequest
      : undefined;
  }

  function interactionId(data) {
    const request = humanRequest(data);
    return request && typeof request.id === "string" ? request.id : undefined;
  }

  function humanRequestResolved(request) {
    if (!request || typeof request !== "object") return false;
    const status = String(request.status || "").toLowerCase();
    return ["resolved", "completed", "answered", "approved", "rejected", "cancelled", "canceled", "expired"].includes(status) ||
      (request.answer !== undefined && request.answer !== null);
  }

  function builderSessionId(data) {
    return data && data.builderSession && typeof data.builderSession.id === "string"
      ? data.builderSession.id
      : undefined;
  }

  function setError(error) {
    summary.classList.add("error");
    summary.setAttribute("role", "alert");
    summary.textContent = error && error.message ? String(error.message) : "The host could not complete this action.";
  }

  function structuredError(result) {
    const envelope = result && result.structuredContent ? result.structuredContent : result;
    return envelope && envelope.error && typeof envelope.error === "object" ? envelope.error : undefined;
  }

  function renderFailure(result) {
    errorDetails.replaceChildren();
    errorDetails.hidden = true;
    const error = structuredError(result);
    if (!error) return;
    summary.textContent = safeText(error.message) || "Loomex could not complete this action. Refresh to check its current status before trying again.";
    if (error.validationIssueVersion !== "v1" || !Array.isArray(error.validationIssues)) return;
    const issues = error.validationIssues.slice(0, 32).filter((issue) => issue && typeof issue === "object" && safeText(issue.message, 1024));
    if (!issues.length) return;
    const heading = element("h2", { className: "ui-label" }, "What needs attention");
    const list = element("div", { className: "ui-stack" });
    for (const issue of issues) {
      const card = element("section", { className: "ui-card" });
      const label = Number.isSafeInteger(issue.nodeIndex) && issue.nodeIndex >= 1 && issue.nodeIndex <= 1_000_000
        ? `Step ${issue.nodeIndex}`
        : "Workflow configuration";
      card.append(element("h3", { className: "ui-value" }, label));
      card.append(element("p", { className: "ui-caption" }, safeText(issue.message)));
      const nextActions = {
        correct_workflow_inputs: "Correct the workflow inputs, then prepare the run again.",
        update_workflow_definition: "Update the workflow definition, then prepare the run again.",
        prepare_runner_execution: "Prepare this run with a local runner execution root.",
        connect_runner: "Connect the required local runner, then refresh its status.",
        choose_supported_provider: "Choose a provider that supports this workflow, then prepare the run again.",
        allow_capability: "Allow the required workflow capability, then prepare the run again.",
        configure_capability_policy: "Configure the workflow capability policy, then prepare the run again.",
        review_workflow_validation: "Review the workflow validation details, fix the listed steps, then prepare the run again.",
      };
      const action = nextActions[issue.nextAction];
      if (action) card.append(element("p", {}, action));
      list.append(card);
    }
    errorDetails.append(heading, list);
    errorDetails.hidden = false;
  }

  function element(tag, attributes = {}, text = "") {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (name === "className") node.className = value;
      else if (name === "dataset") Object.assign(node.dataset, value);
      else if (name in node && name !== "list") node[name] = value;
      else node.setAttribute(name, String(value));
    }
    if (text) node.textContent = text;
    return node;
  }

  function normalizeInputType(value) {
    const normalized = String(value || "text").trim().toLowerCase().replaceAll("-", "_");
    if (["long_answer", "textarea"].includes(normalized)) return "long_text";
    return normalized;
  }

  function inputSpecSupported(spec) {
    if (!spec || typeof spec !== "object") return false;
    const supportedTypes = new Set(["text", "long_text", "date", "rating", "boolean", "radio", "checkbox"]);
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch
      ? spec.questions
      : [spec];
    if (!Array.isArray(questions) || !questions.length) return false;
    const ids = new Set();
    return questions.every((question) => {
      if (!question || typeof question !== "object" || typeof question.question !== "string" || !question.question.trim()) return false;
      const inputType = normalizeInputType(question.inputType || spec.inputType);
      if (!supportedTypes.has(inputType)) return false;
      if (batch) {
        if (typeof question.id !== "string" || !question.id.trim() || ids.has(question.id)) return false;
        ids.add(question.id);
      }
      if (inputType === "rating") {
        const minimumValid = question.minimum === undefined || Number.isSafeInteger(question.minimum);
        const maximumValid = question.maximum === undefined || Number.isSafeInteger(question.maximum);
        const minimum = question.minimum === undefined ? 1 : question.minimum;
        const maximum = question.maximum === undefined ? 5 : question.maximum;
        if (!minimumValid || !maximumValid || minimum > maximum) return false;
      }
      if (inputType === "radio" || inputType === "checkbox") {
        if (!Array.isArray(question.options) || typeof question.allowOther !== "boolean") return false;
        const optionIds = new Set();
        for (const option of question.options) {
          if (!option || typeof option !== "object" || typeof option.id !== "string" || !option.id || option.id === "other" || optionIds.has(option.id)) return false;
          if (typeof (option.label || option.text) !== "string" || !(option.label || option.text).trim()) return false;
          optionIds.add(option.id);
        }
        if (!optionIds.size && !question.allowOther) return false;
      }
      return true;
    });
  }

  function normalizedCopy(value) {
    return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
  }

  function questionCopyValues(spec) {
    if (!spec || typeof spec !== "object") return [];
    const questions = Array.isArray(spec.questions) ? spec.questions : [spec];
    return questions.map((question) => safeText(question && question.question)).filter(Boolean);
  }

  function appendRequestCopy(request, spec) {
    const presentation = humanPresentation(request);
    const questionCopies = new Set(questionCopyValues(spec).map(normalizedCopy));
    const candidateHeading = typeof request.title === "string" ? request.title.trim() : "";
    const heading = presentation || questionCopies.has(normalizedCopy(candidateHeading)) ? "" : candidateHeading;
    const descriptions = [];
    const seen = new Set([normalizedCopy(heading), ...questionCopies]);
    if (presentation) {
      seen.add(normalizedCopy(safeText(request.title)));
      seen.add(normalizedCopy(presentation.question));
      seen.add(normalizedCopy(presentation.summary));
    }
    for (const value of [request.description, request.prompt]) {
      if (typeof value !== "string" || !value.trim()) continue;
      const copy = value.trim();
      const normalized = normalizedCopy(copy);
      if (seen.has(normalized)) continue;
      seen.add(normalized);
      descriptions.push(copy);
    }
    if (!heading && !descriptions.length) return;
    const copy = element("div", { className: "request-copy" });
    if (heading) copy.append(element("h2", {}, heading));
    for (const description of descriptions) copy.append(element("p", {}, description));
    form.append(copy);
  }

  function initialQuestionAnswer(initial, questionId, batch) {
    if (!initial || typeof initial !== "object") return {};
    if (!batch) return initial;
    const answers = Array.isArray(initial.answers) ? initial.answers : [];
    return answers.find((answer) => answer && String(answer.questionId) === questionId) || {};
  }

  function requiredAnswer(schema, inputType, batch) {
    if (batch) return true;
    if (!schema || typeof schema !== "object") return true;
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    return required.has(inputType === "checkbox" ? "values" : "value");
  }

  function setChoiceName(control, questionIndex) {
    control.name = `question-${questionIndex}`;
    return control;
  }

  function appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer) {
    if (spec.allowOther === false) return;
    const choiceId = `question-${questionIndex}-other-choice`;
    const entryId = `question-${questionIndex}-other-entry`;
    const selected = inputType === "checkbox"
      ? Array.isArray(answer.values) && answer.values.includes("other")
      : answer.value === "other";
    const label = element("label", { className: "choice", htmlFor: choiceId });
    const choice = setChoiceName(element("input", {
      id: choiceId,
      type: inputType,
      value: "other",
      checked: selected,
      dataset: { option: "other" },
    }), questionIndex);
    label.append(choice, element("span", {}, spec.otherLabel || "Other"));
    const entry = element("div", { className: "other-entry", id: entryId, hidden: !selected });
    const otherLabel = element("label", { htmlFor: `question-${questionIndex}-other-text` }, "Describe your answer");
    const otherInput = element("input", {
      id: `question-${questionIndex}-other-text`,
      type: "text",
      value: typeof answer.otherText === "string" ? answer.otherText : "",
      autocomplete: "off",
      dataset: { otherText: "true" },

    choice.addEventListener("change", () => {

    const inputType = normalizeInputType(spec.inputType);
    const answer = initialQuestionAnswer(initial, questionId, batch);
    const required = requiredAnswer(schema, inputType, batch);
    const errorId = `question-${questionIndex}-error`;
    const legendId = `question-${questionIndex}-legend`;
    const fieldset = element("fieldset", {
      dataset: { questionId, inputType, required: String(required), errorId },

    });

    fieldset.append(legend);

      const labelId = `question-${questionIndex}-control-label`;
      const hintId = inputType === "date" ? `question-${questionIndex}-hint` : undefined;
      const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` },
        inputType === "date" ? "Date" : "Your answer");
      const control = element(inputType === "long_text" ? "textarea" : "input", {
        id: `question-${questionIndex}-value`,
        "aria-labelledby": `${legendId} ${labelId}`,
        "aria-describedby": [hintId, errorId].filter(Boolean).join(" "),
        type: inputType === "long_text" ? undefined : inputType === "date" ? "date" : "text",
        value: typeof answer.value === "string" ? answer.value : "",
        placeholder: inputType === "date" ? "YYYY-MM-DD" : "",
        inputMode: inputType === "date" ? "numeric" : undefined,
        pattern: inputType === "date" ? "[0-9]{4}-[0-9]{2}-[0-9]{2}" : undefined,
        autocomplete: "off",

    } else if (inputType === "boolean") {

        ? [{ value: "true", label: "Accept" }, { value: "false", label: "Request changes" }]
        : [{ value: "true", label: "Yes" }, { value: "false", label: "No" }];

        const id = `question-${questionIndex}-${option.value}`;

        label.append(setChoiceName(element("input", { id, type: "radio", value: option.value, checked: selected }), questionIndex), element("span", {}, option.label));
        stack.append(label);

      const maximum = Number.isSafeInteger(spec.maximum) && spec.maximum >= minimum ? spec.maximum : 5;
      fieldset.dataset.minimum = String(minimum);

      } else {
