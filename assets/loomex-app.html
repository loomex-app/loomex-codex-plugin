<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Loomex</title>
  <style>
    /* Primitive tokens: one palette and scale for every Loomex view. */
    :root {
      color-scheme: light dark;
      --green-700: #18765e; --green-600: #237e66;
      --red-700: #b3263a; --red-300: #ff8c9b; --white: #fff;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
      --radius-small: 6px; --radius-control: 7px; --radius-card: 8px;
      --font-small: 12px; --font-body: 14px; --font-title: 20px;
      --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      /* Semantic tokens: themes change these, never individual views. */
      --background: Canvas; --foreground: CanvasText;
      --accent: var(--green-700); --on-accent: var(--white);
      --accent-soft: color-mix(in srgb, var(--accent) 8%, var(--background));
      --danger: var(--red-700); --danger-button: var(--red-700);
      --danger-soft: color-mix(in srgb, var(--danger) 8%, var(--background));
      --line: color-mix(in srgb, var(--foreground) 17%, transparent);
      --muted: color-mix(in srgb, var(--foreground) 66%, var(--background));
      --surface: color-mix(in srgb, var(--foreground) 3%, var(--background));
      --focus: color-mix(in srgb, var(--accent) 60%, var(--foreground));
      /* Component tokens: shared shell, cards and controls. */
      --shell-width: 720px; --shell-padding: var(--space-3); --section-gap: var(--space-3);
      --card-padding: var(--space-3); --card-background: var(--background);
      --control-height: 36px; --control-border: color-mix(in srgb, var(--foreground) 44%, transparent);
      font: var(--font-body)/1.5 var(--font-sans);
    }
    @media (prefers-color-scheme: dark) { :root { --accent: var(--green-600); --danger: var(--red-300); } }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--foreground); background: var(--background); }
    main { display: grid; width: 100%; max-width: var(--shell-width); margin: 0 auto; padding: 0 var(--shell-padding); }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-height: 48px; }
    h1 { margin: 0; font-size: 13px; font-weight: 650; line-height: 1.3; color: var(--muted); }
    .header-tools { display: flex; align-items: center; gap: var(--space-1); }
    .app-body { display: grid; gap: var(--section-gap); padding: 0 0 var(--space-2); }
    .app-footer { padding: var(--space-1) 0 var(--space-2); }
    .app-footer:not(:has(button:not([hidden]))) { display: none; }
    .run-clock { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .run-clock svg { width: 14px; height: 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    #summary { margin: 0; padding: 0; border: 0; background: transparent; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    #summary.error { color: var(--danger); background: var(--danger-soft); border-radius: var(--radius-control); padding: var(--space-3) var(--space-4); }
    .ui-stack, .field { display: grid; gap: var(--section-gap); }
    .ui-hero, .request-copy { display: grid; gap: var(--space-2); }
    .ui-hero h2, .request-copy h2 { margin: 0; font-size: var(--font-title); line-height: 1.2; font-weight: 700; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .request-copy p { margin: 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .ui-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); color: var(--muted); font-size: var(--font-small); }
    .ui-badge { max-width: 100%; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: var(--radius-small); padding: 2px 7px; font-size: 11px; font-weight: 650; }
    .ui-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin: 0; }
    .ui-card, fieldset { min-width: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--radius-card); padding: var(--card-padding); background: var(--card-background); }
    .ui-card { display: grid; align-content: start; gap: var(--space-2); }
    .ui-label { margin: 0; color: var(--muted); font-size: 12px; font-weight: 550; }
    .ui-value { margin: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    .workspace-path { margin: 0; font: 11px/1.6 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
    .provider-row { display: grid; gap: 2px; }
    .ui-caption, .hint, .form-guide { margin: 0; font-size: var(--font-small); line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
    .ui-section { border-top: 1px solid var(--line); padding-top: var(--space-2); display: grid; gap: var(--space-3); }
    .ui-section h3 { margin: 0; }
    .workflow-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .workflow-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
    .workflow-row-copy { min-width: 0; display: grid; gap: 2px; }
    .workflow-row-actions, .workflow-search-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .workflow-row-actions button, .workflow-search-actions button { min-height: var(--control-height); padding: var(--space-2) var(--space-3); }
    .workflow-detail { display: grid; gap: var(--space-3); }
    .workflow-detail-heading { display: flex; align-items: start; justify-content: space-between; gap: var(--space-3); }
    .workflow-detail-heading .ui-hero { min-width: 0; }
    .workflow-detail-section { display: grid; gap: var(--space-2); border-top: 1px solid var(--line); padding-top: var(--space-3); }
    .workflow-detail-list { margin: 0; display: grid; gap: 0; }
    .workflow-detail-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
    .workflow-detail-item:last-child { border-bottom: 0; }
    .workflow-detail-item dd { margin: 0; text-align: right; }
    .ui-list { margin: 0; padding-left: var(--space-5); display: grid; gap: var(--space-1); font-size: 13px; }
    .ui-list li { overflow-wrap: anywhere; white-space: pre-wrap; }
    .progress-steps { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: var(--font-small); }
    .progress-steps li { display: flex; align-items: center; gap: var(--space-2); }
    .progress-steps li:not(:last-child)::after { content: "→"; color: var(--muted); }
    .progress-steps [aria-current="step"] { color: var(--foreground); font-weight: 700; }
    .review-list { margin: 0; display: grid; gap: var(--space-1); font-size: 13px; }
    .review-list dt { font-weight: 550; }
    .review-list dd { margin: 0 0 var(--space-2); white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-list .review-list { margin-left: var(--space-3); border-left: 2px solid var(--line); padding-left: var(--space-3); }
    .ui-callout, .notice { margin: 0; display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); background: var(--surface); border-radius: var(--radius-control); }
    .ui-callout h3 { margin: 0; font-size: var(--font-small); font-weight: 650; }
    .ui-callout p { margin: 0; font-size: var(--font-small); color: var(--muted); }
    .notice.error { color: var(--danger); background: var(--danger-soft); }
    .ui-disclosure { color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: var(--space-3); }
    .ui-disclosure summary { cursor: pointer; width: fit-content; padding: var(--space-1) 0; }
    .ui-disclosure dl { padding-top: var(--space-3); font-size: 11px; }
    .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .app-body > .actions, .app-body .workflow-detail > .actions, .app-body nav.actions, .app-body section.actions { border-top: 1px solid var(--line); padding-top: var(--space-2); }
    button, input, select, textarea { font: inherit; color: inherit; background: var(--background); border-radius: var(--radius-control); border: 1px solid var(--control-border); padding: var(--space-2) var(--space-3); }
    button { min-height: var(--control-height); padding: var(--space-2) var(--space-4); cursor: pointer; background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 650; }
    button.secondary { background: transparent; color: var(--foreground); border-color: var(--line); font-weight: 550; }
    #refresh { border-color: transparent; color: var(--muted); }
    button.danger { background: var(--danger-button); border-color: var(--danger-button); color: var(--white); }
    button:not(:disabled):hover { filter: brightness(.92); }
    button.secondary:not(:disabled):hover { background: var(--surface); filter: none; }
    button:not(:disabled):active { filter: brightness(.85); }
    button:disabled { cursor: not-allowed; opacity: .48; }
    input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; margin: 0; padding: 0; accent-color: var(--accent); flex: none; }
    input:not([type="checkbox"]):not([type="radio"]), select, textarea { width: 100%; min-width: 0; min-height: var(--control-height); }
    textarea { min-height: 80px; resize: vertical; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    input:disabled, select:disabled, textarea:disabled { color: var(--muted); background: var(--surface); cursor: not-allowed; }
    legend { max-width: 100%; padding: 0 var(--space-1); font-weight: 650; overflow-wrap: anywhere; }
    .required-mark { color: var(--danger); }
    .control-stack { display: grid; gap: var(--space-3); }
    .choice { display: flex; align-items: flex-start; gap: var(--space-2); min-height: var(--control-height); border: 1px solid var(--line); border-radius: var(--radius-control); padding: var(--space-2); background: var(--background); cursor: pointer; font-weight: 550; }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .choice:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
    .choice:has(input:disabled), .rating-choice:has(input:disabled) { cursor: not-allowed; opacity: .65; }
    .choice input:focus-visible { outline: none; }
    .other-entry { display: grid; gap: var(--space-2); margin-left: 26px; }
    .field-label { display: grid; gap: var(--space-2); font-weight: 550; }
    .setup-fields { display: grid; gap: var(--space-4); }
    .setup-field { display: grid; gap: var(--space-2); }
    .setup-field > label { font-weight: 650; }
    .setup-field .workspace-path { padding: var(--space-2) 0; }
    .field-error { margin: 2px 0 0; color: var(--danger); font-size: var(--font-small); font-weight: 650; }
    .rating-options { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .rating-choice { position: relative; }
    .rating-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .rating-choice span { display: grid; place-items: center; min-width: var(--control-height); min-height: var(--control-height); border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--background); cursor: pointer; font-weight: 650; }
    .rating-choice input:checked + span { color: var(--on-accent); border-color: var(--accent); background: var(--accent); }
    .rating-choice input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 3px; }
    [aria-invalid="true"] { border-color: var(--danger) !important; }
    [hidden] { display: none !important; }
    button.icon-button { display: inline-grid; place-items: center; width: var(--control-height); min-width: var(--control-height); padding: 0; flex: none; }
    .icon-button svg { width: 18px; height: 18px; pointer-events: none; }
    button.info-button { color: var(--muted); background: transparent; border-color: transparent; }
    .tooltip { position: fixed; z-index: 10; max-width: min(300px, calc(100vw - 16px)); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--foreground); color: var(--background); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; box-shadow: 0 3px 12px #0002; }
    .inline-info { display: inline-flex; align-items: center; gap: var(--space-1); }
    .run-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); color: var(--muted); font-size: 13px; }
    .run-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; color: var(--foreground); }
    .run-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .run-status[data-state="completed"]::before, .run-status[data-state="succeeded"]::before { background: var(--accent); }
    .run-status[data-state="failed"]::before { background: var(--danger); }
    .run-status[data-state="running"]::before { background: var(--accent); animation: breathe 1.8s ease-in-out infinite; }
    #summary:empty, #summary[data-suppressed="true"]:not(.error) { display: none; }
    .activity { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; color: var(--muted); }
    .activity::before, button[aria-busy="true"]::before { content: ''; flex: none; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    button[aria-busy="true"] svg { display: none; }
    .workflow-search { display: flex; align-items: center; gap: var(--space-2); }
    .workflow-search input { flex: 1; }
    .workflow-search-actions { flex-wrap: nowrap; }
    .workflow-row-copy > .ui-caption { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { opacity: .35; } }
    @media (max-width: 520px) {
      :root { --shell-padding: var(--space-3); }
      .ui-grid { grid-template-columns: 1fr; }
      .workflow-detail-item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    }
    @media (pointer: coarse) { :root { --control-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body data-mode="__LOOMEX_MODE__">
<main>
  <header class="app-header">
    <h1 id="title">Workflows</h1>
    <div class="header-tools">
      <span id="run-clock" class="run-clock" hidden></span>
      <span id="connection" class="sr-only">Connecting…</span>
      <button id="connection-info" class="secondary" type="button">Connection information</button>
      <button id="refresh" class="secondary" type="button" disabled>Refresh</button>
    </div>
  </header>
  <section class="app-body" aria-label="Loomex workspace">
    <p id="activity" class="activity" role="status" hidden></p>
    <p id="summary" class="notice" role="status" aria-live="polite">Loading this view…</p>
    <p id="support-reference" class="hint" hidden></p>
    <section id="error-details" class="ui-stack" aria-label="Action details" hidden></section>
    <section id="context" aria-label="Review details" hidden></section>
    <section id="form" class="field" hidden></section>
  </section>
  <footer class="app-footer">
    <div class="actions">
      <button id="secondary" class="secondary" type="button" hidden disabled></button>
      <button id="primary" type="button" hidden disabled></button>
    </div>
  </footer>
</main>
<script>
(() => {
  "use strict";
  const mode = document.body.dataset.mode;
  const connection = document.getElementById("connection");
  const summary = document.getElementById("summary");
  const context = document.getElementById("context");
  const errorDetails = document.getElementById("error-details");
  const supportReference = document.getElementById("support-reference");
  const form = document.getElementById("form");
  const refresh = document.getElementById("refresh");
  const primary = document.getElementById("primary");
  const secondary = document.getElementById("secondary");
  const title = document.getElementById("title");

  const pending = new Map();
  const mutationKeys = new Map();
  const mutationOperations = new Map();
  let nextId = 1;
  let connected = false;
  let latest = null;
  let latestMethod = "";
  let latestToolName = "";
  let renderCount = 0;
  let authoritativeStateStale = false;
  let preparationPresentation = null;
  let runFlow = null;

  const labels = {
    browser: "Browse workflows",
    authoring: "Authoring review",
    prepare: "Review run",
    monitor: "Run monitor",
    interaction: "Your response"
  };
  title.textContent = labels[mode] || "Workflow";

  // Presentation helpers never determine mutation arguments or execution authority.
  const activeRequests = new Map();
  const iconPaths = {
    info: "M12 17v-5m0-4h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0",
    play: "m8 5 11 7-11 7Z", refresh: "M20 7v5h-5 M4 17v-5h5 M6 7a7 7 0 0 1 12-1l2 6 M4 12l2 6a7 7 0 0 0 12-1",
    search: "M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0",
    eye: "M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0",
    back: "m12 5-7 7 7 7 M5 12h15", next: "m12 5 7 7-7 7 M19 12H4",
    check: "m5 12 4 4L19 6", close: "m6 6 12 12 M6 18 18 6",
    stop: "M6 6h12v12H6Z", edit: "m14 5 5 5 M4 20l5-1L21 7l-4-4L5 15Z",
    shield: "m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z m-4 9 3 3 5-6",
    clock: "M12 6v6l4 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0",
    message: "M21 15a3 3 0 0 1-3 3H8l-5 3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3Z",
  };
  function icon(name) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [key, value] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.7", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true", focusable: "false" })) svg.setAttribute(key, value);
    const path = document.createElementNS(svg.namespaceURI, "path");
    path.setAttribute("d", iconPaths[name] || iconPaths.next);
    svg.append(path);
    return svg;
  }
  function actionIcon(label) {
    if (/information|limits|timing/i.test(label)) return "info";
    if (/retry|refresh|check runner/i.test(label)) return "refresh";
    if (/back|previous/i.test(label)) return "back";
    if (/clear|reject/i.test(label)) return "close";
    if (/search/i.test(label)) return "search";
    if (/cancel/i.test(label)) return "stop";
    if (/approve/i.test(label)) return "check";
    if (/edit/i.test(label)) return "edit";
    if (/grant/i.test(label)) return "shield";
    if (/wait/i.test(label)) return "clock";
    if (/conversation/i.test(label)) return "message";
    if (/start|prepare run/i.test(label)) return "play";
    if (/view|review/i.test(label)) return "eye";
    return "next";
  }
  function setAction(button, label) {
    button.classList.add("icon-button");
    button.setAttribute("aria-label", label);
    button.dataset.tooltip = label;
    button.replaceChildren(icon(actionIcon(label)), element("span", { className: "sr-only" }, label));
  }
  function infoButton(label, description) {
    const button = element("button", { type: "button", className: "secondary info-button" }, label);
    button.dataset.tooltip = description;
    return button;
  }
  const tooltip = element("div", { id: "ui-tooltip", className: "tooltip", role: "tooltip", hidden: true });
  document.body.append(tooltip);
  let tooltipTarget;
  let tooltipCloseTimer;
  function hideTooltip() {
    clearTimeout(tooltipCloseTimer);
    tooltip.hidden = true;
    tooltipTarget?.removeAttribute("aria-describedby");
    tooltipTarget = undefined;
  }
  function showTooltip(target) {
    if (!target?.dataset.tooltip || target.disabled) return;
    clearTimeout(tooltipCloseTimer);
    if (tooltipTarget !== target) hideTooltip();
    tooltipTarget = target;
    tooltip.textContent = target.id === "connection-info" ? connection.textContent : target.dataset.tooltip;
    tooltip.hidden = false;
    target.setAttribute("aria-describedby", tooltip.id);
    const rect = target.getBoundingClientRect();
    const box = tooltip.getBoundingClientRect();
    const width = document.documentElement.clientWidth;
    const height = document.documentElement.clientHeight;
    tooltip.style.left = `${Math.max(8, Math.min(rect.right - box.width, width - box.width - 8))}px`;
    const top = rect.bottom + box.height + 8 <= height ? rect.bottom + 4 : rect.top - box.height - 4;
    tooltip.style.top = `${Math.max(4, top)}px`;
  }
  function deferTooltipClose() {
    clearTimeout(tooltipCloseTimer);
    tooltipCloseTimer = setTimeout(() => {
      if (tooltipTarget !== document.activeElement && !tooltip.matches(":hover") && !tooltipTarget?.matches(":hover")) hideTooltip();
    }, 120);
  }
  document.addEventListener("pointerover", (event) => { const target = event.target.closest?.("[data-tooltip]"); if (target) showTooltip(target); });
  document.addEventListener("pointerout", deferTooltipClose);
  document.addEventListener("focusin", (event) => { const target = event.target.closest?.("[data-tooltip]"); if (target) showTooltip(target); else hideTooltip(); });
  document.addEventListener("focusout", deferTooltipClose);
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideTooltip(); });
  document.addEventListener("click", (event) => {
    const target = event.target.closest?.(".info-button");
    if (target) showTooltip(target);
    else hideTooltip();
  });
  window.addEventListener("resize", () => { if (tooltipTarget === document.activeElement) showTooltip(tooltipTarget); else hideTooltip(); });
  document.addEventListener("scroll", () => { if (tooltipTarget === document.activeElement) showTooltip(tooltipTarget); else hideTooltip(); }, true);

  function updateActivity() {
    const activity = document.getElementById("activity");
    if (!activity) return;
    const tool = [...activeRequests.values()].at(-1);
    const descriptions = {
      "ui/initialize": "Connecting…", loomex_run_commit: "Starting your run…",
      loomex_run_prepare: "Preparing your review…", loomex_run_setup: "Loading run inputs…",
      loomex_workspace_grant: "Checking workspace access…", loomex_run_wait: "Watching for the next update…",
      loomex_run_get: "Updating run status…", loomex_interaction_respond: "Sending your answer…",
      loomex_interaction_approve: "Sending your decision…", loomex_run_cancel: "Requesting cancellation…",

  function initializePreparedRunReview(data) {

  function reprepareArguments() {
    const binding = runFlow?.prepared?.binding;
    const selected = runFlow?.selected;
    if (!binding || !selected?.workflowId || !selected?.versionId || !selected?.organizationId ||
      binding.workflowId !== selected.workflowId || binding.versionId !== selected.versionId ||
      binding.organizationId !== selected.organizationId || binding.installationId !== runFlow.installationId ||

  }

  function stalePreparationError(code) {
    return ["EXECUTION_BINDING_CONFLICT", "PRECONDITION_FAILED", "PREPARATION_NOT_FOUND"].includes(code);
  }

  function runHumanRequest(data = runFlow?.result) {
    if (runFlow?.baselineRequired) return undefined;
    const request = humanRequest(data);
    const runId = executionId(data);
    if (!request || !runId || request?.execution?.id !== runId || humanRequestResolved(request) || runFlow?.resolvedRequestIds?.has(request.id)) return undefined;

  }

  function initializeRunMonitor(data, previous = runFlow, { acceptedCommit = false } = {}) {
    const runId = executionId(data);
    if (!runId) throw new Error("The runner did not return a verifiable run identity.");
    const organizationId = safeText(previous?.selected?.organizationId, 64) || safeText(previous?.organizationId, 64) || safeText(data?.execution?.organizationId, 64);
    const candidate = {
      ...(previous || {}),
      stage: "monitor",
      result: data,
      organizationId,
      operations: previous?.operations || new Map(),
      humanDrafts: previous?.humanDrafts || new Map(),
      resolvedRequestIds: previous?.resolvedRequestIds || new Set(),
      currentRequestId: previous?.currentRequestId,
      humanMode: undefined,
      busy: false,
      readEpoch: previous?.readEpoch || 0,
      automaticFailures: previous?.automaticFailures || 0,
      automaticPolls: previous?.automaticPolls || 0,
      waitTimer: previous?.waitTimer,
      baselineRequired: Boolean(acceptedCommit),
      returnToBrowser: Boolean(previous?.returnToBrowser),
    };
    runFlow = candidate;
    try {
      acceptRunSnapshot(data, runId, { initial: true });
    } catch (error) {
      if (!acceptedCommit) {
        runFlow = previous || { ...candidate, result: { execution: data.execution }, currentRequestId: undefined };
        throw error;
      }
      const safeResult = { ...data };
      delete safeResult.humanRequest;
      runFlow = {
        ...candidate,
        result: safeResult,
        currentRequestId: undefined,

  }

  function runSequence(data) {
    return Number.isSafeInteger(data?.latestSequence) && data.latestSequence >= 0 ? data.latestSequence : undefined;
  }

  function retainedInteractionOperation() {
    return [...(runFlow?.operations?.values() || [])].find((operation) =>
      ["loomex_interaction_respond", "loomex_interaction_decide"].includes(operation.name));
  }

  function consumeResolvedRunRequest(requestId) {
    if (!requestId) return;
    runFlow.resolvedRequestIds.add(requestId);
    runFlow.humanDrafts.delete(requestId);
    const operation = retainedInteractionOperation();
    if (operation?.arguments?.requestId === requestId) runFlow.operations.delete(operation.slot);
    if (runFlow.currentRequestId === requestId) runFlow.humanMode = undefined;
  }

  function acceptRunSnapshot(data, expectedRunId, { initial = false } = {}) {
    if (!data || executionId(data) !== expectedRunId) throw new Error("The runner returned status for a different run.");
    const previousData = runFlow.result;
    const execution = data.execution || {};
    const previousSequence = runSequence(previousData);
    const incomingSequence = runSequence(data);
    if (!initial && previousSequence !== undefined && incomingSequence !== undefined && incomingSequence < previousSequence) {
      throw new Error("The runner returned an older run snapshot.");
    }
    if (!initial && terminalRun(previousData?.execution || {}) && !terminalRun(execution)) {
      throw new Error("The runner returned a non-terminal state for a completed run.");

    let candidateCurrentRequestId = runFlow.currentRequestId;

      }
      const requestOrganization = safeText(request?.organizationId, 64);
      const requestExecutionOrganization = safeText(request?.execution?.organizationId, 64);
      if (requestOrganization && requestExecutionOrganization && requestOrganization !== requestExecutionOrganization) {

      }

  function captureRunHumanDraft() {

  function renderIntegratedRunFlow() {
