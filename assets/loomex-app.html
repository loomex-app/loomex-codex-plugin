<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Loomex</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --accent: #6857f5;
      --accent-soft: color-mix(in srgb, var(--accent) 11%, Canvas);
      --danger: #b3263a;
      --line: color-mix(in srgb, CanvasText 17%, transparent);
      --muted: color-mix(in srgb, CanvasText 66%, Canvas);
      --surface: color-mix(in srgb, CanvasText 3%, Canvas);
      --surface-raised: color-mix(in srgb, CanvasText 6%, Canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: CanvasText; background: Canvas; }
    main { display: grid; gap: 14px; width: 100%; max-width: 760px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; line-height: 1.25; letter-spacing: -.015em; }
    #connection { flex: none; font-size: 12px; color: var(--muted); }
    #summary { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-list { margin: 0; display: grid; gap: 8px; }
    .review-list dt { font-weight: 650; }
    .review-list dd { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-list .review-list { margin-left: 12px; border-left: 2px solid var(--line); padding-left: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .field { display: grid; gap: 13px; }
    button, input, select, textarea { font: inherit; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); padding: 8px 10px; color: inherit; background: Canvas; }
    button { min-height: 36px; cursor: pointer; background: var(--accent); color: white; border-color: var(--accent); font-weight: 650; }
    button.secondary { background: transparent; color: inherit; }
    button.danger { background: var(--danger); border-color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: .48; }
    input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; margin: 0; padding: 0; accent-color: var(--accent); }
    input[type="text"], input[type="number"], select, textarea { width: 100%; }
    textarea { min-height: 108px; resize: vertical; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent); outline-offset: 2px; }
    .notice { border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 9px 11px; background: var(--accent-soft); }
    .error { border-left-color: var(--danger); }
    .request-copy { display: grid; gap: 4px; }
    .request-copy h2 { margin: 0; font-size: 16px; }
    .request-copy p { margin: 0; color: var(--muted); white-space: pre-wrap; }
    .form-guide { margin: -2px 0 0; color: var(--muted); font-size: 12px; }
    fieldset { min-width: 0; margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 13px; background: var(--surface); }
    legend { max-width: 100%; padding: 0 5px; font-weight: 700; overflow-wrap: anywhere; }
    .required-mark { color: var(--danger); }
    .control-stack { display: grid; gap: 9px; }
    .choice { display: flex; align-items: flex-start; gap: 9px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: Canvas; cursor: pointer; font-weight: 550; }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .other-entry { display: grid; gap: 7px; margin-left: 26px; }
    .field-label { display: grid; gap: 7px; font-weight: 650; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; }
    .field-error { margin: 2px 0 0; color: var(--danger); font-size: 12px; font-weight: 650; }
    .rating-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .rating-choice { position: relative; }
    .rating-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .rating-choice span { display: grid; place-items: center; min-width: 40px; min-height: 40px; border: 1px solid var(--line); border-radius: 9px; background: Canvas; cursor: pointer; font-weight: 700; }
    .rating-choice input:checked + span { color: white; border-color: var(--accent); background: var(--accent); }
    .rating-choice input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent); outline-offset: 2px; }
    [aria-invalid="true"] { border-color: var(--danger) !important; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      main { padding: 12px; }
      .actions { display: grid; grid-template-columns: 1fr; }
      .actions button { width: 100%; }
      fieldset { padding: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-mode="__LOOMEX_MODE__">
<main>
  <header><h1 id="title">Loomex</h1><span id="connection">Connecting…</span></header>
  <p id="summary" class="notice" role="status" aria-live="polite">Waiting for the authoritative tool result.</p>
  <p id="support-reference" class="hint" hidden></p>
  <section id="context" aria-label="Review details" hidden></section>
  <section id="form" class="field" hidden></section>
  <div class="actions">
    <button id="refresh" class="secondary" type="button" disabled>Refresh server state</button>
    <button id="secondary" class="secondary" type="button" hidden disabled></button>
    <button id="primary" type="button" hidden disabled></button>
  </div>
</main>
<script>
(() => {
  "use strict";
  const mode = document.body.dataset.mode;
  const connection = document.getElementById("connection");
  const summary = document.getElementById("summary");
  const context = document.getElementById("context");
  const supportReference = document.getElementById("support-reference");
  const form = document.getElementById("form");
  const refresh = document.getElementById("refresh");
  const primary = document.getElementById("primary");
  const secondary = document.getElementById("secondary");
  const title = document.getElementById("title");
  const pending = new Map();
  const mutationKeys = new Map();
  const mutationOperations = new Map();
  let nextId = 1;
  let connected = false;
  let latest = null;
  let latestMethod = "";
  let latestToolName = "";
  let renderCount = 0;
  let lastRenderFailed = false;

  const labels = {
    authoring: "Workflow authoring review",
    prepare: "Prepared run review",
    monitor: "Run monitor",
    interaction: "Human interaction"
  };
  title.textContent = labels[mode] || "Loomex";

  function send(method, params, expectReply = true) {
    const message = { jsonrpc: "2.0", method, params };
    if (!expectReply) {
      window.parent.postMessage(message, "*");
      return Promise.resolve();
    }
    const id = nextId++;
    message.id = id;
    window.parent.postMessage(message, "*");
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  function uuid() {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
      return globalThis.crypto.randomUUID();
    }
    throw new Error("This host cannot generate a safe idempotency UUID.");
  }

  // Render only the deliberately selected review fields, never the transport envelope.
  function reviewValue(value, key = "") {
    if (/secret|token|credential|authorization|confirmationkey/i.test(key)) return element("span", {}, "Sensitive value hidden");
    if (value === null || value === undefined) return element("span", {}, "Not specified");
    if (typeof value !== "object") return element("span", {}, typeof value === "boolean" ? (value ? "Yes" : "No") : String(value));
    const entries = Object.entries(value);
    if (!entries.length) return element("span", {}, "None");
    const list = element("dl", { className: "review-list" });
    for (const [key, item] of entries) {
      list.append(element("dt", {}, Array.isArray(value) ? `Item ${Number(key) + 1}` : key.replace(/([a-z])([A-Z])/g, "$1 $2").replaceAll("_", " ")));
      const detail = element("dd");
      detail.append(reviewValue(item, key));
      list.append(detail);
    }
    return list;
  }

  function reviewFields(fields) {
    context.replaceChildren();
    const list = element("dl", { className: "review-list" });
    for (const [label, value] of fields) {
      if (value === undefined) continue;
      list.append(element("dt", {}, label));
      const detail = element("dd");
      detail.append(reviewValue(value));
      list.append(detail);
    }
    context.append(list);
    context.hidden = !list.childElementCount;
  }

  function preparationReviewable(output) {
    const binding = output.binding;
    return binding && ["organizationId", "installationId", "workflowId", "versionId", "workspacePath"]
      .every((key) => typeof binding[key] === "string" && binding[key].length) &&
      binding.executionPolicy === "host_user/v1" &&
      binding.inputs && typeof binding.inputs === "object" &&
      binding.providerConfiguration && typeof binding.providerConfiguration === "object";
  }

  function dataOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && structured.data ? structured.data : structured;
  }

  function methodOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && typeof structured.method === "string" ? structured.method : "";
  }

  function errorCodeOf(result) {
    const structured = result && result.structuredContent ? result.structuredContent : result;
    return structured && structured.error && typeof structured.error.code === "string"
      ? structured.error.code
      : undefined;
  }

  function preparedCommitTool() {
    if (latestMethod === "builder.prepare" || latestToolName === "loomex_builder_prepare") return "loomex_builder_commit";
    if (latestMethod === "editor.prepare" || latestToolName === "loomex_editor_prepare") return "loomex_editor_commit";
    return "loomex_run_commit";
  }

  function findId(data, name) {
    if (!data || typeof data !== "object") return undefined;
    if (typeof data[name] === "string") return data[name];
    for (const value of Object.values(data)) {
      if (value && typeof value === "object") {
        const found = findId(value, name);
        if (found) return found;
      }
    }
    return undefined;
  }

  function executionId(data) {
    return data && data.execution && typeof data.execution.id === "string"
      ? data.execution.id
      : undefined;
  }

  function humanRequest(data) {
    return data && data.humanRequest && typeof data.humanRequest === "object"
      ? data.humanRequest
      : undefined;
  }

  function interactionId(data) {
    const request = humanRequest(data);
    return request && typeof request.id === "string" ? request.id : undefined;
  }

  function humanRequestResolved(request) {
    if (!request || typeof request !== "object") return false;
    const status = String(request.status || "").toLowerCase();
    return ["resolved", "completed", "answered", "approved", "rejected", "cancelled", "canceled", "expired"].includes(status) ||
      (request.answer !== undefined && request.answer !== null);
  }

  function builderSessionId(data) {
    return data && data.builderSession && typeof data.builderSession.id === "string"
      ? data.builderSession.id
      : undefined;
  }

  function setError(error) {
    summary.classList.add("error");
    summary.setAttribute("role", "alert");
    summary.textContent = error && error.message ? String(error.message) : "The host could not complete this action.";
  }

  function element(tag, attributes = {}, text = "") {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (name === "className") node.className = value;
      else if (name === "dataset") Object.assign(node.dataset, value);
      else if (name in node && name !== "list") node[name] = value;
      else node.setAttribute(name, String(value));
    }
    if (text) node.textContent = text;
    return node;
  }

  function normalizeInputType(value) {
    const normalized = String(value || "text").trim().toLowerCase().replaceAll("-", "_");
    if (["long_answer", "textarea"].includes(normalized)) return "long_text";
    return normalized;
  }

  function inputSpecSupported(spec) {
    if (!spec || typeof spec !== "object") return false;
    const supportedTypes = new Set(["text", "long_text", "date", "rating", "boolean", "radio", "checkbox"]);
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch
      ? spec.questions
      : [spec];
    if (!Array.isArray(questions) || !questions.length) return false;
    const ids = new Set();
    return questions.every((question) => {
      if (!question || typeof question !== "object" || typeof question.question !== "string" || !question.question.trim()) return false;
      const inputType = normalizeInputType(question.inputType || spec.inputType);
      if (!supportedTypes.has(inputType)) return false;
      if (batch) {
        if (typeof question.id !== "string" || !question.id.trim() || ids.has(question.id)) return false;
        ids.add(question.id);
      }
      if (inputType === "rating") {
        const minimumValid = question.minimum === undefined || Number.isSafeInteger(question.minimum);
        const maximumValid = question.maximum === undefined || Number.isSafeInteger(question.maximum);
        const minimum = question.minimum === undefined ? 1 : question.minimum;
        const maximum = question.maximum === undefined ? 5 : question.maximum;
        if (!minimumValid || !maximumValid || minimum > maximum) return false;
      }
      if (inputType === "radio" || inputType === "checkbox") {
        if (!Array.isArray(question.options) || typeof question.allowOther !== "boolean") return false;
        const optionIds = new Set();
        for (const option of question.options) {
          if (!option || typeof option !== "object" || typeof option.id !== "string" || !option.id || option.id === "other" || optionIds.has(option.id)) return false;
          if (typeof (option.label || option.text) !== "string" || !(option.label || option.text).trim()) return false;
          optionIds.add(option.id);
        }
        if (!optionIds.size && !question.allowOther) return false;
      }
      return true;
    });
  }

  function appendRequestCopy(request) {
    const heading = typeof request.title === "string" ? request.title.trim() : "";
    const descriptions = [...new Set([request.description, request.prompt]
      .filter((value) => typeof value === "string" && value.trim())
      .map((value) => value.trim()))];
    if (!heading && !descriptions.length) return;
    const copy = element("div", { className: "request-copy" });
    if (heading) copy.append(element("h2", {}, heading));
    for (const description of descriptions) copy.append(element("p", {}, description));
    form.append(copy);
  }

  function initialQuestionAnswer(initial, questionId, batch) {
    if (!initial || typeof initial !== "object") return {};
    if (!batch) return initial;
    const answers = Array.isArray(initial.answers) ? initial.answers : [];
    return answers.find((answer) => answer && String(answer.questionId) === questionId) || {};
  }

  function requiredAnswer(schema, inputType, batch) {
    if (batch) return true;
    if (!schema || typeof schema !== "object") return true;
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    return required.has(inputType === "checkbox" ? "values" : "value");
  }

  function setChoiceName(control, questionIndex) {
    control.name = `question-${questionIndex}`;
    return control;
  }

  function appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer) {
    if (spec.allowOther === false) return;
    const choiceId = `question-${questionIndex}-other-choice`;
    const entryId = `question-${questionIndex}-other-entry`;
    const selected = inputType === "checkbox"
      ? Array.isArray(answer.values) && answer.values.includes("other")
      : answer.value === "other";
    const label = element("label", { className: "choice", htmlFor: choiceId });
    const choice = setChoiceName(element("input", {
      id: choiceId,
      type: inputType,
      value: "other",
      checked: selected,
      dataset: { option: "other" },
    }), questionIndex);
    label.append(choice, element("span", {}, spec.otherLabel || "Other"));
    const entry = element("div", { className: "other-entry", id: entryId, hidden: !selected });
    const otherLabel = element("label", { htmlFor: `question-${questionIndex}-other-text` }, "Describe your answer");
    const otherInput = element("input", {
      id: `question-${questionIndex}-other-text`,
      type: "text",
      value: typeof answer.otherText === "string" ? answer.otherText : "",
      autocomplete: "off",
      dataset: { otherText: "true" },
    });
    entry.append(otherLabel, otherInput);
    choice.addEventListener("change", () => {
      const active = inputType === "checkbox" ? choice.checked : true;
      entry.hidden = !active;
      if (active) otherInput.focus();
    });
    fieldset.addEventListener("change", () => {
      const otherSelected = Boolean(fieldset.querySelector('[data-option="other"]:checked'));
      entry.hidden = !otherSelected;
      if (!otherSelected) otherInput.removeAttribute("aria-invalid");
    });
    stack.append(label, entry);
  }

  function renderQuestion(spec, schema, initial, questionIndex, batch) {
    const questionId = String(spec.id || `question_${questionIndex + 1}`);
    const inputType = normalizeInputType(spec.inputType);
    const answer = initialQuestionAnswer(initial, questionId, batch);
    const required = requiredAnswer(schema, inputType, batch);
    const errorId = `question-${questionIndex}-error`;
    const legendId = `question-${questionIndex}-legend`;
    const fieldset = element("fieldset", {
      dataset: { questionId, inputType, required: String(required), errorId },
      "aria-describedby": errorId,
    });
    const legend = element("legend", { id: legendId }, spec.question);
    if (required) legend.append(" ", element("span", { className: "required-mark", "aria-hidden": "true" }, "*"));
    fieldset.append(legend);
    const stack = element("div", { className: "control-stack" });

    if (inputType === "text" || inputType === "long_text" || inputType === "date") {
      const labelId = `question-${questionIndex}-control-label`;
      const hintId = inputType === "date" ? `question-${questionIndex}-hint` : undefined;
      const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` },
        inputType === "date" ? "Date" : "Your answer");
      const control = element(inputType === "long_text" ? "textarea" : "input", {
        id: `question-${questionIndex}-value`,
        "aria-labelledby": `${legendId} ${labelId}`,
        "aria-describedby": [hintId, errorId].filter(Boolean).join(" "),
        type: inputType === "long_text" ? undefined : inputType === "date" ? "date" : "text",
        value: typeof answer.value === "string" ? answer.value : "",
        placeholder: inputType === "date" ? "YYYY-MM-DD" : "",
        inputMode: inputType === "date" ? "numeric" : undefined,
        pattern: inputType === "date" ? "[0-9]{4}-[0-9]{2}-[0-9]{2}" : undefined,
        autocomplete: "off",
        dataset: { value: "true" },
      });
      label.append(control);
      stack.append(label);
      if (inputType === "date") stack.append(element("p", { id: hintId, className: "hint" }, "Choose a calendar date."));
    } else if (inputType === "boolean") {
      for (const option of [{ value: "true", label: "Yes" }, { value: "false", label: "No" }]) {
        const id = `question-${questionIndex}-${option.value}`;
        const label = element("label", { className: "choice", htmlFor: id });
        const selected = typeof answer.value === "boolean" && String(answer.value) === option.value;
        label.append(setChoiceName(element("input", { id, type: "radio", value: option.value, checked: selected }), questionIndex), element("span", {}, option.label));
        stack.append(label);
      }
    } else if (inputType === "rating") {
      const minimum = Number.isSafeInteger(spec.minimum) ? spec.minimum : 1;
      const maximum = Number.isSafeInteger(spec.maximum) && spec.maximum >= minimum ? spec.maximum : 5;
      fieldset.dataset.minimum = String(minimum);
      fieldset.dataset.maximum = String(maximum);
      const span = maximum - minimum + 1;
      if (span <= 20) {
        const choices = element("div", { className: "rating-options", role: "radiogroup", "aria-labelledby": legendId, "aria-describedby": errorId });
        for (let value = minimum; value <= maximum; value += 1) {
          const id = `question-${questionIndex}-rating-${value}`;
          const label = element("label", { className: "rating-choice", htmlFor: id });
          label.append(setChoiceName(element("input", {
            id, type: "radio", value: String(value), checked: answer.value === value,
          }), questionIndex), element("span", {}, String(value)));
          choices.append(label);
        }
        stack.append(choices);
      } else {
        const labelId = `question-${questionIndex}-control-label`;
        const label = element("label", { id: labelId, className: "field-label", htmlFor: `question-${questionIndex}-value` }, `Rating (${minimum} to ${maximum})`);
        label.append(element("input", {
          id: `question-${questionIndex}-value`, type: "number", min: String(minimum), max: String(maximum), step: "1",
          value: Number.isSafeInteger(answer.value) ? String(answer.value) : "", dataset: { value: "true" },
          "aria-labelledby": `${legendId} ${labelId}`, "aria-describedby": errorId,
        }));
        stack.append(label);
      }
    } else {
      for (const [optionIndex, option] of (Array.isArray(spec.options) ? spec.options : []).entries()) {
        const optionId = String(option && option.id !== undefined ? option.id : `option_${optionIndex + 1}`);
        const optionLabel = String(option && (option.label || option.text) || optionId);
        const id = `question-${questionIndex}-option-${optionIndex}`;
        const selected = inputType === "checkbox"
          ? Array.isArray(answer.values) && answer.values.includes(optionId)
          : answer.value === optionId;
        const label = element("label", { className: "choice", htmlFor: id });
        label.append(setChoiceName(element("input", {
          id, type: inputType, value: optionId, checked: selected, dataset: { option: optionId },
        }), questionIndex), element("span", {}, optionLabel));
        stack.append(label);
      }
      appendOtherControl(stack, fieldset, inputType, questionIndex, spec, answer);
    }
    const error = element("p", { id: errorId, className: "field-error", role: "alert", hidden: true, dataset: { fieldError: "true" } });
    fieldset.append(stack, error);
    form.append(fieldset);
  }

  function questionForm(spec, schema, initial, request) {
    form.replaceChildren();
    appendRequestCopy(request || {});
    const batch = spec.collectionMode === "batch" || Array.isArray(spec.questions);
    const questions = batch ? spec.questions : [spec];
    form.append(element("p", { className: "form-guide" }, `${questions.length} ${questions.length === 1 ? "question" : "questions"} · * Required`));
    questions.forEach((question, index) => renderQuestion({ ...question, inputType: question.inputType || spec.inputType }, schema, initial || {}, index, batch));
    form.dataset.formKind = "questions";
    form.dataset.collectionMode = batch ? "batch" : "single";
    form.hidden = false;
  }

  function typedForm(schema, initial, spec, request = {}) {
    if (inputSpecSupported(spec)) {
      questionForm(spec, schema, initial, request);
      return true;
    }
    if (spec && typeof spec === "object" && Object.keys(spec).length) {
      form.replaceChildren();
      appendRequestCopy(request);
      form.append(element("p", { className: "notice error", role: "alert" }, "This question cannot be displayed here. Continue in the conversation for help with this request."));
      form.dataset.formKind = "invalid-questions";
      form.hidden = false;
      setError(new Error("This question cannot be displayed here. Continue in the conversation for help with this request."));
      return false;
    }
    form.replaceChildren();
    appendRequestCopy(request);
    const properties = schema && schema.properties && typeof schema.properties === "object" ? schema.properties : null;
    const supported = properties && Object.values(properties).every((field) =>
      field && typeof field === "object" &&
      (Array.isArray(field.enum) || ["string", "boolean", "integer", "number"].includes(field.type))
    );
    if (!properties || !supported) {
      form.append(element("p", { className: "notice", role: "status" }, "This form cannot be displayed here. Continue in the conversation to provide your answer."));
      form.dataset.formKind = "unsupported";
      form.hidden = false;
      return false;
    }
    form.dataset.formKind = "generic";
    const required = new Set(Array.isArray(schema.required) ? schema.required : []);
    for (const [name, field] of Object.entries(properties)) {
      const label = document.createElement("label");
      label.className = "field-label";
      label.htmlFor = `schema-${name}`;
      label.textContent = name.replaceAll("_", " ");
      let control;
      if (Array.isArray(field.enum)) {
        control = document.createElement("select");
        const empty = element("option", { value: "", disabled: true }, "Choose an option");
        control.append(empty);
        for (const optionValue of field.enum) {
          const option = document.createElement("option");
          option.value = String(optionValue);
          option.textContent = String(optionValue);
          control.append(option);
        }
      } else if (field.type === "boolean") {
        control = document.createElement("select");
        control.append(element("option", { value: "", disabled: true }, "Choose yes or no"));
        for (const [value, bool] of [["true", "Yes"], ["false", "No"]]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = bool;
          control.append(option);
        }
      } else {
        control = document.createElement("input");
        control.type = field.type === "integer" || field.type === "number" ? "number" : "text";
      }
      control.id = `schema-${name}`;
      control.dataset.field = name;
      control.dataset.type = field.type || "string";
      control.dataset.required = required.has(name) ? "true" : "false";
      if (initial && initial[name] !== undefined) control.value = String(initial[name]);
      label.append(control);
      form.append(label);
    }
    form.dataset.formKind = "schema";
    form.hidden = false;
    return true;
  }

  function clearQuestionErrors() {
    for (const fieldset of form.querySelectorAll("fieldset[data-question-id]")) {
      for (const control of fieldset.querySelectorAll("input, textarea, select")) control.removeAttribute("aria-invalid");
      const error = fieldset.querySelector("[data-field-error]");
      if (error) { error.hidden = true; error.textContent = ""; }
    }
  }

  function questionError(fieldset, message, target) {
    const error = fieldset.querySelector("[data-field-error]");
    if (error) { error.textContent = message; error.hidden = false; }
    const focusTarget = target || fieldset.querySelector("input, textarea, select");
    if (focusTarget) {
      focusTarget.setAttribute("aria-invalid", "true");
      focusTarget.focus();
    }
    throw new Error(message);
  }

  function validDate(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!match) return false;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    if (year < 1 || month < 1 || month > 12 || day < 1) return false;
    const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
    const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return day <= days[month - 1];
  }

  function collectQuestion(fieldset) {
    const type = fieldset.dataset.inputType;
    const required = fieldset.dataset.required === "true";
    if (["text", "long_text", "date"].includes(type)) {
      const control = fieldset.querySelector("[data-value]");
      const value = control ? control.value : "";
      if (required && !value.trim()) questionError(fieldset, "Answer this question.", control);
      if (type === "date" && value && !validDate(value)) questionError(fieldset, "Enter a real date in YYYY-MM-DD format.", control);
      return value === "" && !required ? {} : { value };
    }
    if (type === "boolean") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose Yes or No.");
      return selected ? { value: selected.value === "true" } : {};
    }
    if (type === "rating") {
      const control = fieldset.querySelector('input[type="radio"]:checked, [data-value]');
      const raw = control ? control.value : "";
      if (!raw && required) questionError(fieldset, "Choose a rating.");
      if (!raw) return {};
      const value = Number(raw);
      const minimum = Number(fieldset.dataset.minimum);
      const maximum = Number(fieldset.dataset.maximum);
      if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
        questionError(fieldset, `Enter a whole number from ${minimum} to ${maximum}.`, control);
      }
      return { value };
    }
    if (type === "radio") {
      const selected = fieldset.querySelector('input[type="radio"]:checked');
      if (!selected && required) questionError(fieldset, "Choose one option.");
      if (!selected) return {};
      const answer = { value: selected.value };
      if (selected.value === "other") {
        const other = fieldset.querySelector("[data-other-text]");
        if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
        answer.otherText = other.value;
      }
      return answer;
    }
    const selected = [...fieldset.querySelectorAll('input[type="checkbox"]:checked')];
    if (!selected.length && required) questionError(fieldset, "Choose at least one option.");
    if (!selected.length) return {};
    const answer = { values: selected.map((control) => control.value) };
    if (answer.values.includes("other")) {
      const other = fieldset.querySelector("[data-other-text]");
      if (!other || !other.value.trim()) questionError(fieldset, "Describe the Other option.", other);
      answer.otherText = other.value;
    }
    return answer;
  }

  function collectAnswer() {
    if (["unsupported", "invalid-questions"].includes(form.dataset.formKind)) {
      throw new Error("This form cannot be displayed here. Continue in the conversation to provide your answer.");
    }
    const questionFields = [...form.querySelectorAll("fieldset[data-question-id]")];
    if (questionFields.length) {
      clearQuestionErrors();
      const batch = form.dataset.collectionMode === "batch";
      const answers = questionFields.map((fieldset) => ({
        questionId: fieldset.dataset.questionId,
        ...collectQuestion(fieldset),
      }));
      if (batch) return { answers };
      const [{ questionId: _questionId, ...answer }] = answers;
      return answer;
    }
    const answer = {};
    for (const control of form.querySelectorAll("[data-field]")) {
      const field = control.dataset.field;
      const type = control.dataset.type;
      const required = control.dataset.required === "true";
      if (control.value === "" && !required) continue;
      if (control.value === "" && required) throw new Error(`Enter ${field}.`);
      if (type === "boolean") answer[field] = control.value === "true";
      else if (type === "integer") answer[field] = Number.parseInt(control.value, 10);
      else if (type === "number") answer[field] = Number(control.value);
      else answer[field] = control.value;
    }
    return answer;
  }

  function render(result) {
    renderCount += 1;
    latestMethod = methodOf(result) || latestMethod;
    const failed = Boolean(result && result.isError);
    lastRenderFailed = failed;
    const incoming = dataOf(result);
    if (!failed) latest = incoming;
    const output = latest || {};
    summary.classList.toggle("error", failed);
    summary.setAttribute("role", failed ? "alert" : "status");
    summary.textContent = failed
      ? "Loomex could not complete this action. Refresh to check its current status before trying again."
      : mode === "interaction"
        ? "Your response is needed to continue."
        : mode === "authoring"
          ? "Answer the questions to continue authoring."
          : "Current Loomex state loaded.";
    const envelope = result && result.structuredContent ? result.structuredContent : result;
    const reference = envelope && envelope.requestId;
    supportReference.hidden = !(failed && typeof reference === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(reference));
    supportReference.textContent = supportReference.hidden ? "" : `Support reference: ${reference}`;
    refresh.disabled = !connected;
    if (failed && latest) return;
    primary.hidden = true;
    secondary.hidden = true;
    form.hidden = true;
    form.replaceChildren();
    context.replaceChildren();
    context.hidden = true;

    if (mode === "prepare") {
      if (!failed) summary.textContent = "Review the exact operation, canonical workspace, organization, provider configuration, and host_user/v1 authority before starting.";
      const binding = output.binding || {};
      reviewFields([
        ["Workflow", binding.workflowId], ["Version", binding.versionId],
        ["Organization", binding.organizationId], ["Installation", binding.installationId],
        ["Workspace", binding.workspacePath], ["Inputs", binding.inputs],
        ["Providers", binding.providerConfiguration], ["Authoring", binding.authoring],
        ["Execution authority", binding.executionPolicy === "host_user/v1" ? "Runs as your macOS user in the selected workspace, with host access and no sandbox guarantee." : binding.executionPolicy],
      ]);
      if (!preparationReviewable(output)) summary.textContent = "The complete execution details are unavailable here. Continue in the conversation to review and prepare this operation.";
      primary.textContent = "Start this exact prepared operation";
      primary.hidden = false;
      primary.disabled = !connected || !preparationReviewable(output) || !findId(output, "preparationId") || !findId(output, "bindingDigest") || !findId(output, "confirmationKey");
    } else if (mode === "monitor") {
      const runId = executionId(output);
      const run = output.execution || {};
      reviewFields([["Run", run.name || run.id], ["Status", run.status], ["Started", run.startedAt], ["Completed", run.completedAt]]);
      secondary.textContent = "Wait for change";
      secondary.hidden = false;
      secondary.disabled = !connected || !runId;
      primary.textContent = "Request cancellation";
      primary.className = "danger";
      primary.hidden = false;
      primary.disabled = !connected || !runId;
      typedForm({ properties: { reason: { type: "string" } } }, { reason: "Cancelled by user" });
    } else if (mode === "interaction") {
      const request = humanRequest(output) || {};
      const requestId = interactionId(output);
      const requestType = request.type;
      const schema = request.responseSchema || request.outputSchema;
      if (humanRequestResolved(request)) {
        summary.textContent = "Response received. This request is complete.";
      } else if (requestType === "approval" || output.decisionRequired === true) {
        appendRequestCopy(request);
        form.hidden = false;
        secondary.textContent = "Reject";
        secondary.hidden = false;
        secondary.disabled = !connected || !requestId;
        primary.textContent = "Approve";
        primary.hidden = false;
        primary.disabled = !connected || !requestId;
      } else {
        const formReady = typedForm(schema, request.answer, request.inputSpec, request);
        primary.textContent = "Submit response";
        primary.hidden = false;
        primary.disabled = !connected || !requestId || !formReady;
      }
    } else if (mode === "authoring") {
      const sessionId = builderSessionId(output);
      const request = humanRequest(output) || {};
      const schema = request.responseSchema || request.outputSchema;
      if (sessionId && (schema || request.inputSpec)) {
        const formReady = typedForm(schema, request.answer || {}, request.inputSpec, request);
        primary.textContent = "Respond to authoring session";
        primary.hidden = false;
        primary.disabled = !connected || !formReady;
      }
    }
  }

  function immutableCopy(value) {
    const copy = structuredClone(value);
    const freeze = (item) => {
      if (!item || typeof item !== "object" || Object.isFrozen(item)) return item;
      for (const child of Object.values(item)) freeze(child);
      return Object.freeze(item);
    };
    return freeze(copy);
  }

  function currentMutationOperation() {
    return mutationOperations.values().next().value;
  }

  function clearMutationOperation(operation) {
    mutationOperations.delete(operation.slot);
    mutationKeys.delete(operation.slot);
  }

  function lockUncertainOperation(operation, reconciled = false) {
    for (const control of form.querySelectorAll("input, select, textarea")) control.disabled = true;
    form.dataset.uncertain = "true";
    summary.classList.add("error");
    summary.setAttribute("role", "alert");
    summary.textContent = reconciled
      ? "The server still reports this request as pending. Your original response remains locked; retry sends those exact answers and the same operation ID."
      : "The submission outcome is uncertain. Your original response is locked. Refresh server state to reconcile, or retry the exact same response and operation ID.";
    secondary.disabled = true;
    primary.textContent = "Retry exact response";
    primary.disabled = !connected;
    refresh.disabled = !connected;
    operation.uncertain = true;
    operation.reconciled = reconciled || operation.reconciled;
  }

  function unlockUncertainOperation(operation) {
    if (!operation.uncertain) return;
    for (const control of form.querySelectorAll("input, select, textarea")) control.disabled = false;
    delete form.dataset.uncertain;
    if (operation.name === "loomex_interaction_respond") primary.textContent = "Submit response";
    else if (operation.name === "loomex_builder_respond") primary.textContent = "Respond to authoring session";
    else if (operation.name === "loomex_run_cancel") primary.textContent = "Request cancellation";
    else if (operation.name === "loomex_interaction_decide") {
      primary.textContent = "Approve";
      secondary.textContent = "Reject";
      secondary.disabled = !connected;
    }
  }

  function operationStillPending(operation, data) {
    if (operation.name === "loomex_interaction_respond" || operation.name === "loomex_interaction_decide") {
      const request = humanRequest(data);
      if (!request || request.id !== operation.arguments.requestId) return false;
      return !humanRequestResolved(request);
    }
    if (operation.name === "loomex_builder_respond") {
      return builderSessionId(data) === operation.arguments.sessionId && Boolean(humanRequest(data));
    }
    return true;
  }

  function reconcilePendingOperation(result, operation) {
    if (result && result.isError) {
      render(result);
      lockUncertainOperation(operation, true);
      return;
    }
    const incoming = dataOf(result) || {};
    if (!operationStillPending(operation, incoming)) {
      clearMutationOperation(operation);
      render(result);
      summary.textContent = mode === "interaction"
        ? "Response received. The uncertain submission was reconciled and no retry is needed."
        : "Server state reconciled. This request no longer needs the pending retry.";
      return;
    }
    latestMethod = methodOf(result) || latestMethod;
    latest = incoming;

    lockUncertainOperation(operation, true);
  }

  async function callTool(name, args, renderResult = true) {
    const result = await send("tools/call", { name, arguments: args });
    if (renderResult) render(result);
    return result;
  }

  async function callMutation(name, slot, args) {
    let operation = mutationOperations.get(slot);
    if (!operation) {
      const idempotencyKey = uuid();
      mutationKeys.set(slot, idempotencyKey);
      operation = {
        name,
        slot,
        arguments: immutableCopy({ ...args, idempotencyKey }),
        uncertain: false,
        reconciled: false,
      };
      mutationOperations.set(slot, operation);
    } else if (operation.name !== name) {
      throw new Error("The retained operation does not match this action. Refresh server state before continuing.");
    }
    const result = await callTool(operation.name, immutableCopy(operation.arguments));
    const uncertain = ["NETWORK_AMBIGUOUS", "IDEMPOTENCY_REQUEST_IN_PROGRESS"].includes(errorCodeOf(result));
    if (uncertain) lockUncertainOperation(operation);
    else {
      unlockUncertainOperation(operation);
      clearMutationOperation(operation);
    }
    return result;
  }

  async function withPending(button, operation) {
    if (button.dataset.pending === "true") return;
    const actionButtons = [refresh, secondary, primary];
    const previousDisabled = actionButtons.map((candidate) => candidate.disabled);
    const previousRenderCount = renderCount;
    button.dataset.pending = "true";
    button.setAttribute("aria-busy", "true");
    for (const candidate of actionButtons) candidate.disabled = true;
    try {
      await operation();
    } finally {
      delete button.dataset.pending;
      button.removeAttribute("aria-busy");
      if (renderCount === previousRenderCount || lastRenderFailed) {
        actionButtons.forEach((candidate, index) => { candidate.disabled = previousDisabled[index]; });
      }
      const retainedOperation = currentMutationOperation();
      if (retainedOperation && retainedOperation.uncertain) {
        lockUncertainOperation(retainedOperation, retainedOperation.reconciled);
      }
    }
  }

  refresh.addEventListener("click", () => withPending(refresh, async () => {
    try {
      const data = latest || {};
      let toolName;
      let args;
      if (mode === "monitor" && executionId(data)) {
        toolName = "loomex_run_get";
        args = { runId: executionId(data) };
      } else if (mode === "interaction" && interactionId(data)) {
        toolName = "loomex_interaction_get";
        args = { requestId: interactionId(data) };
      } else if (mode === "authoring" && builderSessionId(data)) {
        toolName = "loomex_builder_get";
        args = { sessionId: builderSessionId(data) };
      } else if (mode === "authoring" && findId(data, "workflowId")) {
        toolName = "loomex_workflow_get";
        args = { workflowId: findId(data, "workflowId") };
      } else {
        toolName = "loomex_readiness";
        args = {};
      }
      const operation = currentMutationOperation();
      const result = await callTool(toolName, args, !operation);
      if (operation) reconcilePendingOperation(result, operation);
    } catch (error) { setError(error); }
  }));

  secondary.addEventListener("click", () => withPending(secondary, async () => {
    try {
      const retainedOperation = currentMutationOperation();
      if (retainedOperation) {
        lockUncertainOperation(retainedOperation);
        return;
      }
      const data = latest || {};
      if (mode === "monitor") {
        await callTool("loomex_run_wait", { runId: executionId(data), timeoutSeconds: 30 });
      } else if (mode === "interaction") {
        const requestId = interactionId(data);
        await callMutation("loomex_interaction_decide", `interaction:reject:${requestId}`, {
          requestId, decision: "reject"
        });
      }
    } catch (error) { setError(error); }
  }));

  primary.addEventListener("click", () => withPending(primary, async () => {
    try {
      const data = latest || {};
      const retainedOperation = currentMutationOperation();
      if (retainedOperation) {
        await callMutation(retainedOperation.name, retainedOperation.slot, {});
        return;
      }
      if (mode === "prepare") {
        if (!preparationReviewable(data)) throw new Error("Review the complete execution details in the conversation before starting.");
        const preparationId = findId(data, "preparationId");
        const commitTool = preparedCommitTool();
        await callMutation(commitTool, `${commitTool}:${preparationId}`, {
          preparationId,
          bindingDigest: findId(data, "bindingDigest"),
          confirmationKey: findId(data, "confirmationKey")
        });
      } else if (mode === "monitor") {
        const answer = collectAnswer();
        if (!answer.reason) throw new Error("Enter a cancellation reason.");
        const runId = executionId(data);
        await callMutation("loomex_run_cancel", `run:cancel:${runId}`, {
          runId, reason: answer.reason
        });
      } else if (mode === "interaction") {
        const approval = primary.textContent === "Approve";
        if (approval) {
          const requestId = interactionId(data);
          await callMutation("loomex_interaction_decide", `interaction:approve:${requestId}`, {
            requestId, decision: "approve"
          });
        } else {
          const requestId = interactionId(data);
          await callMutation("loomex_interaction_respond", `interaction:respond:${requestId}`, {
            requestId, answer: collectAnswer()
          });
        }
      } else if (mode === "authoring") {
        const sessionId = builderSessionId(data);
        await callMutation("loomex_builder_respond", `builder:respond:${sessionId}`, {
          sessionId, response: collectAnswer()
        });
      }
    } catch (error) { setError(error); }
  }));

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const waiter = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) waiter.reject(new Error("The host could not complete this action. Continue in the conversation for help."));
      else waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-input") {
      const toolName = message.params && (message.params.name || message.params.toolName);
      if (typeof toolName === "string") latestToolName = toolName;
    }
    if (message.method === "ui/notifications/tool-result") render(message.params);
  }, { passive: true });

  const handshake = send("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "loomex", version: "0.2.1" },
    appCapabilities: { availableDisplayModes: ["inline"] }
  });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Portable MCP Apps bridge unavailable.")), 3000));
  Promise.race([handshake, timeout]).then(() => {
    connected = true;
    connection.textContent = "Connected";
    refresh.disabled = false;
    send("ui/notifications/initialized", {}, false);
    if (latest) render(latest);
  }).catch((error) => {
    connected = false;
    connection.textContent = "Headless tools remain available";
    setError(error);
  });
})();
</script>
</body>
</html>
