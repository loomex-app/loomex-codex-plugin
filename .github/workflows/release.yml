name: Production release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact reviewed paired production tag runner-vX.Y.Z-plugin-vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    # Standard Apple Silicon runner: public CI must not depend on paid larger runners.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Verify native release platform
        run: |
          test "$(uname -m)" = arm64
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
      - name: Configure production signing and notarization
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MANIFEST_KEY_BASE64: ${{ secrets.MANIFEST_KEY_BASE64 }}
        run: |
          test -n "$CERTIFICATE_P12_BASE64" && test -n "$CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_APP_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$MANIFEST_KEY_BASE64"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MANIFEST_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/manifest-private.pem"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
          xcrun notarytool store-credentials loomex-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build signed and notarized release
        env:
          LOOMEX_CODESIGN_IDENTITY: ${{ secrets.LOOMEX_CODESIGN_IDENTITY }}
          LOOMEX_NOTARY_PROFILE: loomex-ci
          LOOMEX_MANIFEST_SIGNING_KEY: ${{ runner.temp }}/manifest-private.pem
        run: ./scripts/build-release.sh --production --output "$RUNNER_TEMP/release"
      - name: Verify production installer
        run: |
          openssl rsa -in "$RUNNER_TEMP/manifest-private.pem" -pubout -out "$RUNNER_TEMP/manifest-public.pem"
          ./scripts/install.sh "$RUNNER_TEMP/release" --public-key "$RUNNER_TEMP/manifest-public.pem" --install-base "$RUNNER_TEMP/production-install"
      - name: Export immutable production distribution
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          npm run build
          python3 scripts/package-public-release.py --release "$RUNNER_TEMP/release" --output "$RUNNER_TEMP/public/loomex-plugin-${version}-darwin-arm64.tar.gz" --release-tag "$RELEASE_TAG" --source-revision "$GITHUB_SHA" --public-key "$RUNNER_TEMP/manifest-public.pem" --qualify-clean-source
      - uses: actions/upload-artifact@v4
        with:
          name: loomex-plugin-darwin-arm64
          path: ${{ runner.temp }}/public/*
          if-no-files-found: error
