name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Standard Apple Silicon runner: public CI must not depend on paid larger runners.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LOOMEX_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Verify native release platform
        run: |
          test "$(uname -m)" = arm64
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run ui:check
      - run: npm run compatibility:check
      - run: npx playwright install chromium
      - run: npm test
        env:
          DEBUG: pw:browser
      - run: ./scripts/test-packaging.sh
      - run: ./scripts/test-node-runtime.sh
  installer:
    # This independently rebuilds and tests the immutable source snapshot.
    # Run alongside source checks; neither qualification replaces the other.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LOOMEX_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Verify native release platform
        run: |
          test "$(uname -m)" = arm64
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
      - name: Validate with Codex plugin installer
        env:
          LOOMEX_ALLOW_UNSAFE_DEV_INSTALL: "1"
        run: |
          npm install --global @openai/codex@0.146.0
          ./scripts/build-release.sh --unsigned-development --output "$RUNNER_TEMP/release"
          ./scripts/install.sh "$RUNNER_TEMP/release" --allow-unsigned-development --install-base "$RUNNER_TEMP/loomex-plugin"
          version="$(node -p 'require("./package.json").version')"
          codex plugin marketplace add "$RUNNER_TEMP/loomex-plugin" --json
          codex plugin add loomex@loomex-private --json
          codex plugin list | grep -F loomex
          codex plugin remove loomex@loomex-private
          codex plugin marketplace remove loomex-private
